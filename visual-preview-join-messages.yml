schema: 1
plugin: ARC — native join message dialog
minecraft-version: 26.1.2
minecraft-client-sha1: 4e618f09a0c649dde3fdf829df443ce0b8831e65
gallery-accent: '#d7b486'

resource-pack:
  url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip
  sha256-url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip.sha256

sources:
  dialog:
    path: src/main/resources/modules/join-message-dialog.yml
    root: text
    include: ['*']

placeholders:
  # Keep the literal placeholder readable without recursively expanding the preview token.
  player_name: '%<#aaa49a>player_name%'
  page: '1'
  pages: '10'
  selected: '2'
  count: '2'
  limit: '512'
  message: 'Архитектор23 выполз из своей пещеры'

surfaces:
  dialogs:
    - id: join-messages-page
      source: dialog
      format: reference-multi-action
      name-key: join-title
      external-title-key: join-title
      columns: 2
      body:
        - {id: help, text-key: catalog-help, width: 600}
        - {id: page, text-key: page, width: 600}
      buttons:
        - id: selected-1
          text-key: custom-selected
          tooltip-key: custom-description
          width: 299
          placeholders: {message: 'Архитектор23 принёс с собой уют'}
        - id: available-2
          text-key: custom-unselected
          tooltip-key: custom-description
          width: 299
          placeholders: {message: 'Архитектор23 вернулся, потому что реальная жизнь — это для слабаков'}
        - id: available-3
          text-key: unselected
          tooltip-key: turn-on
          width: 299
          placeholders: {message: 'Архитектор23 появился, и теперь будет всех ебать'}
        - id: available-4
          text-key: unselected
          tooltip-key: turn-on
          width: 299
          placeholders: {message: 'Архитектор23 пришел, чтобы в очередной раз накосячить'}
        - id: available-5
          text-key: unselected
          tooltip-key: turn-on
          width: 299
          placeholders: {message: 'Архитектор23 как обычно — зашел с голой жопой'}
        - id: locked-6
          text-key: locked
          tooltip-key: unavailable
          width: 299
          placeholders: {message: 'Архитектор23 прибыл и готов на всё, лишь бы не работать'}
        - {id: available-7, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 снова тут, как будто бездельничать — это его работа'}}
        - {id: available-8, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 вернулся, надеясь, что его тут хоть кто-то ждал'}}
        - {id: available-9, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 зашел, чтобы проверить, не упал ли сервер без него'}}
        - {id: available-10, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 вернулся и будет снова тупить'}}
        - {id: available-11, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 снова здесь, как будто ему больше нечем заняться'}}
        - {id: available-12, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 вошел в игру, как бы это не кончилось катастрофой'}}
        - {id: custom, text-key: custom-list, tooltip-key: custom-list, width: 299}
        - {id: switch, text-key: switch-leave, tooltip-key: switch-leave, width: 299}
        - {id: previous, text-key: previous, tooltip-key: previous, width: 299}
        - {id: next, text-key: next, tooltip-key: next, width: 299}
      viewport: [854, 480]
      variants: [{id: default}]

    - id: leave-messages-page
      source: dialog
      format: reference-multi-action
      name-key: leave-title
      external-title-key: leave-title
      columns: 2
      body:
        - {id: help, text-key: catalog-help, width: 600}
        - {id: page, text-key: page, width: 600, placeholders: {page: '2'}}
      buttons:
        - {id: selected-1, text-key: selected, tooltip-key: turn-off, width: 600, placeholders: {message: 'Архитектор23 съебался в туман'}}
        - {id: available-2, text-key: unselected, tooltip-key: turn-on, width: 600, placeholders: {message: 'Архитектор23 испарился, потому что реальная жизнь зовёт... или нет'}}
        - {id: available-3, text-key: unselected, tooltip-key: turn-on, width: 600, placeholders: {message: 'Архитектор23 свалил, оставив после себя одни проблемы'}}
        - {id: available-4, text-key: unselected, tooltip-key: turn-on, width: 600, placeholders: {message: 'Архитектор23 ушёл, потому что тут хрен делать'}}
        - {id: available-5, text-key: unselected, tooltip-key: turn-on, width: 600, placeholders: {message: 'Архитектор23 исчез, как последний шанс на победу'}}
        - {id: locked-6, text-key: locked, tooltip-key: unavailable, width: 600, placeholders: {message: 'Архитектор23 свалил, потому что всё это задолбало'}}
        - {id: available-7, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 свалил, оставив все на остальных дебилов'}}
        - {id: available-8, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 вышел, потому что не выдержал накала тупости'}}
        - {id: available-9, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 слился, как крыса'}}
        - {id: available-10, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 ушел, потому что кто-то в реале орет "Убери мусор!"'}}
        - {id: available-11, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 исчез, как будто его никогда не было'}}
        - {id: available-12, text-key: unselected, tooltip-key: turn-on, width: 299, placeholders: {message: 'Архитектор23 свалил, как только понял, что тут ему не светит'}}
        - {id: custom, text-key: custom-list, tooltip-key: custom-list, width: 299}
        - {id: switch, text-key: switch-join, tooltip-key: switch-join, width: 299}
        - {id: previous, text-key: previous, tooltip-key: previous, width: 299}
        - {id: next, text-key: next, tooltip-key: next, width: 299}
      viewport: [854, 480]
      variants: [{id: default}]

    - id: custom-messages
      source: dialog
      format: reference-multi-action
      name-key: custom-join-title
      external-title-key: custom-join-title
      columns: 1
      body:
        - {id: help, text-key: custom-help, width: 600, placeholders: {count: '0', limit: '10'}}
        - {id: empty, text-key: custom-empty, width: 600}
      buttons:
        - {id: create, text-key: create, tooltip-key: create, width: 600}
        - {id: back, text-key: back-catalog, tooltip-key: back-catalog, width: 600}
      viewport: [854, 480]
      variants: [{id: default}]

    - id: custom-message-detail
      source: dialog
      format: reference-multi-action
      name-key: custom-detail-title
      external-title-key: custom-detail-title
      columns: 1
      body:
        - {id: message, text-key: manage-selected, width: 600, placeholders: {message: '✦ Архитектор23 снова с нами'}}
      buttons:
        - {id: toggle, text-key: turn-off, tooltip-key: turn-off, width: 600}
        - {id: edit, text-key: edit-message, tooltip-key: edit-message, width: 600}
        - {id: delete, text-key: delete, tooltip-key: delete, width: 600}
        - {id: back, text-key: back-custom, tooltip-key: back-custom, width: 600}
      viewport: [854, 480]
      variants: [{id: default}]

    - id: template-formatting
      source: dialog
      format: reference-multi-action
      name-key: formatting-title
      external-title-key: formatting-title
      columns: 1
      body:
        - {id: help, text-key: formatting-help, width: 600}
        - {id: colors, text-key: formatting-colors, width: 600}
        - {id: styles, text-key: formatting-styles, width: 600}
        - {id: example, text-key: formatting-example, width: 600}
      buttons:
        - {id: back, text-key: back-custom, tooltip-key: back-custom, width: 600}
      viewport: [854, 480]
      variants: [{id: default}]

  fragments:
    - source: dialog
      include: ['*']
