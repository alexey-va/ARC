name: build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.agents/**'
      - '.codex/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: standalone unit and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Checkout pinned arc-core consumer verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexey-va/arc-core
          ref: dcb648a7f07bcad4c749d96375499a3dbe864ae0
          path: .tmp/arc-core-verifier
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew --no-parallel --build-cache :test :arc-dungeons:test :shadowJar :arc-dungeons:shadowJar :prepareExtractedPluginArtifacts
      - name: Verify ArcDungeons core consumer contract
        run: python3 .tmp/arc-core-verifier/scripts/verify_consumer_architecture.py arc-dungeons
      - name: Verify ARC and ArcDungeons artifact split
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts -p 'test_verify_arc_*artifact_split.py'
          mapfile -t arc_jars < <(find build/libs -maxdepth 1 -type f -name 'ARC-*.jar' ! -name '*-plain.jar' | sort)
          mapfile -t arc_core_jars < <(find build/extracted-plugins -maxdepth 1 -type f -name 'ArcCore-*.jar' ! -name '*-plain.jar' | sort)
          mapfile -t dungeons_jars < <(find arc-dungeons/build/libs -maxdepth 1 -type f -name 'ArcDungeons-*.jar' ! -name '*-plain.jar' | sort)
          test "${#arc_jars[@]}" -eq 1 || { echo "Expected exactly one ARC production JAR, got ${#arc_jars[@]}"; exit 1; }
          test "${#arc_core_jars[@]}" -eq 1 || { echo "Expected exactly one ArcCore production JAR, got ${#arc_core_jars[@]}"; exit 1; }
          test "${#dungeons_jars[@]}" -eq 1 || { echo "Expected exactly one ArcDungeons production JAR, got ${#dungeons_jars[@]}"; exit 1; }
          python3 - "${arc_jars[0]}" "${dungeons_jars[0]}" <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, ".tmp/arc-core-verifier/scripts")
          from verify_consumer_architecture import verify_artifact
          violations = [issue for jar in sys.argv[1:] for issue in verify_artifact(Path(jar), provider_host=False)]
          for issue in violations:
              print(issue)
          sys.exit(bool(violations))
          PY
          python3 scripts/verify_arc_dungeons_artifact_split.py --arc-jar "${arc_jars[0]}" --arc-core-jar "${arc_core_jars[0]}" --dungeons-jar "${dungeons_jars[0]}"
          # Kotlin default constructor markers cannot cross ARC/ArcDungeons classloaders.
          javap -c -p -classpath "${dungeons_jars[0]}" ru.arc.hooks.elitemobs.DungeonScoreboard > build/dungeons-scoreboard-bytecode.txt
          grep -F 'ArcSidebarFrame."<init>":(Lnet/kyori/adventure/text/Component;Ljava/util/List;Ljava/util/Set;)V' build/dungeons-scoreboard-bytecode.txt
          if grep -E 'ArcSidebarFrame\."<init>".*DefaultConstructorMarker' build/dungeons-scoreboard-bytecode.txt; then exit 1; fi
          python3 scripts/verify_arc_domain_artifact_split.py --name ArcMounts --arc-jar "${arc_jars[0]}" --arc-core-jar "${arc_core_jars[0]}" --child-jar build/extracted-plugins/ArcMounts-0.1.11.jar
          python3 scripts/verify_arc_domain_artifact_split.py --name ArcOrigin --arc-jar "${arc_jars[0]}" --arc-core-jar "${arc_core_jars[0]}" --child-jar build/extracted-plugins/ArcOrigin-0.1.36.jar
          python3 scripts/verify_arc_domain_artifact_split.py --name ArcContracts --arc-jar "${arc_jars[0]}" --arc-core-jar "${arc_core_jars[0]}" --child-jar build/extracted-plugins/ArcContracts-0.1.11.jar
      - name: Preserve tested production JARs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ARC-ArcDungeons-tested-with-ArcCore-dependency-${{ github.sha }}
          retention-days: 7
          path: |
            build/libs/ARC-*.jar
            !build/libs/*-plain.jar
            arc-dungeons/build/libs/ArcDungeons-*.jar
            !arc-dungeons/build/libs/*-plain.jar
            build/extracted-plugins/ArcCore-*.jar
            build/extracted-plugins/ArcMounts-*.jar
            build/extracted-plugins/ArcOrigin-*.jar
            build/extracted-plugins/ArcContracts-*.jar
          if-no-files-found: error

      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ARC-unit-reports-${{ github.sha }}
          retention-days: 7
          path: |
            build/test-results/test/**
            build/reports/tests/test/**
            arc-dungeons/build/test-results/test/**
            arc-dungeons/build/reports/tests/test/**
          if-no-files-found: ignore

  integration:
    name: standalone SQL and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: docker info
      - run: ./gradlew --no-parallel :integrationTest :arc-dungeons:integrationTest
      - name: Preserve Redis and MySQL integration reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ARC-integration-reports-${{ github.sha }}
          retention-days: 7
          path: |
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            arc-dungeons/build/test-results/integrationTest/**
            arc-dungeons/build/reports/tests/integrationTest/**
          if-no-files-found: ignore

  e2e:
    name: >-
      Paper ${{ matrix.minecraft }} / ${{ matrix.dungeons-only == 'true' && 'ArcDungeons' || matrix.crash-only == 'true' && 'contract crash' || matrix.dialog-only == 'true' && 'dialog designs' || matrix.cleanup-only == 'true' && 'entity cleanup' || matrix.parkour-only == 'true' && 'Parkour' || 'contracts and Parkour' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1.2'
            cleanup-only: 'false'
            parkour-only: 'false'
            dialog-only: 'false'
          - minecraft: '26.1.2'
            cleanup-only: 'false'
            parkour-only: 'true'
            dialog-only: 'false'
          - minecraft: '1.21.11'
            cleanup-only: 'true'
            parkour-only: 'false'
            dialog-only: 'false'
          - minecraft: '1.21.11'
            cleanup-only: 'false'
            parkour-only: 'false'
            dialog-only: 'true'
          - minecraft: '1.21.11'
            cleanup-only: 'false'
            parkour-only: 'false'
            dialog-only: 'false'
            dungeons-only: 'true'
          - minecraft: '1.21.11'
            cleanup-only: 'false'
            parkour-only: 'false'
            dialog-only: 'false'
            crash-only: 'true'
    env:
      TEST_TIMEOUT: ${{ matrix.crash-only == 'true' && '900000' || '60000' }}
      ARC_CONTRACT_CRASH_FIXTURE: ${{ matrix.crash-only == 'true' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test ARC on real Paper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          ./gradlew --no-daemon plugwrightTest -Pe2eMinecraftVersion=${{ matrix.minecraft }} -PcleanupE2e=${{ matrix.cleanup-only }} -PparkourE2e=${{ matrix.parkour-only }} -PdialogE2e=${{ matrix.dialog-only }} -PdungeonsE2e=${{ matrix.dungeons-only || 'false' }} -PcontractCrashE2e=${{ matrix.crash-only || 'false' }} 2>&1 | tee build/plugwright-e2e.log
          git diff --exit-code -- src/test/e2e/package-lock.json
      - name: Reject LinkageError in Paper log
        if: always()
        shell: bash
        run: |
          paper_logs=(build/plugwright/logs/latest.log build/plugwright-e2e.log)
          for paper_log in "${paper_logs[@]}"; do
            if [[ ! -f "$paper_log" ]]; then
              echo "Expected Paper log not found: $paper_log" >&2
              exit 1
            fi
          done
          if grep -nF 'LinkageError' "${paper_logs[@]}"; then
            echo "Paper logs contain LinkageError" >&2
            exit 1
          fi
      - name: Record E2E artifact hashes
        if: always()
        run: |
          jars=()
          for jar in build/libs/ARC-*.jar build/extracted-plugins/ArcCore-*.jar arc-dungeons/build/libs/ArcDungeons-*.jar build/extracted-plugins/ArcMounts-*.jar build/extracted-plugins/ArcOrigin-*.jar build/extracted-plugins/ArcContracts-*.jar; do
            if [[ -f "$jar" && "$jar" != *-plain.jar ]]; then jars+=("$jar"); fi
          done
          if ((${#jars[@]})); then
            sha256sum "${jars[@]}" > build/e2e-jar-sha256.txt
          fi
      - name: Upload E2E results and Paper logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arc-paper-e2e-${{ matrix.minecraft }}-cleanup-${{ matrix.cleanup-only }}-parkour-${{ matrix.parkour-only }}-dialog-${{ matrix.dialog-only }}-dungeons-${{ matrix.dungeons-only || 'false' }}-crash-${{ matrix.crash-only || 'false' }}
          retention-days: 7
          path: |
            build/plugwright-e2e.log
            build/plugwright/logs/
            build/plugwright/crash-reports/
            build/plugwright/crash-probe-logs/
            build/plugwright/plugins/ARCContractCrashFixture/
            build/plugwright/plugins/Parkour/config.yml
            build/plugwright/plugins/Parkour/courses/
            build/e2e-jar-sha256.txt
          if-no-files-found: ignore
      - name: Preserve ArcDungeons Paper artifacts
        if: always() && matrix.dungeons-only == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arc-dungeons-paper-e2e-${{ github.sha }}
          retention-days: 7
          path: |
            build/extracted-plugins/ArcCore-*.jar
            build/plugwright/plugins/ArcCore-*.jar
            arc-dungeons/build/libs/ArcDungeons-*.jar
            build/plugwright/plugins/ArcDungeons-*.jar
            build/plugwright/plugins/ArcDungeonsE2eFixture.jar
            build/plugwright/logs/
            build/e2e-jar-sha256.txt
          if-no-files-found: error
