name: ArcAurora
on:
  push:
    branches: [master]
    paths: ['arc-aurora/**', 'arc-aurora-api/**', 'settings.gradle.kts', '.github/workflows/aurora.yml']
  pull_request:
    paths: ['arc-aurora/**', 'arc-aurora-api/**', 'settings.gradle.kts', '.github/workflows/aurora.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Test and package Aurora only
        run: ./gradlew --no-parallel :arc-aurora:test :arc-aurora:shadowJar :arc-aurora-api:build
      - name: Checkout immutable consumer verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: alexey-va/arc-core
          ref: 170f6b84f039d2506813a4ee637281e9645100a9
          path: .tmp/aurora-verifier
          persist-credentials: false
      - name: Verify source contract and production JAR
        run: python3 .tmp/aurora-verifier/scripts/verify_consumer_architecture.py arc-aurora --jar build/libs/ArcAurora-0.1.3.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ArcAurora-${{ github.sha }}
          path: |
            arc-aurora/build/libs/ArcAurora-0.1.3.jar
            arc-aurora-api/build/libs/arc-aurora-api-0.1.0.jar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ArcAurora-tests-${{ github.sha }}
          path: arc-aurora/build/test-results/test/**
