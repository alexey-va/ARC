name: ArcDrawers

on:
  push:
    branches: [master]
    paths: &drawer_paths
      - arc-drawers/**
      - gradlew
      - gradle/wrapper/**
      - .github/workflows/arc-drawers.yml
  pull_request:
    paths: *drawer_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Checkout pinned ArcCore consumer verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexey-va/arc-core
          ref: 050c75e710f0e163ac5d4b160b4f938fcce570fd
          path: .tmp/arc-core-verifier
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Test and package ArcDrawers
        run: ./gradlew --no-parallel -p arc-drawers test shadowJar
      - name: Verify the consumer contract and production JAR
        id: artifact
        shell: bash
        run: |
          mapfile -t jars < <(find arc-drawers/build/libs -maxdepth 1 -type f -name 'ArcDrawers-*.jar' ! -name '*-plain.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected one ArcDrawers production JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          python3 .tmp/arc-core-verifier/scripts/verify_consumer_architecture.py arc-drawers --jar "$PWD/${jars[0]}"
          printf 'jar=%s\n' "${jars[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload verified production JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArcDrawers-${{ github.sha }}
          path: ${{ steps.artifact.outputs.jar }}
          if-no-files-found: error
