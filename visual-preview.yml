surfaces:
  hud:
    - id: auction-showcase-stale
      actionbar: origin-showcase:messages.stale
    - id: auction-showcase-unavailable
      actionbar: origin-showcase:messages.unavailable
    - id: auction-showcase-failed
      actionbar: origin-showcase:messages.failed

  world:
    - id: auction-showcase-listing
      text: origin-showcase:text.listing
      placeholders:
        name: Незеритовый меч
        seller: CraftMaster
        price: '12 500'
    - id: auction-showcase-empty
      text: origin-showcase:text.empty

  chat:
    - source: commandhide
      include: ['*']
    - source: elitemobs
      include: [quest-locked-message]

  chat-blocks:
    - id: server-hover
      text: spy:server-hover
    - id: command-spy
      text: spy:command
      placeholders:
        sender: ArchitectureMax
        content: /warp market
    - id: private-message-spy
      text: spy:private-message
      placeholders:
        marker: Spy
        content: Ок, у ворот.

  fragments:
    - source: mounts-ui
      include: ['copy.*']
    - source: mounts-horse
    - source: mounts-fox
    - source: mounts-bee
    - source: mounts-ravager
    - source: mounts-pig
    - source: mounts-ghast
    - source: mounts-iron-golem
    - source: mounts-copper-golem
    - source: mounts-mega-warden
    - source: mounts-pocket-chicken
    - source: mounts-night-vision
    - source: mounts-new-passives
    - source: mounts-size-defaults

  inventories:
    - id: mounts-list-representative
      title: 'mounts-ui:list-title'
      rows: 6
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - {slot: 4, material: BLUE_STAINED_GLASS_PANE, itemsadder: 'arc:comment_gray', name: 'mounts-ui:copy.list.guide-name', lore: 'mounts-ui:copy.list.guide-lore'}
        - slot: 10
          material: RAVAGER_SPAWN_EGG
          name: 'mounts-ui:copy.list.mount-owned-name'
          lore:
            - 'mounts-ui:copy.list.mount-owned-core'
            - 'mounts-ui:copy.common.blank'
            - 'mounts-ui:copy.list.features-title'
            - {ref: 'mounts-ui:copy.list.feature-name', placeholders: {feature: Таран}}
            - {ref: 'mounts-ui:copy.list.feature-description', placeholders: {feature-description: 'Спринт вперёд бьёт первого врага.'}}
            - {ref: 'mounts-ui:copy.list.feature-name', placeholders: {feature: Топот}}
            - {ref: 'mounts-ui:copy.list.feature-description', placeholders: {feature-description: 'Бьёт враждебных мобов под корпусом.'}}
            - 'mounts-ui:copy.common.blank'
            - 'mounts-ui:copy.list.mount-owned-footer'
        - &mount_owned {slot: 11, material: HORSE_SPAWN_EGG, name: 'mounts-ui:copy.list.mount-owned-name', lore: ['mounts-ui:copy.list.mount-owned-core', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.list.mount-owned-footer'], placeholders: {mount: Лошадь, rarity: '<green>Необычный', type-value: '<gray>Пеший', level: '2', max-level: '3', skin: Классический}}
        - {<<: *mount_owned, slot: 12, material: BEE_SPAWN_EGG, placeholders: {mount: Пчела, rarity: '<white>Обычный', type-value: '<green>Летающий', level: '1', max-level: '3', skin: Классический}}
        - &mount_acquirable {slot: 13, material: ZOMBIE_SPAWN_EGG, name: 'mounts-ui:copy.list.mount-acquirable-name', lore: ['mounts-ui:copy.list.mount-acquirable-core', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.list.mount-acquirable-footer'], placeholders: {mount: Зомби, rarity: '<white>Обычный', acquisition: Магазин маунтов на спавне}}
        - &mount_locked {slot: 14, material: BLAZE_SPAWN_EGG, name: 'mounts-ui:copy.list.mount-locked-name', lore: 'mounts-ui:copy.list.mount-locked-core', placeholders: {mount: Блэйз, rarity: '<gold>Легендарный', acquisition: Сезонная или событийная награда}}
        - {<<: *mount_acquirable, slot: 15, material: DOLPHIN_SPAWN_EGG, placeholders: {mount: Дельфин, rarity: '<white>Обычный', acquisition: Магазин маунтов на спавне}}
        - {slot: 45, material: BLUE_STAINED_GLASS_PANE, itemsadder: 'arc:left_gray', name: 'mounts-ui:copy.common.back-name', lore: ['mounts-ui:copy.list.back-description', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-back']}
        - {slot: 49, material: COMPASS, itemsadder: 'arc:mount_category_all', name: 'mounts-ui:copy.list.filter-name', lore: ['mounts-ui:copy.list.filter-stats', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.list.filter-footer']}
        - {slot: 50, material: BLUE_STAINED_GLASS_PANE, itemsadder: 'arc:right_blue_gray', name: 'mounts-ui:copy.list.next-name', lore: ['mounts-ui:copy.list.page', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.list.next-footer']}

    - id: mounts-detail-ravager
      title: 'mounts-ui:detail-title'
      rows: 5
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - slot: 4
          material: RAVAGER_SPAWN_EGG
          name: 'mounts-ui:copy.list.mount-owned-name'
          lore:
            - 'mounts-ui:copy.detail.mount-state-lore'
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'Тяжёлый престижный таран:'}}
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'дорогой, грозный'}}
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'и удивительно быстрый.'}}
            - 'mounts-ui:copy.detail.mount-stats-core-lore'
            - {ref: 'mounts-ui:copy.detail.behavior-line', placeholders: {feature: Таран}}
            - {ref: 'mounts-ui:copy.detail.behavior-description', placeholders: {behavior-description: 'Нажмите спринт при движении вперёд.'}}
            - {ref: 'mounts-ui:copy.detail.behavior-description', placeholders: {behavior-description: 'Первый враждебный моб на пути'}}
            - {ref: 'mounts-ui:copy.detail.behavior-description', placeholders: {behavior-description: 'получит урон при столкновении.'}}
            - {ref: 'mounts-ui:copy.detail.behavior-line', placeholders: {feature: Топот}}
            - {ref: 'mounts-ui:copy.detail.behavior-description', placeholders: {behavior-description: 'Враждебные мобы под корпусом'}}
            - {ref: 'mounts-ui:copy.detail.behavior-description', placeholders: {behavior-description: 'получают урон во время движения.'}}
        - {slot: 13, material: NETHER_STAR, name: 'mounts-ui:copy.detail.favorite-selected-name', lore: 'mounts-ui:copy.detail.favorite-selected-lore'}
        - {slot: 20, material: COMPARATOR, name: 'mounts-ui:copy.detail.upgrade-name', lore: ['mounts-ui:copy.detail.upgrade-lore', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-open']}
        - {slot: 22, material: SADDLE, name: 'mounts-ui:copy.detail.summon-name', lore: ['mounts-ui:copy.detail.summon-lore', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-summon']}
        - {slot: 24, material: GLOW_INK_SAC, name: 'mounts-ui:copy.detail.glow-enabled-name', lore: ['mounts-ui:copy.detail.glow-enabled-lore', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-disable']}
        - {slot: 36, material: BLUE_STAINED_GLASS_PANE, itemsadder: 'arc:left_gray', name: 'mounts-ui:copy.common.back-name', lore: ['mounts-ui:copy.detail.back-description', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-back']}
        - {slot: 40, material: LEATHER_HORSE_ARMOR, name: 'mounts-ui:copy.detail.skins-name', lore: ['mounts-ui:copy.detail.skins-lore', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-open']}
        - {slot: 42, material: GOAT_HORN, name: 'mounts-ui:copy.detail.whistle-owned-name', lore: 'mounts-ui:copy.detail.whistle-owned-lore'}

    - id: mounts-detail-pig-colossal
      extends: mounts-detail-ravager
      placeholders:
        mount: Скорен
        rarity: '<white>Обычный'
        type-value: '<gray>Пеший'
        level: '3'
        max-level: '3'
        speed: '5.6'
        step: '2.00'
        skin: Звёздный комплект
        size: дом ×10
      items:
        - slot: 4
          material: PIG_SPAWN_EGG
          name: 'mounts-ui:copy.list.mount-owned-name'
          lore:
            - 'mounts-ui:copy.detail.mount-state-lore'
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'Тот самый Скорен.'}}
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'От брелока ×0.1 до дома ×10.'}}
            - 'mounts-ui:copy.detail.mount-stats-core-lore'
            - {ref: 'mounts-ui:copy.detail.innate-ability-line', placeholders: {ability: Свинячий разгон}}
            - {ref: 'mounts-ui:copy.detail.innate-description', placeholders: {ability-description: 'После спешивания оставляет Скорость II.'}}

    - id: mounts-detail-horse-trait-size
      title: 'mounts-ui:detail-title'
      rows: 5
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      placeholders:
        mount: Лошадь
        rarity: '<green>Необычный'
        type-value: '<gray>Пеший'
        level: '3'
        max-level: '3'
        speed: '5'
        step: '2.00'
        skin: Королевская белая
        size: обычный
        ability: Уверенный прыжок
      items:
        - slot: 4
          material: HORSE_SPAWN_EGG
          name: 'mounts-ui:copy.list.mount-owned-name'
          lore:
            - 'mounts-ui:copy.detail.mount-state-lore'
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'Классика путешествий:'}}
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'сильный галоп, уверенный прыжок'}}
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'и три варианта размера.'}}
            - 'mounts-ui:copy.detail.mount-stats-core-lore'
            - 'mounts-ui:copy.detail.innate-ability-line'
        - {slot: 13, material: NETHER_STAR, name: 'mounts-ui:copy.detail.favorite-selected-name', lore: 'mounts-ui:copy.detail.favorite-selected-lore'}
        - {slot: 20, material: COMPARATOR, name: 'mounts-ui:copy.detail.upgrade-name', lore: ['mounts-ui:copy.detail.upgrade-lore', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-open']}
        - {slot: 22, material: SADDLE, name: 'mounts-ui:copy.detail.summon-name', lore: ['mounts-ui:copy.detail.summon-lore', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-summon']}
        - {slot: 24, material: GLOW_INK_SAC, name: 'mounts-ui:copy.detail.glow-enabled-name', lore: ['mounts-ui:copy.detail.glow-enabled-lore', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-disable']}
        - {slot: 36, material: BLUE_STAINED_GLASS_PANE, itemsadder: 'arc:left_gray', name: 'mounts-ui:copy.common.back-name', lore: ['mounts-ui:copy.detail.back-description', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-back']}
        - {slot: 40, material: LEATHER_HORSE_ARMOR, name: 'mounts-ui:copy.detail.skins-name', lore: ['mounts-ui:copy.detail.skins-lore', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-open']}
        - {slot: 42, material: GOAT_HORN, name: 'mounts-ui:copy.detail.whistle-owned-name', lore: 'mounts-ui:copy.detail.whistle-owned-lore'}

    - id: mounts-detail-locked-disabled
      title: 'mounts-ui:detail-title'
      rows: 5
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - slot: 4
          material: BLAZE_SPAWN_EGG
          name: 'mounts-ui:copy.list.mount-locked-name'
          placeholders: {mount: Блэйз, acquisition: Сезонная или событийная награда}
          lore:
            - 'mounts-ui:copy.detail.mount-locked-state'
            - 'mounts-ui:copy.list.rarity-legendary'
            - 'mounts-ui:copy.common.blank'
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'Наследный сезонный маунт'}}
            - {ref: 'mounts-ui:copy.detail.description-line', placeholders: {mount-description: 'старой коллекции.'}}
            - 'mounts-ui:copy.common.blank'
            - 'mounts-ui:copy.detail.locked-acquisition'
        - {slot: 13, material: GRAY_DYE, name: 'mounts-ui:copy.detail.favorite-locked-name', lore: 'mounts-ui:copy.detail.favorite-locked-lore'}
        - {slot: 20, material: COMPARATOR, name: 'mounts-ui:copy.detail.upgrade-name', lore: 'mounts-ui:copy.detail.upgrade-locked-lore', placeholders: {level: '0', max-level: '3'}}
        - {slot: 22, material: BARRIER, name: 'mounts-ui:copy.detail.summon-locked-name', lore: 'mounts-ui:copy.detail.summon-locked-lore'}
        - {slot: 24, material: GRAY_DYE, name: 'mounts-ui:copy.detail.glow-locked-name', lore: 'mounts-ui:copy.detail.glow-locked-lore'}
        - {slot: 36, material: BLUE_STAINED_GLASS_PANE, itemsadder: 'arc:left_gray', name: 'mounts-ui:copy.common.back-name', lore: ['mounts-ui:copy.detail.back-description', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-back']}
        - {slot: 40, material: GRAY_DYE, name: 'mounts-ui:copy.detail.skins-locked-name', lore: 'mounts-ui:copy.detail.skins-locked-lore'}
        - {slot: 42, material: GRAY_DYE, name: 'mounts-ui:copy.detail.whistle-favorite-required-name', lore: 'mounts-ui:copy.detail.whistle-favorite-required-lore'}

    - id: mounts-detail-ability-whistle-matrix
      title: 'mounts-ui:detail-title'
      rows: 5
      filler: GRAY_STAINED_GLASS_PANE
      background-item: arc:background
      items:
        - {slot: 10, material: GRAY_DYE, name: 'mounts-ui:copy.detail.whistle-disabled-name', lore: 'mounts-ui:copy.detail.whistle-disabled-lore'}
        - {slot: 11, material: GRAY_DYE, name: 'mounts-ui:copy.detail.whistle-favorite-required-name', lore: 'mounts-ui:copy.detail.whistle-favorite-required-lore'}
        - {slot: 12, material: GRAY_DYE, name: 'mounts-ui:copy.detail.whistle-full-name', lore: 'mounts-ui:copy.detail.whistle-full-lore'}
        - {slot: 13, material: GOAT_HORN, name: 'mounts-ui:copy.detail.whistle-available-name', lore: ['mounts-ui:copy.detail.whistle-available-lore', 'mounts-ui:copy.common.blank', 'mounts-ui:copy.common.footer-get']}
        - {slot: 14, material: GOAT_HORN, name: 'mounts-ui:copy.detail.whistle-owned-name', lore: 'mounts-ui:copy.detail.whistle-owned-lore'}
        - slot: 29
          material: NAUTILUS_SHELL
          name: 'mounts-ui:copy.detail.ability-available-name'
          placeholders: {price: '1 500 000'}
          lore:
            - {ref: 'mounts-ui:copy.detail.ability-description', placeholders: {ability-description: 'Даёт дельфиний эффект'}}
            - {ref: 'mounts-ui:copy.detail.ability-description', placeholders: {ability-description: 'и ускоряет маунта в воде.'}}
            - 'mounts-ui:copy.detail.ability-speed'
            - 'mounts-ui:copy.common.price'
