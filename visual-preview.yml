surfaces:
  dialogs:
    - id: lands-root
      source: lands-ui
      format: reference-multi-action
      name-key: root-title
      external-title-key: root-title
      columns: 2
      body:
        - {id: intro, text-key: root-body, width: 400}
      buttons:
        - id: land-birch
          text-key: land-label
          tooltip-key: land-tooltip
          width: 150
          placeholders: {land: Берёзовая_гавань, chunks: 18, members: 4, max_members: 8, balance: '8 000 000'}
        - id: land-cliff
          text-key: land-label
          tooltip-key: land-tooltip
          width: 150
          placeholders: {land: Морской_утёс, chunks: 7, members: 2, max_members: 6, balance: '340 000'}
        - {id: create, text-key: create-label, tooltip-key: create-tooltip, width: 150}
        - {id: guide, text-key: guide-label, tooltip-key: guide-tooltip, width: 150}
      viewport: [854, 480]
      variants: [{id: default}]

    - id: lands-mainblock
      source: lands-ui
      format: reference-multi-action
      name-key: mainblock-title
      external-title-key: mainblock-title
      columns: 1
      body:
        - {id: instructions, text-key: mainblock-body, width: 500}
      buttons:
        - {id: settings, text-key: open-lands-label, tooltip-key: open-lands-tooltip, width: 220}
      viewport: [854, 480]
      variants: [{id: default}]

    - id: lands-details
      source: lands-ui
      format: reference-multi-action
      name-key: details-title
      external-title-key: details-title
      columns: 2
      body:
        - {id: summary, text-key: details-body, width: 500, placeholders: {land: Берёзовая_гавань, role: владелец, chunks: 18, max_chunks: 30, members: 4, max_members: 8, balance: '8 000 000'}}
      buttons:
        - {id: settings, text-key: open-lands-label, tooltip-key: open-lands-tooltip, width: 190}
        - {id: members, text-key: members-label, tooltip-key: members-tooltip, width: 190}
        - {id: territory, text-key: territory-label, tooltip-key: territory-tooltip, width: 190}
        - {id: rename, text-key: rename-label, tooltip-key: rename-tooltip, width: 190}
        - {id: delete, text-key: delete-label, tooltip-key: delete-tooltip, width: 190}
      viewport: [854, 480]
      variants: [{id: default}]

    - id: lands-territory
      source: lands-ui
      format: reference-multi-action
      name-key: territory-title
      external-title-key: territory-title
      columns: 2
      body:
        - {id: summary, text-key: territory-body, width: 500, placeholders: {land: Берёзовая_гавань}}
      buttons:
        - {id: claim, text-key: claim-label, tooltip-key: claim-tooltip, width: 190}
        - {id: unclaim, text-key: unclaim-label, tooltip-key: unclaim-tooltip, width: 190}
        - {id: setspawn, text-key: setspawn-label, tooltip-key: setspawn-tooltip, width: 190}
        - {id: spawn, text-key: spawn-label, tooltip-key: spawn-tooltip, width: 190}
        - {id: areas, text-key: areas-label, tooltip-key: areas-tooltip, width: 190}
        - {id: mainblock, text-key: mainblock-label, tooltip-key: mainblock-tooltip, width: 190}
      viewport: [854, 480]
      variants: [{id: default}]

    - id: lands-guide
      source: lands-ui
      format: reference-multi-action
      name-key: guide-title
      external-title-key: guide-title
      columns: 2
      body:
        - {id: intro, text-key: guide-body, width: 500}
      buttons:
        - {id: create, text-key: guide-create-label, tooltip-key: guide-create-tooltip, width: 190}
        - {id: expand, text-key: guide-expand-label, tooltip-key: guide-expand-tooltip, width: 190}
        - {id: members, text-key: guide-members-label, tooltip-key: guide-members-tooltip, width: 190}
        - {id: commands, text-key: guide-commands-label, tooltip-key: guide-commands-tooltip, width: 190}
      viewport: [854, 480]
      variants: [{id: default}]

    - id: help-center-root
