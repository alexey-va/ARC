schema: 1
plugin: ARC
minecraft-version: 1.21.11
minecraft-client-sha1: ba2df812c2d12e0219c489c4cd9a5e1f0760f5bd
gallery-accent: '#92bed8'

resource-pack:
  url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip
  sha256-url: https://storage.yandexcloud.net/ruscraftinresources/RusCraftingResource.zip.sha256

custom-items:
  arc:background:
    material: GRAY_STAINED_GLASS_PANE
    model: assets/arc/models/gui/background.json
  arc:left_gray:
    material: BLUE_STAINED_GLASS_PANE
    model: assets/arc/models/gui/left_gray.json
  arc:left_blue_gray:
    material: BLUE_STAINED_GLASS_PANE
    model: assets/arc/models/gui/left_blue_gray.json
  arc:right_blue_gray:
    material: BLUE_STAINED_GLASS_PANE
    model: assets/arc/models/gui/right_blue_gray.json
  arc:comment_gray:
    material: BLUE_STAINED_GLASS_PANE
    model: assets/arc/models/gui/comment_gray.json
  arc:confirm_gray:
    material: GREEN_STAINED_GLASS_PANE
    model: assets/arc/models/gui/confirm_gray.json
  arc:cancel:
    material: RED_STAINED_GLASS_PANE
    model: assets/arc/models/gui/cancel.json
  arc:mount_category_all:
    material: COMPASS
    model: assets/arc/models/gui/mount_category_all.json
  arc:mount_category_flying:
    material: FEATHER
    model: assets/arc/models/gui/mount_category_flying.json
  arc:mount_category_walking:
    material: SADDLE
    model: assets/arc/models/gui/mount_category_walking.json
  arc:mount_category_swimming:
    material: HEART_OF_THE_SEA
    model: assets/arc/models/gui/mount_category_swimming.json

glyphs:
  - character: '💰'
    path: '@pack/assets/arc/textures/glyphs/coin.png'
    height: 9
    ascent: 8

sources:
  spy:
    path: src/main/resources/modules/cross-server-spy.yml
    root: display
  commandhide:
    path: src/main/resources/config/commands.yml
    root: messages.commandhide
  elitemobs:
    path: src/main/resources/modules/elitemobs.yml
    root: chests
    include: [quest-locked-message]
  mounts-ui:
    path: src/main/resources/modules/mounts.yml
    root: gui
    include: [list-title, detail-title, progression-title, skins-title, confirm-title, 'copy.*']
  mounts-horse:
    path: src/main/resources/modules/mounts.yml
    root: mounts.horse
    include: [name, description, abilities.high-jump.name]
  mounts-fox:
    path: src/main/resources/modules/mounts.yml
    root: mounts.fox
    include: [name, description, abilities.high-jump.name]
  mounts-bee:
    path: src/main/resources/modules/mounts.yml
    root: mounts.bee
    include: [name, description, 'abilities.passive.*.name', 'abilities.passive.*.description']
  mounts-ravager:
    path: src/main/resources/modules/mounts.yml
    root: mounts.ravager
    include: [name, description, 'behaviors.*.name', 'behaviors.*.description']
  mounts-pig:
    path: src/main/resources/modules/mounts.yml
    root: mounts.pig
    include: [name, description, 'abilities.passive.*.name', 'abilities.passive.*.description']
  mounts-ghast:
    path: src/main/resources/modules/mounts.yml
    root: mounts.ghast
    include: [name, description, 'abilities.passive.*.name', 'abilities.passive.*.description']
  mounts-iron-golem:
    path: src/main/resources/modules/mounts.yml
    root: mounts.iron_golem
    include: [name, description, 'abilities.passive.*.name', 'abilities.passive.*.description', 'behaviors.*.name', 'behaviors.*.description']
  mounts-copper-golem:
    path: src/main/resources/modules/mounts.yml
    root: mounts.copper_golem
    include: [name, description, 'abilities.passive.*.name', 'abilities.passive.*.description']
  mounts-mega-warden:
    path: src/main/resources/modules/mounts.yml
    root: mounts.mega_warden
    include: [name, description, 'abilities.passive.*.name']
  mounts-pocket-chicken:
    path: src/main/resources/modules/mounts.yml
    root: mounts.pocket_chicken
    include: [name, description, 'abilities.high-jump.name', 'abilities.passive.*.name']
  mounts-night-vision:
    path: src/main/resources/modules/mounts.yml
    root: ability-upgrades.night-vision
    include: [name, description]
  mounts-new-passives:
    path: src/main/resources/modules/mounts.yml
    root: mounts
    include:
      - 'zombie.abilities.passive.*.name'
      - 'zombie.abilities.passive.*.description'
      - 'camel.abilities.passive.*.name'
      - 'camel.abilities.passive.*.description'
      - 'turtle.abilities.passive.*.name'
      - 'turtle.abilities.passive.*.description'
      - 'frog2.abilities.passive.*.name'
      - 'frog2.abilities.passive.*.description'
      - 'allay.abilities.passive.*.name'
      - 'allay.abilities.passive.*.description'
      - 'vex.abilities.passive.*.name'
      - 'vex.abilities.passive.*.description'
      - 'breeze.abilities.passive.*.name'
      - 'breeze.abilities.passive.*.description'
  mounts-size-defaults:
    path: src/main/resources/modules/mounts.yml
    root: size-tuning-defaults
    include: ['*.*']
  origin-showcase:
    path: src/main/resources/modules/origin-spawn.yml
    root: auction-showcase
placeholders:
  server: Выживание
  marker: CSpy
  sender: Alexey23
  target: NorthAlex
  content: /warp market
  player: ArchitectureMax
  name: Незеритовый меч
  seller: CraftMaster
  action: открыть
  mount: Разоритель
  rarity: '<light_purple>Эпический'
  type-value: '<gray>Пеший'
  level: '3'
  max-level: '3'
  skin: Теневой комплект
  acquisition: Магазин маунтов на спавне
  page: '1'
  pages: '2'
  category: Все
  shown: '50'
  total: '50'
  owned-action: только полученные
  speed: '5.4'
  speed-percent: '100'
  step: '2.00'
  size: абсурдный ×3
  feature: Топот
