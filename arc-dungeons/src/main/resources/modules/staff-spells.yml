# Administrator-issued mechanics samples. These are not native FMM/EliteMobs loot items.
# /arc stafftest [all|chain|mark|frost|lance|ember|nova|icicle|fault|lunar|gale|tide|requiem|prism|necromancer|gravity|ossuary] [player]; /arc reload applies tuning.
# Duel appearance is optional and native: set a full item-model key and positive custom-model-data together.
# Keep the portable defaults (empty / 0) on hosts without the matching client-pack model.
targeting:
  range: 48.0
  half-angle-degrees: 20.0
  # A small launch-direction correction, never an automatic hit or steering through cover.
  # Radial attacks and manually placed ground areas keep their own placement rules.
  aim-assist:
    enabled: true
    half-angle-degrees: 6.0
    max-miss-blocks: 2.0
    strength: 0.35
    excluded-spells: []
max-area-targets: 8
# Visual-only missing blocks and flying debris; [] disables, ['*'] allows every world on this server.
scenery:
  worlds: []
# Player-only packet HUD placement, in camera-plane blocks. Positive vertical is below the reticle.
# /arc reload reads these values; ranges are clamped to keep the card visible and readable.
hud:
  position:
    forward-blocks: 2.5
    vertical-blocks: 0.85
    horizontal-blocks: 0.0
    scale: 0.66
# Raw damage before the arena kit multiplier (0.4); read again on ARC reload.
# Cooldown is shared across attack modes and staff swaps. Ember and Icicle primary casts charge for 36 ticks.
