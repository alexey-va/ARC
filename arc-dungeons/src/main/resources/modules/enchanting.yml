book:
  name-prefix: 'Книга EliteMobs'
  scope: 'Только для снаряжения EliteMobs'
  compatibility-label: 'Подходит для:'
  compatibility-fallback: 'совместимого снаряжения EliteMobs'
  action: 'Перетащите на предмет — зачаровать'
  # ARC owns book explanations; EliteMobs/MagmaCore keep effect names and mechanics.
  effect-descriptions:
    'elitemobs:critical_strikes':
      - 'Повышает шанс критического удара'
      - 'по элитным мобам.'
    'elitemobs:loud_strikes':
      - 'Удары сильнее привлекают внимание'
      - 'элитных мобов к вам.'
    'elitemobs:hunter':
      - 'Повышает шанс появления элитных'
      - 'мобов поблизости.'
    'elitemobs:drilling':
      - 'Разрушает соседние блоки того же типа.'
      - 'При Shift добывает только один блок.'
    'elitemobs:ice_breaker':
      - 'ПКМ замораживает воду перед вами.'
      - 'На II уровне охватывает соседние блоки.'
      - 'Расходует прочность предмета.'
    'elitemobs:lightning':
      - 'Шанс поразить элитного моба молнией'
      - 'и задеть элитных мобов рядом.'
    'elitemobs:flamethrower':
      - 'ПКМ выпускает струю пламени.'
      - 'Во время атаки замедляет вас'
      - 'и расходует прочность предмета.'
    'elitemobs:grappling_hook':
      - 'Стрела, попавшая в блок-мишень,'
      - 'подтягивает вас к нему.'
    'elitemobs:earthquake':
      - 'Двойной Shift подбрасывает вас.'
      - 'Приземление отбрасывает врагов.'
      - 'Не сочетается с плазменными ботинками.'
    'elitemobs:plasma_boots':
      - 'Двойной Shift запускает прыжок.'
      - 'При приземлении выпускает'
      - 'повреждающие снаряды вокруг.'
      - 'Не срабатывает вместе с Землетрясением.'
    'elitemobs:summon_wolf':
      - 'ПКМ призывает приручённого волка.'
      - 'Зачарованный предмет расходуется.'
    'elitemobs:summon_merchant':
      - 'ПКМ призывает торговца.'
      - 'Зачарованный предмет расходуется.'
    'elitemobs:meteor_shower':
      - 'ПКМ вызывает дождь из огненных шаров.'
      - 'Зачарованный предмет расходуется.'
    'elitemobs:soulbind':
      - 'Привязывает предмет к владельцу.'
      - 'Другие игроки не могут им пользоваться.'
    'freeminecraftmodels:multicast':
      - 'Выпускает несколько снарядов палочки.'
      - 'Урон каждого снаряда снижен.'
    'freeminecraftmodels:blast_radius':
      - 'Увеличивает радиус взрыва'
      - 'огненных шаров посоха.'
    'freeminecraftmodels:ignition':
      - 'Огненный шар посоха поджигает'
      - 'выжившие после попадания цели.'
    'minecraft:aqua_affinity':
      - 'Ускоряет добычу блоков под водой.'
    'minecraft:bane_of_arthropods':
      - 'Увеличивает урон по членистоногим'
      - 'и ненадолго замедляет их.'
    'minecraft:binding_curse':
      - 'Надетый предмет нельзя снять'
      - 'до смерти или его поломки.'
    'minecraft:blast_protection':
      - 'Снижает урон и отбрасывание от взрывов.'
    'minecraft:breach':
      - 'Удары булавой частично игнорируют'
      - 'защиту брони цели.'
    'minecraft:channeling':
      - 'Попадание брошенного трезубца'
      - 'вызывает молнию во время грозы'
      - 'под открытым небом.'
    'minecraft:density':
      - 'Увеличивает урон булавы при падении.'
      - 'Чем выше падение, тем сильнее удар.'
    'minecraft:depth_strider':
      - 'Ускоряет передвижение под водой.'
    'minecraft:efficiency':
      - 'Ускоряет добычу подходящих блоков.'
    'minecraft:feather_falling':
      - 'Снижает урон от падения.'
    'minecraft:fire_aspect':
      - 'Удар поджигает цель.'
    'minecraft:fire_protection':
      - 'Снижает урон от огня и лавы'
      - 'и сокращает время горения.'
    'minecraft:flame':
      - 'Стрелы поджигают поражённые цели.'
    'minecraft:fortune':
      - 'Повышает добычу из подходящих блоков,'
      - 'например из руд.'
    'minecraft:frost_walker':
      - 'Превращает воду под ногами'
      - 'во временный лёд при ходьбе.'
    'minecraft:impaling':
      - 'Увеличивает урон трезубца'
      - 'по водным существам.'
    'minecraft:infinity':
      - 'Обычные стрелы не расходуются.'
      - 'Нужна хотя бы одна стрела в инвентаре.'
    'minecraft:knockback':
      - 'Удары сильнее отбрасывают цель.'
    'minecraft:looting':
      - 'Увеличивает добычу с убитых мобов'
      - 'и шанс выпадения редких предметов.'
    'minecraft:loyalty':
      - 'Брошенный трезубец возвращается к вам.'
    'minecraft:luck_of_the_sea':
      - 'Повышает шанс выловить сокровище'
      - 'и снижает шанс выловить мусор.'
    'minecraft:lunge':
      - 'Укол копьём делает рывок вперёд.'
      - 'Расходует сытость.'
    'minecraft:lure':
      - 'Сокращает ожидание поклёвки.'
    'minecraft:mending':
      - 'Восстанавливает прочность предмета'
      - 'за счёт подбираемого опыта.'
    'minecraft:multishot':
      - 'Арбалет выпускает три снаряда'
      - 'за один выстрел и одну единицу боеприпаса.'
    'minecraft:piercing':
      - 'Стрелы арбалета пробивают несколько'
      - 'целей насквозь и проходят через щиты.'
    'minecraft:power':
      - 'Увеличивает урон стрел,'
      - 'а также посохов и волшебных палочек.'
    'minecraft:projectile_protection':
      - 'Снижает урон от стрел и других снарядов.'
    'minecraft:protection':
      - 'Снижает урон от большинства источников.'
    'minecraft:punch':
      - 'Стрелы сильнее отбрасывают цель.'
    'minecraft:quick_charge':
      - 'Ускоряет зарядку арбалета.'
    'minecraft:respiration':
      - 'Позволяет дольше дышать под водой.'
    'minecraft:riptide':
      - 'Бросок трезубца переносит вас вперёд.'
      - 'Работает в воде или под дождём.'
    'minecraft:sharpness':
      - 'Увеличивает урон в ближнем бою.'
    'minecraft:silk_touch':
      - 'Позволяет получать подходящие блоки'
      - 'в исходном виде.'
    'minecraft:smite':
      - 'Увеличивает урон по нежити.'
    'minecraft:soul_speed':
      - 'Ускоряет ходьбу по песку душ'
      - 'и почве душ, изнашивая ботинки.'
    'minecraft:sweeping_edge':
      - 'Усиливает урон по соседним целям'
      - 'при размашистой атаке мечом.'
    'minecraft:swift_sneak':
      - 'Ускоряет передвижение с зажатым Shift.'
    'minecraft:thorns':
      - 'Шанс нанести урон атакующему'
      - 'в ответ на его удар.'
    'minecraft:unbreaking':
      - 'Снижает расход прочности предмета.'
    'minecraft:vanishing_curse':
      - 'Предмет исчезает после вашей смерти.'
    'minecraft:wind_burst':
      - 'Успешный удар булавой с падения'
      - 'подбрасывает вас для следующего удара.'
messages:
  dust-single-book: '<yellow>Отделите одну книгу от стопки, затем перетащите на неё магическую пыль.</yellow>'
  dust-maxed: '<yellow>Эта книга уже усилена до предела. Пыль сохранена.</yellow>'
  dust-success: '<green>Книга усилена! Новые шансы указаны в её описании.</green>'
  incompatible-target: '<red>Эти чары не подходят этому типу предмета. Подходящие вещи указаны на книге.</red>'
  elite-only: '<red>Эта книга подходит только для снаряжения EliteMobs.</red>'
  incompatible: '<red>Эти чары не подходят предмету или превышают его предел.</red>'
  unavailable: '<red>Не удалось применить книгу. Проверьте инвентарь и попробуйте ещё раз.</red>'
  book-updated: '<yellow>Подсказка книги обновлена. Проверьте шансы и перетащите её на предмет ещё раз.</yellow>'
  success: '<green>Зачарование применено!</green>'
  failure: '<yellow>Зачарование не сработало. Предмет сохранён, книга потрачена.</yellow>'
  destroyed: '<red>Неудачная попытка: предмет разрушен, книга потрачена.</red>'
