    spn_legends_of_the_guild:
      body: '<#e8dfd2>Инстансный данж «Легенды гильдии» для группы до 3 игроков.<newline><#aaa49a>Держите строй группы и заранее договоритесь, кто ведёт через следующий участок.'
    spn_pillagers_base:
      body: '<#e8dfd2>Открытый данж с базой разбойников.<newline><#aaa49a>Не агрите всю группу сразу: разделяйте противников и держите путь отхода свободным.'
    spn_pirate_bay:
      body: '<#e8dfd2>Открытый данж в пиратской бухте.<newline><#aaa49a>На палубах и узких проходах не стойте у края — оставляйте место для обхода и отхода.'
    spn_ruined_fortress:
      body: '<#e8dfd2>Открытый данж с разрушенной крепостью.<newline><#aaa49a>Проверяйте проломы и боковые входы: в разрушенных стенах легко потерять безопасный маршрут.'
    spn_skeleton_casttle:
      body: '<#e8dfd2>Открытый данж в замке скелетов.<newline><#aaa49a>Используйте стены и дверные проёмы как укрытие для отстрела, не выходя в большой зал без необходимости.'
    spn_the_cave_remastered:
      body: '<#e8dfd2>Открытый данж в обновлённой пещере.<newline><#aaa49a>В узких проходах двигайтесь по одному и оставляйте позади свободное место для отхода.'
    spn_the_end_rescue:
      body: '<#e8dfd2>Открытый данж со спасательной вылазкой в Край.<newline><#aaa49a>Следите за краями островов и не отходите спиной к пустоте; заранее выбирайте широкую площадку.'
    spn_the_hell_ring:
      body: '<#e8dfd2>Инстансный данж «Адское кольцо» с тремя сложностями.<newline><#aaa49a>Согласуйте темп группы и не заходите в следующий участок, пока команда не готова.'
    spn_the_jungle:
      body: '<#e8dfd2>Открытый данж в джунглях.<newline><#aaa49a>В густой растительности проверяйте боковые проходы и не теряйте ориентир на обратный путь.'
    spn_the_one_piece:
      body: '<#e8dfd2>Открытый пиратский данж на Гранд-Лайн.<newline><#aaa49a>На длинных переходах держитесь открытого пространства и не уходите далеко от команды.'
    spn_the_sakura_invaders:
      body: '<#e8dfd2>Открытый данж с вторжением среди сакур.<newline><#aaa49a>Используйте деревья и перепады высоты как ориентиры, чтобы не потерять обратную дорогу.'
    spn_underground_dungeon:
      body: '<#e8dfd2>Открытый подземный данж.<newline><#aaa49a>Запоминайте развилки и смотрите по сторонам: безопасный выход может быть не по прямой.'

