# ArcDungeons menu catalog. Layouts and item text remain operator-configurable
# through the legacy shared data file; this resource supplies child defaults.
menus:
  layouts:
    lost-elite-loot:
      schema-version: 1
      rows: 6
      elements:
        back: { slot: 45, template: lost-loot-back }
        previous: { slot: 48, template: menu-previous }
        info: { slot: 49, template: lost-loot-info, kind: decoration }
        next: { slot: 50, template: menu-next }
      regions:
        lost-items: { slots: ['0-44'] }
      pagination: { region: lost-items, previous: previous, next: next }
    elite-loot:
      schema-version: 1
      rows: 6
      background: { template: background }
      elements:
        previous: { slot: 45, template: elite-loot-previous }
        back: { slot: 49, template: elite-loot-back }
        next: { slot: 53, template: elite-loot-next }
      regions:
        items: { slots: ['0-44'] }
      pagination:
        region: items
        previous: previous
        next: next
    elite-mobs-shop:
      schema-version: 1
      rows: 6
      elements:
        change: { slot: 4, template: em-shop-change }
        update: { slot: 8, template: em-shop-update, kind: decoration }
      regions:
        shop-items: { slots: ['9-53'] }
  templates:
    background:
      material: GRAY_STAINED_GLASS_PANE
      custom-model-data: 11000
      hide-tooltip: true
    elite-loot-previous:
      material: BLUE_STAINED_GLASS_PANE
      name: '<gray>« Предыдущая страница'
      lore: ['', '<dark_gray>Нажмите для перехода']
    elite-loot-next:
      material: BLUE_STAINED_GLASS_PANE
      name: '<gray>Следующая страница »'
      lore: ['', '<dark_gray>Нажмите для перехода']
    elite-loot-back:
      material: BLUE_STAINED_GLASS_PANE
      name: '<gray>« Назад'
      lore: ['', '<dark_gray>Вернуться в меню']
    lost-loot-back:
      material: ARROW
      name: '<#92bed8>‹ В меню данжей'
    lost-loot-info:
      material: ENDER_CHEST
      name: '<#c4a7e7>Потерянная добыча'
      lore:
        - '<#f2eee8>Лут EliteMobs из общего ящика сети,'
        - '<#f2eee8>доступный на любом сервере.'
        - ''
        - '<#9bd48d>ЛКМ — забрать предмет целиком'
        - '<#f4d87a>Нужен один свободный слот'
        - '<#f4d87a>ПКМ — продать по цене EliteMobs'
        - ''
        - '<#92bed8>Продажа сохраняется до выплаты.'
        - '<#92bed8>Кристаллы зачислятся на сервере EliteMobs.'
        - '<#f2eee8>Выброшенные вещи и кейсы'
        - '<#f2eee8>сюда не возвращаются.'
    menu-previous:
      material: BLUE_STAINED_GLASS_PANE
      name: '<gray>« Предыдущая страница'
      lore: []
    menu-next:
      material: BLUE_STAINED_GLASS_PANE
      name: '<gray>Следующая страница »'
      lore: []
    em-shop-change:
      material: GREEN_STAINED_GLASS_PANE
      name: '<gold>Сменить тип товаров'
      lore: ['<gray>Текущий тип: <green><type>']
    em-shop-update:
      material: PAPER
      custom-model-data: 31173
      name: '<gold>Обновление ассортимента'
      lore:
        - '<gray>Обновление через: <green><minutes> мин.'
        - '<gray>Баланс: <green><balance>'
        - '<dark_gray>Покупатель: <player>'
    em-shop-item:
      material: PAPER
      name: '<name>'
      lore:
        - '<gold>Цена: <price>'
        - ''
        - { repeat: original, text: '<line>' }
