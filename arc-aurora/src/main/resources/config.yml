# Temporary event ambience replaces ordinary profiles in the leased world.
# It intentionally bypasses the ordinary permission/toggle and time/biome filters.
# Ping, loaded-chunk, passable-block and packet-budget gates still apply.
# These decorative forms do not reveal treasure positions or change rewards.
# Twenty-two variants share nine world cells: soft blue/warm traces and bubble-chamber tracks.
# One familiar white wave and one rare crystal remain; no cube/star in this night catalogue.
# Three short meteor variants repeat more often. FLAME is orange, not a red recolour.
# Only the crystal holds a complete outline; coloured traces keep their native short tails.
# Y ranges are above the loaded terrain at the cell anchor, not above the player.
# Existing native tails fade on whole-scene radial cull; the shared cap stays 36.
event-presets:
  treasure-hunt:
    sky_wave:
      biomes:
      - '*'
      time-start: 0
      time-end: 23999
      sky-scene: true
      scene-duration-ticks: 220
      spawn-delay-ticks: 24
      motion-period-ticks: 800
      update-ticks: 1
      radius: 96
      min-distance: 28
      vertical-min: 26
      vertical-max: 54
      shape: WAVE
      shape-size: 9
      points: 24
      sky-points: 192
      particle: minecraft:end_rod
      count: 1
      offset-x: 0
      offset-y: 0
      offset-z: 0
      speed: 0
      sky-refresh-ticks: 0
