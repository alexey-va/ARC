# ArcAurora: original, restrained biome ambience for vanilla clients.
# Distances are BLOCKS, times are Minecraft ticks, and colours are sRGB.
# No resource pack, world lighting, entities, terrain edits or forced chunk loads.
permission: arcaurora.view
interval-ticks: 10
viewers-per-tick: 32 # Keep nightly contours refreshed for a shared audience; the Main deadline still applies.
attempts-per-viewer: 8
packets-per-viewer: 12
sky-packets-per-viewer: 36
native-budget-micros: 1500

# Automatic sky figures for every player at night, using each world's own clock.
# Personal /arcaurora off still applies. Preview and temporary events take priority.
# /arcaurora reload applies this section together with the selected preset.
night-sky:
  enabled: true
  preset: treasure-hunt
  time-start: 13000
  time-end: 23000
  worlds: ['*']
  environments: [NORMAL]

# Both observed limits must pass before new ambient/event submissions.
# The rolling window uses available samples; 10 samples at 20 ticks is nominally 10 s.
ping:
  max-current-ms: 250
  max-average-ms: 180
  window-samples: 10
  sample-interval-ticks: 20

# /arcaurora reload applies these to every sky figure. A profile may override only
# the fields it needs under sky-options: {wave-amplitude: 0.3, scale-max: 1.2}.
# World-field defaults are independent of camera movement. Native lifetime/gravity stay client-owned.
sky-field:
  cell-size: 40 # One deterministic figure per world cell; no player-position/yaw anchors.
  jitter: 0.3 # Fraction of a cell; independent deterministic displacement per lifecycle.
  view-distance: 96 # Horizontal admission radius in blocks; profile.radius may narrow it.
  cull-hysteresis: 16 # Retain active cells to 112 blocks; no nearest-slot churn.
  max-scenes: 9
  max-per-profile: 2 # Varied motion; at most two copies of one variant.
  cull-cooldown-ticks: 80 # Let the previous native tail expire before a cell can restart.
sky-defaults:
  # Fixed-world orientation, not a sector around the viewer.
  yaw-min-degrees: 0
  yaw-max-degrees: 360
  terrain-clearance: 1 # Blocks above the surface, in addition to native fall/sprite clearance; minimum 1.
  scale-min: 0.8
  scale-max: 1.0 # shape-size * scale-max must stay <= 32.
  roll-radians: 0.45
  # Wave geometry and translation are multiples of the randomized shape-size.
  wave-amplitude: 0.22
  wave-cycles: 1.0
  wave-slope: 0.07
  wave-depth: 0.05
  stroke-drift: 0.12
  stroke-lift: 0.05
  held-drift: 0.06
  held-lift: 0.025
  exit-ticks: 40 # Held figures only; capped at one quarter of scene duration; 0 disables staged exit.
  fresh-head-repair: false # One fresh point only; no doubled wave density.
  fresh-head-max-age-ticks: 2
  helix-turns: 2
  helix-radius: 0.3
  arc-sweep-degrees: 240
  meteor-split: 0.6 # Fraction of samples used by the fast flight before fragments separate.
  meteor-spread: 0.35 # Fragment travel as a fraction of shape-size.
  # Artistic chamber tracks; native colour/lifetime are unchanged. These options reload atomically.
  track-turns: 1.25 # Spiral revolutions; 0.5..3.
  track-tightening: 0.18 # Final / initial spiral radius; 0.05..0.8.
  track-branch-angle-degrees: 25 # Initial branch opening; 10..75.
  track-bend-degrees: 70 # Curvature of the broad branch; 15..180.
  track-split: 0.25 # Scatter/kink samples spent before the branch or change of heading; 0.1..0.6.
  lens-spread: 0.5 # Outer lane offset as a fraction of shape-size; 0.15..0.9.
  knot-radius: 0.32 # Loop height/depth fraction; 0.15..0.45.
  flyby-gap: 0.28 # Closest head offset from the centre; 0.1..0.7.
  flock-spread: 0.3 # Width of the three weaving lanes; 0.1..0.4.
  kink-angle-degrees: 60 # Distinct change in heading at the kink; 35..120.
  ripple-spacing: 0.36 # Offset between successive short arcs; 0.2..0.45.
  eye-opening: 0.32 # Half-opening of the split-and-rejoin path; 0.15..0.65.
  slingshot-radius: 0.28 # Smooth hairpin radius relative to shape-size; 0.12..0.45.
  skip-height: 0.55 # First arch height; the next two shrink to 55% and 30%; 0.2..0.8.

# Optional exact, single-hop aliases. Read the actual key with /arcaurora biome.
# Iris namespaces/paths depend on the installed generator pack; none are assumed here.
# Replace {} with a mapping after verifying your real key, for example:
# biome-aliases:
#   'iris:your_verified_woodland': 'minecraft:forest'
biome-aliases: {}

# Only the highest matching priority is used; equal priorities share the budget.
# Omitted world selectors mean ['*']; omitted time means the entire day.
# All shipped profiles reject underwater spawning. Shape size is a radius/half-extent.
# Most presets use at most 6 points; cubes use 12, one sample on each edge.
