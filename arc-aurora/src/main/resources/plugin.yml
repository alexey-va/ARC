name: ArcAurora
version: '${version}'
main: ru.arc.aurora.ArcAuroraPlugin
api-version: '1.21'
description: Personal packet-only biome ambience with custom biome support
depend: [ArcCore, packetevents]
commands:
  arcaurora:
    description: Ambient particles and diagnostics
    usage: /<command> [on|off|toggle|biome|status|reload|catalog|preview|showcase [EFFECT|stop]]
    aliases: [aaurora]
permissions:
  arcaurora.view:
    description: Receive ordinary ambient particle effects
    default: false
  arcaurora.admin:
    description: Reload ArcAurora and use its diagnostics and previews
    default: op
