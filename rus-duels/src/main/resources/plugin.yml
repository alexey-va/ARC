name: Duels
version: '${version}'
main: me.dartanman.duels.Duels
api-version: '1.21'
authors: [Dartanman, RusCrafting]
prefix: Dartanboy Duels
website: https://github.com/Dartanboy/Duels
description: Dartanboy Duels, safety-hardened for the RusCrafting network
loadbefore: [ARC, HuskSync, GravesX]
commands:
  duel:
    description: Вызвать игрока на дуэль или управлять текущей дуэлью
    usage: /duel <игрок|accept|deny|leave|stats>
    aliases: [duels, 1v1]
permissions:
  duels.use:
    default: true
  duels.admin:
    default: op
