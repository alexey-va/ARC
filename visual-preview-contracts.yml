surfaces:
  inventories:
  - id: contract-details
    title: titles:detail.title
    rows: 3
    filler: GRAY_STAINED_GLASS_PANE
    background-item: arc:background
    items:
    - slot: 2
      material: COAL
      name: catalog:contracts-order.name
      lore: catalog:contracts-order.lore
      placeholders:
        payout: '6.98'
    - slot: 6
      material: GOLD_NUGGET
      name: catalog:contracts-detail-payout.name
      lore: catalog:contracts-detail-payout.lore
    - slot: 26
      material: GREEN_STAINED_GLASS_PANE
      itemsadder: arc:confirm_gray
      name: catalog:contracts-detail-confirm.name
      lore:
      - catalog:contracts-detail-confirm.lore.0
      - catalog:contracts-detail-confirm.lore.1.text
      - catalog:contracts-detail-confirm.lore.2.text
      - catalog:contracts-detail-confirm.lore.3.text
      - catalog:contracts-detail-confirm.lore.4.text
  - id: contract-outside-origin
