glyphs:
- character: 
  path: '@pack/assets/arc/textures/icons/mechanics/crafting_gear.png'
  height: 9
  ascent: 8
- character: 💰
  path: '@pack/assets/arc/textures/glyphs/coin.png'
  height: 9
  ascent: 8
plugin: ARC — закупки Origin
limitations:
- Статическое превью актуальных описаний; события Paper проверяются отдельным E2E.
sources:
  catalog:
    path: src/main/resources/guis/menus.yml
    root: menus.templates
    include:
    - contracts-order.name
    - contracts-order.lore
    - contracts-detail-payout.name
    - contracts-detail-payout.lore
    - contracts-detail-confirm.name
    - contracts-detail-confirm.lore.*.text
    - contracts-detail-confirm.lore.0
  titles:
    path: src/main/resources/guis/contracts.yml
    root: defaults
    include:
    - detail.title
