name: ARC
version: '${project.version}'
main: ru.arc.ARC
api-version: 1.20
libraries:
  - com.google.code.gson:gson:2.10.1
  - redis.clients:jedis:5.2.0-beta4
  - org.jsoup:jsoup:1.17.2
  - org.eclipse.jetty.websocket:websocket-client:9.4.54.v20240208
softdepend:
  - Parties
  - Lands
  - Citizens
  - BlueMap
  - CMI
  - WorldGuard
  - EliteMobs
  - HuskHomes
  - ProtectionStones
  - Denizen
  - Slimefun
  - EconomyShopGUI-Premium
  - AutoSellChests
  - zAuctionHouse
  - zAuctionHouseV3
  - AdvancedEnchantments
  - ItemsAdder
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
  - YamipaPlugin
  - LootChest
  - Jobs
  - BetterStructures
  - PlaceholderAPI
  - Duels
  - BetterRTP
  - RTP
  - My_Worlds
  - RedisEconomy
  - LuckPerms
  - Vault
  - packetevents
  - CoreProtect
commands:
  arc:
    description: Main command
    usage: Main command
  buy:
    description: Buy an exact item quantity from EconomyShopGUI
    usage: /buy <item-path> <amount>
  x:
    description: x
    usage: x
  g:
    description: Switch to global chat mode
    usage: /g
  l:
    description: Switch to local chat mode
    usage: /l
  treasure-hunt:
    description: Treasure hunt admin
    usage: /treasure-hunt [status|types|start|stop]
  treasure-pool:
    description: Treasure reward pools
    usage: /treasure-pool [pool] [action]
  arc-invest:
    description: Stock market GUI
    usage: /arc-invest [gui|buy|sell|portfolio]
  sound-follow:
    description: Play follow sound for player
    usage: /sound-follow <player> <namespace:sound>
  give-jobs-boost:
    description: Give Jobs Reborn boost
    usage: /give-jobs-boost <player> <job|all> <multiplier> <type> <duration>
  arctest:
    description: ARC dev test commands
    usage: /arctest <action>
  eliteloot:
    description: Elite loot admin
    usage: /eliteloot [list|add]
  mount:
    description: Open and administer the mount collection
    usage: /mount [menu|help|admin]
    permission: arc.mounts.use
  builder:
    description: Survival-friendly builder tools
    usage: /builder [help|wand|fill|copy|book|paste|deconstruct|crown|confirm|cancel|undo|status]
permissions:
  arc.admin:
    description: Administer ARC
    default: op
    children:
      arc.investigations.cooldown.bypass: true
  arc.audit:
    description: Inspect ARC audit data
    default: op
  arc.balance.top:
    description: View the balance leaderboard
    default: false
  arc.board:
    description: Open the community board
    default: false
  arc.board.admin:
    description: Moderate community board entries
    default: op
  arc.board.announce:
    description: Receive community board announcements
    default: false
  arc.board.publish:
    description: Publish community board entries
    default: false
  arc.board.rate.own:
    description: Rate your own community board entries
    default: op
  arc.build.book.give:
    description: Give ARC build books backed by existing schematics
    default: op
  arc.build.book.create:
    description: Create material-backed build books from safe builder copies
    default: false
    children:
      arc.build.book.edit: true
      arc.build.book.sell: true
      arc.build.book.use: true
  arc.build.book.edit:
    description: Edit build-book rotation and offsets
    default: false
  arc.build.book.sell:
    description: Safely list registered build books on the auction
    default: false
  arc.build.book.use:
    description: Preview and construct ARC build books
    default: false
  arc.build.fast:
    description: Use accelerated ARC construction
    default: op
  arc.buildings.cooldown.bypass:
    description: Bypass ARC building cooldowns
    default: op
  arc.chat.notify:
    description: Receive ARC chat announcements
    default: false
  arc.elite.loot.admin:
    description: Administer EliteMobs loot through ARC
    default: op
  arc.item.give:
    description: Give ARC-defined items
    default: op
  arc.jobs.boost.give:
    description: Give Jobs boost vouchers
    default: op
  arc.jobs.boost.large:
    description: Purchase large Jobs boosts
    default: false
  arc.jobs.boost.use:
    description: Open and use Jobs boost controls
    default: false
  arc.join.invulnerability.bypass:
    description: Bypass ARC join invulnerability
    default: op
  arc.join.message.gui:
    description: Administer join and quit messages
    default: op
  arc.leaf.decay.bypass:
    description: Bypass ARC leaf decay handling
    default: op
  arc.location.pool.admin:
    description: Administer ARC location pools
    default: op
  arc.ops.notify:
    description: Receive ARC operations notifications
    default: op
  arc.portal.bypass:
    description: Bypass ARC portal restrictions
    default: op
  arc.portal.teleport.by.other:
    description: Allow other players' portals to teleport you
    default: false
  arc.portal.teleport.other:
    description: Allow your portals to teleport other players
    default: false
  arc.items.catalog.use:
    description: Open the ItemsAdder item catalog
    default: true
  arc.items.catalog.all:
    description: View the complete ItemsAdder registry in the ARC catalog
    default: op
  arc.items.catalog.give:
    description: Give yourself one item by clicking it in the ARC catalog
    default: op
  arc.invest.max.20:
    description: Hold up to 20 units of one ARC stock
    default: false
  arc.invest.max.30:
    description: Hold up to 30 units of one ARC stock
    default: false
  arc.investigations.cooldown.bypass:
    description: Bypass the cooldown between paid bureau investigations
    default: op
  arc.furniture.admin:
    description: Preview and confirm ItemsAdder furniture cleanup
    default: op
  arc.product.path:
    description: Choose a recommended RusCrafting starter path
    default: true
  arc.pouch.give:
    description: Give YAML-defined ARC reward pouches
    default: op
  arc.restart:
    description: Schedule a restart of the current server
    default: op
  arc.restart.all:
    description: Schedule restarts across all servers
    default: op
  arc.restart.cancel:
    description: Cancel scheduled ARC restarts
    default: op
  arc.rtp.respawn:
    description: Administer first-RTP and RTP respawn state
    default: op
  arc.schedules.gui:
    description: Open the ARC scheduled-command GUI
    default: op
  arc.schedules.run:
    description: Run an ARC schedule immediately
    default: op
  arc.sound.follow:
    description: Play a follow sound for a player
    default: op
  arc.stocks.buy:
    description: Trade through the ARC stock market
    default: false
  arc.stocks.history.prune:
    description: Prune ARC stock history
    default: op
  arc.stocks.images.update:
    description: Refresh ARC stock images
    default: op
  arc.stocks.menu.other:
    description: Inspect another player's stock menu
    default: op
  arc.store:
    description: Inspect your ARC store history
    default: false
  arc.store.others:
    description: Inspect other players' ARC store history
    default: op
  arc.test:
    description: Run ARC development commands
    default: op
  arc.treasure.hunt.admin:
    description: Administer ARC treasure hunts
    default: op
  arc.treasure.pool.admin:
    description: Administer ARC treasure pools
    default: op
  arc.x:
    description: Send cross-server ARC commands
    default: op
  arc.command.hide.bypass:
    description: Bypass all CommandHide groups
    default: op
  arc.mounts.admin:
    description: Administer mount ownership and summon test mounts
    default: op
    children:
      arc.mounts.use: true
  arc.mounts.use:
    description: Open and use the mount collection
    default: false
  arc.builder.tools.use:
    description: Use survival-friendly ARC builder tools
    default: false
    children:
      arc.builder.tools.fill: true
      arc.builder.tools.copy: true
      arc.build.book.create: true
      arc.builder.tools.paste: true
      arc.builder.tools.deconstruct: true
      arc.builder.tools.crown: true
  arc.builder.tools.fill:
    description: Plan and confirm bounded material-backed fills
    default: false
  arc.builder.tools.copy:
    description: Copy bounded safe block selections to a temporary clipboard
    default: false
  arc.builder.tools.paste:
    description: Paste a temporary clipboard while paying exact materials
    default: false
  arc.builder.tools.deconstruct:
    description: Deconstruct bounded selections with a real tool and exact drops
    default: false
  arc.builder.tools.crown:
    description: Build bounded material-backed leaf crowns
    default: false
  arc.builder.tools.selection.size.20:
    description: Allow a builder-tools selection axis up to 20 blocks
    default: false
  arc.builder.tools.selection.size.40:
    description: Allow a builder-tools selection axis up to 40 blocks
    default: false
  arc.builder.tools.selection.size.60:
    description: Allow a builder-tools selection axis up to 60 blocks
    default: false
  arc.builder.tools.selection.size.80:
    description: Allow a builder-tools selection axis up to 80 blocks
    default: false
  arc.builder.tools.selection.size.100:
    description: Allow a builder-tools selection axis up to 100 blocks
    default: false
  arc.builder.tools.hourly.20000:
    description: Allow up to 20000 builder-tools block changes per hour
    default: false
  arc.builder.tools.hourly.50000:
    description: Allow up to 50000 builder-tools block changes per hour
    default: false
  arc.builder.tools.hourly.100000:
    description: Allow up to 100000 builder-tools block changes per hour
    default: false
  arc.builder.tools.hourly.150000:
    description: Allow up to 150000 builder-tools block changes per hour
    default: false
  arc.builder.tools.hourly.200000:
    description: Allow up to 200000 builder-tools block changes per hour
    default: false
