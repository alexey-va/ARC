name: ARC
version: '${project.version}'
main: ru.arc.ARC
api-version: 1.20
libraries:
  - com.google.code.gson:gson:2.10.1
  - redis.clients:jedis:5.2.0-beta4
  - org.jsoup:jsoup:1.17.2
  - org.eclipse.jetty.websocket:websocket-client:9.4.54.v20240208
softdepend:
  - Parties
  - Lands
  - Citizens
  - BlueMap
  - CMI
  - WorldGuard
  - EliteMobs
  - HuskHomes
  - ProtectionStones
  - Slimefun
  - EconomyShopGUI-Premium
  - AutoSellChests
  - AdvancedEnchantments
  - ItemsAdder
  - ProtocolLib
  - ProtocolSupport
  - ViaVersion
  - ViaBackwards
  - ViaRewind
  - Geyser-Spigot
  - YamipaPlugin
  - LootChest
  - Jobs
  - BetterStructures
  - PlaceholderAPI
  - Duels
  - BetterRTP
  - RTP
  - My_Worlds
  - RedisEconomy
  - LuckPerms
  - Vault
commands:
  arc:
    description: Main command
    usage: Main command
  buy:
    description: Buy an exact item quantity from EconomyShopGUI
    usage: /buy <item-path> <amount>
  x:
    description: x
    usage: x
  g:
    description: Switch to global chat mode
    usage: /g
  l:
    description: Switch to local chat mode
    usage: /l
  treasure-hunt:
    description: Treasure hunt admin
    usage: /treasure-hunt [status|types|start|stop]
  treasure-pool:
    description: Treasure reward pools
    usage: /treasure-pool [pool] [action]
  arc-invest:
    description: Stock market GUI
    usage: /arc-invest [gui|buy|sell|portfolio]
  sound-follow:
    description: Play follow sound for player
    usage: /sound-follow <player> <namespace:sound>
  give-jobs-boost:
    description: Give Jobs Reborn boost
    usage: /give-jobs-boost <player> <job|all> <multiplier> <type> <duration>
  arctest:
    description: ARC dev test commands
    usage: /arctest <action>
  eliteloot:
    description: Elite loot admin
    usage: /eliteloot [list|add]
  mounts:
    description: Open the mount collection
    usage: /mounts
  unlock-mount:
    description: Unlock a mount level for a player
    usage: /unlock-mount <mount> <level> <player>
    permission: arc.mounts.admin
  ride-mob:
    description: Spawn a temporary test mount
    usage: /ride-mob [mount] [speed]
    permission: mcfine.ride-mob
permissions:
  arc.hide.bypass:
    description: Bypass all CommandHide groups
    default: op
  arc.mounts.admin:
    description: Unlock mount levels for players
    default: op
  mcfine.ride-mob:
    description: Spawn temporary test mounts
    default: op
