        - { text: '<red>Нажмите, чтобы вынести вердикт.', when: ready }
        - { text: '<dark_gray>Сначала соберите три показания.', unless: ready }
    investigation-verdict-two:
      material: MAP
      name: '<gold><bold><title>'
      lore: *verdict-lore
    investigation-verdict-three:
      material: NAME_TAG
      name: '<gold><bold><title>'
      lore: *verdict-lore
    investigation-verdict-four:
      material: WRITTEN_BOOK
      name: '<gold><bold><title>'
      lore: *verdict-lore
    investigation-verdict-five:
      material: LIME_DYE
      name: '<gold><bold><title>'
      lore: *verdict-lore
    investigation-back:
      material: BLUE_STAINED_GLASS_PANE
      name: '<aqua>Вернуться к материалам'
      lore:
        - '<action>'
    investigation-testimony:
      material: PAPER
      name: '<gold><bold><name>'
      lore:
        - { repeat: testimony, text: '<line>' }
    contracts-list-info:
      material: PAPER
