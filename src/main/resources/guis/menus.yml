  templates:
    personal-loot-cobblestone:
      material: COBBLESTONE
      name: '<italic:false><gray>Булыжник'
      lore:
        - '<italic:false><dark_gray>Декорация сундука'
    personal-loot-dirt:
      material: DIRT
      name: '<italic:false><gray>Земля'
      lore:
        - '<italic:false><dark_gray>Декорация сундука'
    personal-loot-stick:
