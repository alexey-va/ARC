      custom-model-data: 11013
      name: '<gray>« Назад'
      lore: []
    investigation-start:
      material: WRITABLE_BOOK
      custom-model-data: 12001
      name: '<green><bold>Взять дело за <fee> <white>💰</white>'
      lore:
        - '<white>Фома выдаст вам предмет <gold>«Дело»<white>.'
        - '<gray>В нём записаны происшествие, вопрос и свидетели.'
        - ''
        - '<gray>Награда: <gold><reward> <white>💰</white>'
        - '<gray>Время: <white><duration>'
        - '<gray>Повтор: <white><cooldown>'
        - ''
        - '<action>'
    investigation-contracts:
      material: CHEST
      name: '<aqua>Заказы бюро'
      lore:
        - '<gray>Отдельные поставки книг, чернил и золота.'
        - '<action>'
    investigation-next-step:
      material: COMPASS
      name: '<yellow><bold>Что делать сейчас'
      lore:
        - '<time>'
        - '<gray>Показания: <white><clues>/5'
        - ''
        - { repeat: directions, text: '<line>' }
        - { repeat: warnings, text: '<line>' }
    investigation-dossier:
      material: WRITABLE_BOOK
      custom-model-data: 12001
      name: '<gold><bold><title>'
      lore:
        - { repeat: dossier, text: '<line>' }
    investigation-evidence:
      material: RECOVERY_COMPASS
      name: '<aqua><bold>Хронология и связи'
      lore:
        - '<aqua>Хронология'
        - { repeat: timeline, text: '<line>' }
        - ''
        - { text: '<light_purple>Установленные связи', when: has-links }
        - { text: '<light_purple>Связи', unless: has-links }
        - { repeat: links, text: '<line>' }
    investigation-return:
      material: EMERALD
      name: '<green><bold>Вернуться к Фоме'
      lore:
        - '<gray>Собрано показаний: <white><clues>/5<gray>.'
        - { text: '<green>Фома готов принять ваш вердикт.', when: ready }
        - { text: '<dark_gray>Нужно ещё <missing> показания.', unless: ready }
        - '<gray>Версии открываются только при разговоре с Фомой.'
        - '<red>Ошибка сразу закрывает дело.'
        - ''
        - '<action>'
    investigation-witness:
      material: PAPER
      name: '<yellow><bold><name>'
      lore:
        - { text: '<gray>Где искать: <white><location><gray>.', unless: collected }
        - { text: '<dark_gray>Опрос проводится только лично.', unless: collected }
        - { repeat: body, text: '<line>', when: collected }
    investigation-question:
      material: TARGET
      name: '<yellow><bold><question>'
      lore:
        - '<gray>Выберите версию, которая объясняет всю цепочку.'
        - '<red>Ошибочный вердикт сразу закроет дело.'
    investigation-verdict:
      material: PAPER
      name: '<gold><bold><title>'
      lore:
        - { repeat: explanation, text: '<gray><line>' }
        - ''
        - { text: '<red>Нажмите, чтобы вынести вердикт.', when: ready }
        - { text: '<dark_gray>Сначала соберите три показания.', unless: ready }
    investigation-verdict-one:
      material: PAPER
      name: '<gold><bold><title>'
      lore: &verdict-lore
        - { repeat: explanation, text: '<gray><line>' }
