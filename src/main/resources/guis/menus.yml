# ARC menu catalog. Code owns semantic actions and safe tags; this file owns
# rows, slots, regions, backgrounds, materials, names and lore composition.
menus:
  layouts:
    investigation-hub:
      schema-version: 1
      rows: 3
      background: { template: background }
      elements:
        start: { slot: 13, template: investigation-start }
        contracts: { slot: 26, template: investigation-contracts }
    investigation-case:
      schema-version: 1
      rows: 5
      background: { template: background }
      elements:
        next-step: { slot: 4, template: investigation-next-step }
        dossier: { slot: 36, template: investigation-dossier }
        evidence: { slot: 40, template: investigation-evidence }
        return: { slot: 44, template: investigation-return }
      regions:
        witnesses: { slots: [18, 20, 22, 24, 26] }
    investigation-verdict:
      schema-version: 1
      rows: 3
      background: { template: background }
      elements:
        question: { slot: 4, template: investigation-question }
        back: { slot: 22, template: investigation-back }
      regions:
        verdicts: { slots: [9, 11, 13, 15, 17] }
    investigation-testimony:
      schema-version: 1
      rows: 3
      background: { template: background }
      elements:
        statement: { slot: 13, template: investigation-testimony }
    scheduled-list:
