    contracts-list-empty:
      material: BARRIER
      name: '<yellow>Сейчас заказов нет'
      lore: ['<empty>']
    contracts-order:
      material: PAPER
      name: '<gold><bold><contract-name>'
      lore:
        - '<gray>Осталось по заказу: <white><remaining><gray>/<white><target>'
        - '<gray>У вас в инвентаре: <white><available>'
        - '<gray>Ваш лимит: <white><player-remaining>'
        - '<gray>Награда: <gold><payout> <white>💰</white> <gray>за единицу'
        - '<gray>Ранг: <gold>+<cap-bonus>% <gray>к лимиту • <gold>+<payout-bonus>% <gray>к выплате'
        - '<gray>До: <white><ends-at>'
