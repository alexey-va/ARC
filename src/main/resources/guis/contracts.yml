    min: "Минимум"
    stack: "Стак"
    max: "Максимум"
  detail:
    title: "<dark_gray>Сдать ресурсы"
    info-heading: "<gold><bold>Общий заказ"
    purpose: "<gray>Ресурсы для поселения."
  messages:
    receipt: "<green>Сдано {quantity} · Получено {payout} <white>💰</white>"
