    unavailable: "<yellow>Этот заказ больше недоступен. Обновите книгу заказов."
    rejections: { }

boards:
  all:
    name: "Все заказы"
  bank_orders:
    name: "Банк"
    speaker: "Фома"
    availability:
      origin-required: "<yellow>Сдача: Фома в палате сделок на спавне"
    detail:
      purpose: "<gray>Металл и принадлежности для конторы."
  guild_orders:
    name: "Гильдия"
    speaker: "Тихомир"
    availability:
      origin-required: "<yellow>Сдача: Тихомир на спавне"
    detail:
      purpose: "<gray>Провизия и материалы для мастерских."
  forge_orders:
    name: "Кузница"
    availability:
      origin-required: "<yellow>Сдача: Мила в кузнице на спавне"
    speaker: "Мила"
    list:
      title: "<dark_gray>Заказы кузницы"
      heading: "<gold><bold>Книга заказов кузницы"
