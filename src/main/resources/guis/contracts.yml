# Generic NPC contract GUI. NPC identity and copy are selected by contract group.
defaults:
  list:
    title: "<dark_gray>Книга заказов"
    heading: "<gold><bold>Книга заказов"
    description-1: "<gray>Здесь принимают нужные ресурсы"
    description-2: "<gray>за указанную награду."
    empty-lore: "<gray>Загляните сюда позже."
  availability:
    ready: "<green>Можно сдать сейчас"
    not-started: "<yellow>Приём ещё не начался"
    closed: "<yellow>Приём сейчас закрыт"
    completed: "<green>Нужный объём уже собран"
    player-cap: "<yellow>Ваш лимит по заказу исчерпан"
