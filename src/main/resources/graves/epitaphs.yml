FALL:
  - "Я тут сто раз прыгал."
  - "Воду ставь! Не снимай, воду ставь!"
  - "Я зажал шифт! Я ЗАЖАЛ, СУКА!"
  - "О, отсюда наш дом вид…"
  - "Ща покажу, как без лестницы."
  - "Не толкай, я скриню."
  - "Это сено? Скажи, что сено!"
  - "Спорим, полсердечка останется?"
  - "Ведро было. Реакции не было."
  - "До воды не хватило одного блока."
  - "Лестницу достроили без него."
LAVA:
  - "А. Ведро лавы. Понятно."
  - "Зелье выпил. А, нет, это было вчера."
  - "Я по краешку. Да отъебись, не упаду."
  - "Не лезь за мной! Ну вот, теперь нас двое."
  - "Да знаю я, что вниз копать нельзя!"
  - "Лови алмазы! Я до тебя не выплыву!"
  - "Какая вода, мы в Незере, блядь!"
  - "Хорош ржать, у меня тут вся жизнь!"
  - "Я выплыл! А как теперь не гореть?!"
  - "Первым делом спас кирку."
FIRE:
  - "Дом туши! Нет, меня! Сначала меня!"
  - "Не бей, я и так горю!"
  - "Я через костёр аккуратненько."
  - "Где вода?! Я тут живой пока!"
  - "Ну дождь же только что был!"
  - "Зажигалку дай. Ты не умеешь."
  - "Сука, жжётся! А с виду потухло."
  - "В речку бегу. КУДА РЕЧКУ ДЕЛИ?!"
  - "Я горю, а ты дверь передо мной закрыл?!"
  - "Дом цел. Спасибо ему."
DROWNING:
  - "Я только сундук гляну."
  - "Наверх! Где, блядь, наверх?!"
  - "Воздух! Мне не факел, мне воздух!"
  - "Блядь, я под лёд заплыл."
  - "Да не бери лодку, тут доплыть."
  - "Я не тону, я по дну иду."
  - "Кинь дверь. Дверь, не топор!"
  - "Вынырну — расскажу, что нашёл."
  - "Нырнул за лутом. Оставил свой."
  - "Лодку потом всё-таки скрафтили."
  - "Держал дыхание вместе с персонажем."
EXPLOSION:
  - "Погоди, у меня чайник свистит."
  - "Тихо, тихо… Кто шипит, сука?"
  - "Я кровать поставил, давайте спать."
  - "Два блока отойди, должно хватить."
  - "Ну один динамит ничего не сделает."
  - "Это кнопка от двери. Наверное."
  - "НЕ ЖМИ, Я ЕЩЁ НЕ…"
  - "ОН СЗАДИ?! У кого сзади?!"
  - "Вход в шахту теперь пошире."
  - "На рычаге было написано «свет»."
  - "Дверь закрыл. Крипер уже был внутри."
PROJECTILE:
  - "Он с такого расстояния не попадёт."
  - "Я выгляну на секундочку."
  - "Щит, щит, щит! Где щит?!"
  - "Я щитом закрылся! А он сзади, блядь!"
  - "Ну попади, ну давай."
  - "Только по ногам, ладно?"
  - "Скелет, у тебя стрелы кончатся вообще?"
  - "Бегу зигзагом! Как ещё надо-то?!"
  - "Стоял за тем, кто умел уворачиваться."
  - "Мишень была левее."
  - "На щите — ни царапины."
MOB:
  - "Это один зомби, алло. ОДИН!"
  - "Да он маленький, хер ли он мне сделает?"
  - "Он слепой! Кто, блядь, побежал?!"
  - "Не смотри ему в глаза. Бля, поздно."
  - "Я не бью собаку, я погладить!"
  - "Ребята, они дверь открыли."
  - "Я одного ударил! Они чё, все братья?!"
  - "Там кто-то дышит. Это ты?"
  - "Я голема кулаком забью, засекайте."
  - "Домой прибежал только пёс."
  - "Голем потом вернулся к цветочкам."
PVP:
  - "Ты чего? Я же приседаю!"
  - "Стой, я запись не включил!"
  - "Свои, свои! ДА Я С ВАМИ, БЛЯДЬ!"
  - "Не бей пока, у меня лагает!"
  - "Дай поесть, сука, по-человечески!"
  - "Он голый, чего вы его боитесь?"
  - "Так, а мы до скольких смертей?"
  - "Бейте его, я отвлекаю! Ребят?"
  - "Ну давай без брони. Чё, слабо?"
  - "Слишком рано написал изи."
  - "Микрофон после боя тоже не выжил."
VOID:
  - "А тут пола вообще нет?!"
  - "Перл, долети, сука, пожалуйста!"
  - "Ещё блок. Ещё блок. БЛОКИ КОНЧИЛИСЬ."
  - "Я ещё падаю. Вы пока стройте."
  - "Я же говорил: мост узкий!"
  - "Не ломай мост, я ещё на нём!"
  - "Погодите, я обратно перл кину. Где остров?"
  - "Он всё ещё ждал, что загрузится земля."
  - "Мост на этом месте уже достроили."
SUFFOCATION:
  - "Убери блок. УБЕРИ БЛОК, БЛЯДЬ!"
  - "Не засыпай, я ещё внутри!"
  - "Я к тебе телепортнулся. Я В СТЕНЕ!"
  - "Где кирка? Почему у меня хлеб?!"
  - "Я только голову просуну."
  - "Копай меня! Меня, не рядом!"
  - "Не ставь там поршень, там моя голова!"
  - "Сверху песок? Да не посыплется."
  - "Дверь прорубили чуть позже."
  - "Попросил закопать себя для скрина."
STARVATION:
  - "У кого еда? Не семена, еда!"
  - "Это последний хлеб? Тогда съешь сам."
  - "Сначала алмазы домой, потом поем."
  - "Да не буду я твою гнилую плоть!"
  - "Я фермер, у меня еды навалом."
  - "Торт не трогать, он для гостей!"
  - "Пшеницу в печь положил. Где хлеб?"
  - "Кто всю пшеницу на коров потратил?!"
  - "При нём нашли три стака пшеницы."
  - "Морковку берёг для свиньи."
FREEZING:
  - "Снег как снег. Чего вы…"
  - "Я же в алмазных! Как мне холодно?!"
  - "Блядь, я в сугробе застрял!"
  - "Кожаные ботинки? Я их выкинул, они говно."
  - "Блядь, я вниз плыву! Это же снег!"
  - "Мы на минутку в горы, да?"
  - "Я тут постою, пока ты за ботинками."
  - "Алмазные ботинки лежат рядом."
  - "Сугроб на карте подписали его именем."
MAGIC:
  - "Ты меня лечишь или добиваешь?!"
  - "Ты сам-то это пил? Ладно, давай."
  - "Это на силу? А почему больно?!"
  - "Читай этикетку, я уже это выпил!"
  - "Ты всё молоко в торт пустил?!"
  - "Я ведьму пережду, у неё зелья кончатся."
  - "Кто боевые зелья в аптечку сунул?!"
  - "Я у тебя бутылку с водой взял. А что?"
  - "В аптечке теперь две полки."
  - "Целитель после этого сменил ник."
LIGHTNING:
  - "Да не ударит в одно место дважды."
  - "Ебануло! ЕЩЁ РАЗ?!"
  - "Я люблю дождь. Только не вот это."
  - "В дом беги! Я грядки досажу."
  - "Молнии в игроков вообще попадают?"
  - "Бей меня молния, если я вру!"
  - "Ну хоть скрин грозы получится."
  - "Громоотвод поставили. На его месте."
  - "Промокнуть не успел."
THORNS:
  - "Ты меня вообще бить собираешься?!"
  - "Он АФК. Ща быстро разберусь."
  - "Так. Это МОИ сердечки?!"
  - "Рыба, блядь, колется!"
  - "Сними броню, ты неправильно дерёшься."
  - "Мне на один удар здоровья хватит."
  - "Сука, да он даже меч не достал!"
  - "Я кулаком добью, меч жалко."
  - "Я сейчас поем. Ты пока так и стой."
  - "Победитель так и не вернулся к клавиатуре."
  - "Забил себя чужой бронёй."
FALLING_BLOCK:
  - "Кто наковальню наверх утащил?!"
  - "Не ломай опору, я под ней!"
  - "Наковальню кидай, я снизу поймаю."
  - "А что за тень?.."
  - "Не скидывай, я по лестнице донесу!"
  - "Капельник ещё и падает?!"
  - "На меня не урони. Я серьёзно."
  - "Наковальню вижу. Отойти некуда."
  - "Наковальня почти не пострадала."
ELYTRA:
  - "Смотри, между деревьями пройду."
  - "Пролезу. Пролезу. НЕ ПРОЛЕЗУ!"
  - "Где тормоз?! Да не смейся, где?!"
  - "У меня чанки не грузятся. О, гора."
  - "Ещё ракету, и точно сверну!"
  - "Убери дерево! Я не успеваю!"
  - "Я тебе прямо в окно залечу, открывай."
  - "Да я в полёте настройки поменяю."
  - "На посадку! А почему я ускоряюсь?!"
  - "Ракеты были хорошие."
WITHER:
  - "Молоко пил! Он снова меня ударил!"
  - "Чёрные сердца — это броня, да?"
  - "Корову сюда! Ведро у меня есть!"
  - "Я от него убежал, почему я умираю?!"
  - "Какой долбоёб призвал босса у дома?!"
  - "Три головы? Ладно. А нас сколько?"
  - "С третьим черепом подожди, я поем."
  - "Маяк потом. Помогите, блядь!"
  - "Да он сдох уже! Чего я-то умираю?!"
  - "Маяк назвали в его честь."
DRAGON:
  - "Он садится! Бейте! Куда вы убежали?!"
  - "Яйцо не трогать! Я за ним вернусь!"
  - "Это дыхание?! Я думал, туман!"
  - "Да куда ты хвостом, блядь?!"
  - "У него полосочка осталась!"
  - "Мне бы одну бутылочку дыхания…"
  - "Бегите. Я ему сейчас в морду дам."
  - "Ты сказал, он сюда не достаёт!"
  - "Я просто посмотреть пришёл!"
  - "Дракона добили. Обещание сдержали."
  - "Титры смотрел с чужого экрана."
GENERIC:
  - "Тут же нельзя умереть, да?"
  - "Сейчас проверю. Отойди."
  - "Блядь, я не ту кнопку нажал."
  - "Ребят, я на минутку, прикройте."
  - "Да не надо гайд, я разберусь."
  - "Можно этот момент из видео вырезать?"
  - "Если что, кота покорми."
  - "Скажешь всем, что я красиво умер."
  - "Не ржите. Я ещё не умер!"
  - "Вернулся за вещами. Добавил ещё."
  - "Просил не ставить дурацкую надпись."
  - "На камень скинулись те, кто ржал."
