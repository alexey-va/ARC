# =============================================================================
# config/commands.yml — подкоманды /arc: name, aliases, permission, player-only, usage.
# messages — MiniMessage для подсказок и ошибок (common, hunt, treasures).
# =============================================================================

commands:
  contracts:
    name: contracts
    aliases: [заказы]
    permission: ''
    player-only: false
    usage: /arc contracts [status|open <группа>|submit <id> <количество>]
  investigation:
    name: investigation
    aliases: [расследование]
    permission: ''
    player-only: false
    usage: /arc investigation [open|clue <свидетель>|verdict <версия>]
  help:
    name: help
    aliases: [ ]
    permission: arc.help.ui.use
  reload:
    name: reload
    aliases: [ ]
    permission: arc.admin
  board:
    name: board
    aliases: [ ]
    permission: arc.board
  items:
    name: items
    aliases: [предметы, каталог]
    permission: arc.items.catalog.use
    player-only: true
    usage: /arc items
  lands:
    name: lands
    aliases: [приват, поселения]
    permission: arc.lands.ui.use
    player-only: true
    usage: /arc lands
  chat:
    name: chat
    aliases: [ ]
    permission: ''
    player-only: true
    usage: /arc chat <local|global>
  commandhide:
    name: commandhide
    aliases: [cmdhide, command-hide]
    permission: arc.command.hide.admin
    player-only: false
    usage: /arc commandhide [allow|restrict|status] [player]
  npc-chat:
    name: npc-chat
    aliases: [ ]
    permission: ''
    player-only: true
    usage: /arc npc-chat <start <роль>|stop [разговор|all]>
  buy:
    name: buy
    aliases: [ ]
    permission: ''
    player-only: true
    max-amount: 2304
    usage: /buy <путь> <кол-во> или /buy <раздел> <товар> <кол-во>
  baltop:
    name: baltop
    aliases: [ ]
    permission: arc.balance.top
    player-only: true
  audit:
    name: audit
    aliases: [ ]
    permission: arc.audit
  repo:
    name: repo
    aliases: [ ]
    permission: arc.admin
  emshop:
    name: emshop
    aliases: [ ]
    permission: arc.admin
  jobsboosts:
    name: jobsboosts
    aliases: [ ]
    permission: arc.jobs.boost.use
  logger:
    name: logger
    aliases: [ ]
    permission: arc.admin
  joinmessage:
    name: joinmessage
    aliases: [ ]
    permission: arc.join.message.gui
  quitmessage:
    name: quitmessage
    aliases: [ ]
    permission: arc.join.message.gui
  respawnonrtp:
    name: respawnonrtp
    aliases: [ ]
    permission: arc.rtp.respawn
  firstrtp:
    name: firstrtp
    aliases: [ ]
    permission: arc.rtp.respawn
    usage: /arc firstrtp <player> <world> | reset <player|uuid> [world|all]
  onboarding:
    name: onboarding
    aliases: [ ]
    permission: arc.admin
    usage: /arc onboarding reset <player|uuid>
  locpool:
    name: locationpool
    aliases: [ ]
    permission: arc.location.pool.admin
  furniture:
    name: furniture
    aliases: [мебель]
    permission: arc.furniture.admin
    player-only: true
    usage: /arc furniture cleanup <1-24> [confirm <token>]
  hunt:
    name: hunt
    aliases: [ ]
    permission: arc.treasure.hunt.admin
    player-only: false
  schedules:
    name: schedules
    aliases: [ scheduler, cron ]
    permission: arc.schedules.gui
    player-only: true
    usage: /arc schedules [run <id>]
  restart:
    name: restart
    aliases: [ reboot ]
    permission: arc.restart
    player-only: false
    usage: /arc restart [-servers all|spawn,survival] [-delay 3m] | /arc restart cancel
  treasures:
    name: treasures
    aliases: [ ]
    permission: arc.treasure.pool.admin
    player-only: false
  test:
    name: test
    aliases: [ ]
    permission: arc.test
  eliteloot:
    name: eliteloot
    aliases: [ ]
    permission: arc.elite.loot.admin
  invest:
    name: invest
    aliases: [ ]
    permission: arc.stocks.buy
  store:
    name: store
    aliases: [ ]
    permission: arc.store
  giveboost:
    name: giveboost
    aliases: [ ]
    permission: arc.jobs.boost.give
  give:
    name: give
    aliases: [ ]
    permission: arc.item.give
    player-only: false
    usage: /arc give <player|list> <preset> [amount]
  pouch:
    name: pouch
    aliases: [мешочек]
    permission: arc.pouch.give
    player-only: false
    usage: /arc pouch <list|player> [pouch] [amount]
  soundfollow:
    name: soundfollow
    aliases: [sound-follow]
    permission: arc.sound.follow
    usage: /arc soundfollow <player> <namespace:sound>
