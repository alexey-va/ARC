# =============================================================================
# auction.yml — категории предметов для аукциона / stock-интеграции (discord и т.д.).
# =============================================================================

# Категории для группировки лотов (строковые теги)
discord-categories:
  - blocks
  - potions
  - tools
  - weapons
  - misc
# Как часто обновлять Discord-витрину (в игровых тиках; 1200 = 60 секунд)
refresh-rate: 1200
# Публиковать полный снимок активных лотов в Discord через ProxyARC
broadcast-items: true
