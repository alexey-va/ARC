        cooldown-min-seconds: 54
        cooldown-max-seconds: 82
        step-ids: [stock, ore, furnace, face-fire, feed, flame, crackle, wait, quench, steam, hiss, line, home]
        steps:
          stock: {type: MOVE, actor-id: 362, anchor: stock, route-profile: floor, timeout-ticks: 220}
          ore: {type: EQUIP, actor-id: 362, material: RAW_IRON}
          furnace: {type: MOVE, actor-id: 362, anchor: furnace, route-profile: floor, timeout-ticks: 220}
          face-fire: {type: LOOK_AT_ANCHOR, actor-id: 362, anchor: furnace}
          feed: {type: SWING, actor-id: 362, repetitions: 2, period-ticks: 12}
          flame: {type: PARTICLE, anchor: furnace, particle: SMALL_FLAME, count: 8}
          crackle: {type: SOUND, anchor: furnace, sound: BLOCK_FURNACE_FIRE_CRACKLE, volume: 0.38, pitch: 0.88}
          wait: {type: WAIT, ticks: 50}
          quench: {type: MOVE, actor-id: 362, anchor: quench, route-profile: floor, timeout-ticks: 180}
          steam: {type: PARTICLE, anchor: quench, particle: CLOUD, count: 9}
          hiss: {type: SOUND, anchor: quench, sound: BLOCK_FIRE_EXTINGUISH, volume: 0.44, pitch: 1.2}
