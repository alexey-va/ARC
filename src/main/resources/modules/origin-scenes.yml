          face: {type: LOOK_AT_ANCHOR, actor-id: 354, anchor: apprentice-anvil}
          carve: {type: SWING, actor-id: 354, repetitions: 8, period-ticks: 9}
          sparks: {type: PARTICLE, anchor: apprentice-anvil, particle: CRIT, count: 7}
          line: {type: SPEECH, actor-id: 354, text: "Ещё одна риска — и клеймо готово."}
          rest: {type: WAIT, ticks: 20}
      ore-inspection:
