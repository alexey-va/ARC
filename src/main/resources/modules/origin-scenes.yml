        initial-delay-seconds: 14
        cooldown-min-seconds: 52
        cooldown-max-seconds: 78
        step-ids: [stock, face, take, inspect, clink, line, home]
        steps:
          stock: {type: MOVE, actor-id: 351, anchor: stock, route-profile: floor, timeout-ticks: 240}
          face: {type: LOOK_AT_ANCHOR, actor-id: 351, anchor: stock}
          take: {type: EQUIP, actor-id: 351, material: RAW_IRON}
          inspect: {type: SWING, actor-id: 351, repetitions: 2, period-ticks: 14}
