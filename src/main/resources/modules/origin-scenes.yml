          ring: {type: SOUND, anchor: master-anvil, sound: BLOCK_ANVIL_LAND, volume: 0.34, pitch: 1.18}
          remark: {type: SPEECH, actor-id: 349, text: "Ровный звон. Значит, металл ещё слушается."}
          rest: {type: WAIT, ticks: 24}
      ledger-orders:
        actor-ids: ["350"]
        initial-delay-seconds: 12
        cooldown-min-seconds: 40
        cooldown-max-seconds: 65
        step-ids: [desk, paper, write, page, line, rest]
