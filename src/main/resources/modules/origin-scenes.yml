          strike: {type: SWING, actor-id: 358, repetitions: 3, period-ticks: 12}
          ring: {type: SOUND, anchor: hammer-anvil, sound: BLOCK_ANVIL_LAND, volume: 0.32, pitch: 0.84}
          sparks: {type: PARTICLE, anchor: hammer-anvil, particle: ELECTRIC_SPARK, count: 5}
          pause: {type: WAIT, ticks: 18}
