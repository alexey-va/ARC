        initial-delay-seconds: 5
        cooldown-min-seconds: 22
        cooldown-max-seconds: 38
        step-ids: [face, equip, hammer, ring, remark, rest]
        steps:
          face: {type: LOOK_AT_ANCHOR, actor-id: 349, anchor: master-anvil}
