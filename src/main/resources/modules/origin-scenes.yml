          hit: {type: SOUND, anchor: dummy, sound: ENTITY_ARMOR_STAND_HIT, volume: 0.38, pitch: 1.06}
          sweep: {type: PARTICLE, anchor: dummy, particle: SWEEP_ATTACK, count: 2}
          line: {type: SPEECH, actor-id: 355, text: "Корпус ниже. Клинок сам найдёт линию."}
