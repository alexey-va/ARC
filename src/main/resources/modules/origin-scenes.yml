# Kotlin-owned ambient NPC choreography for Origin. Denizen must not own these
# actors' background movement at the same time.
world: rc_origin_spawn
tick-ticks: 20

speech:
  duration-ticks: 100
  height: 2.65
  view-range: 1.0
  scale: 0.95

scene-ids: [forge, mount-yard]

