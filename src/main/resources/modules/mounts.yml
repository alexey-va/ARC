# Native ARC Mounts 1.0. Runtime mirrors override enabled, purchases-enabled and allowed-worlds.
enabled: false
ownership-migration-complete: false
purchases-enabled: false
allowed-worlds: []
session-duration: 12h
admin-session-duration: 10s

controls:
  double-sneak-window: 450ms
  hint-cooldown: 5s

quick-summon:
  # Uses the client's "swap item with offhand" action, F by default, while sneaking.
  sneak-swap-hands: true
  # Reusable PDC-marked goat horn issued from the mount details menu.
  whistle: true

rider-view:
  # Hide only from the rider, with hysteresis to prevent flicker near the threshold.
  hide-flying-mount: true
  hide-at-pitch: 35
  show-at-pitch: 20

movement:
  walking-speed-scale: 0.16
  flying-speed-scale: 0.55
  swimming-speed-scale: 0.45
  # 0s restores instant response. Individual mounts may override these under mounts.<id>.motion.
  acceleration-time: 900ms
  deceleration-time: 350ms
  turn-time: 200ms
  sprint-multiplier: 1.15
  jump-velocity: 0.5
  vertical-speed-ratio: 0.75
  maximum-vertical-speed: 0.65
  flight-pitch-influence: 0.65
  maximum-speed-blocks-per-tick: 1.05
  maximum-height-above-world: 32
  # Cancels Minecraft's 0.2 airborne block-breaking multiplier while flying.
  compensate-airborne-mining: true

tuning:
  # Free player-selected percentage of the maximum speed unlocked by the current level.
  speed-percentages: [50, 65, 80, 90, 100]
  # Walking mounts only. Higher values intentionally let mounts climb walls.
  walking-step-heights: [1.10, 1.50, 2.00, 3.00, 4.00]
  # Level 1 clears ordinary blocks; levels 2 and 3 unlock two- and four-block climbing.
  walking-max-step-height-by-level: [1.10, 2.00, 4.00]

safety:
  post-flight-slow-falling: 8s
  idle-timeout: 5m
  summon-cooldown: 2s
  rider-knockoff-damage: 6.0

