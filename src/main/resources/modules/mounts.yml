# Native ARC Mounts 1.0. Runtime mirrors override enabled, purchases-enabled and allowed-worlds.
enabled: false
ownership-migration-complete: false
purchases-enabled: false
allowed-worlds: []
session-duration: 12h
admin-session-duration: 10s

controls:
  double-sneak-window: 450ms
  hint-cooldown: 5s

movement:
  walking-speed-scale: 0.16
  flying-speed-scale: 0.55
  swimming-speed-scale: 0.45
  acceleration: 0.28
  deceleration: 0.38
  turn-smoothing: 0.32
  sprint-multiplier: 1.15
  jump-velocity: 0.5
  vertical-speed-ratio: 0.75
  maximum-vertical-speed: 0.65
  flight-pitch-influence: 0.65
  maximum-speed-blocks-per-tick: 1.05
  maximum-height-above-world: 32

safety:
  post-flight-slow-falling: 8s
  idle-timeout: 5m
  summon-cooldown: 2s
  rider-knockoff-damage: 6.0

gui:
  list-title: "<dark_gray><bold>Коллекция маунтов"
  detail-title: "<dark_gray><bold>Маунт: <mount>"
  skins-title: "<dark_gray><bold>Облики: <mount>"
  back-command: m

messages:
  ground-controls: "<gray>WASD — движение, Space — прыжок, Shift — спешиться"
  flight-controls: "<gray>WASD — движение, Space — вверх, Shift — вниз, двойной Shift — спешиться"
  descending: "<aqua>Снижение… <gray>двойной Shift — спешиться"
  expired: "<gray>Время поездки закончилось."
  already-riding: "<red>Вы уже используете маунта."
  already-in-vehicle: "<red>Сначала покиньте текущее транспортное средство."
  world-not-allowed: "<red>В этом мире маунты недоступны."
  water-required: "<aqua>Водного маунта можно призвать только в воде."
  summon-cooldown: "<yellow>Подождите немного перед повторным призывом."
  spawn-failed: "<red>Не удалось призвать маунта."
  purchases-disabled: "<yellow>Покупки маунтов доступны на спавне."
  purchase-success: "<green>Покупка сохранена!"
  setting-saved: "<green>Настройка сохранена."
  purchase-busy: "<yellow>Предыдущая операция ещё выполняется."
  already-owned: "<yellow>Это уже выбрано или куплено."
  invalid-level: "<red>Сначала купите предыдущий уровень."
  not-unlocked: "<red>Сначала разблокируйте маунта или облик."
  not-for-sale: "<red>Это улучшение нельзя купить."
  economy-unavailable: "<red>Экономика временно недоступна."
  not-enough-money: "<red>Недостаточно денег."
  payment-failed: "<red>Платёж не прошёл. Деньги не списаны."
  journal-unavailable: "<red>Покупки временно приостановлены. Деньги не списаны."
  setting-failed: "<red>Не удалось сохранить настройку."
  save-failed-refunded: "<red>Покупка не сохранилась. Деньги полностью возвращены."
  purchase-manual-review: "<dark_red>Покупка приостановлена для безопасной проверки. Повторно не покупайте; обратитесь к администрации."

cosmetics:
  starlight:
    name: "Звёздный комплект"
    item: AMETHYST_SHARD
    trail:
      particle: END_ROD
      interval-ticks: 3
      count: 2
  shadow:
    name: "Теневой комплект"
    item: ECHO_SHARD
    trail:
      particle: SOUL
      interval-ticks: 4
      count: 2
  flame:
