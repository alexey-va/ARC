# Public defaults only. Put real credentials in the private server config:
# plugins/ARC/modules/resourcepack-sync.yml
enabled: true

aws:
  access-key-id: ""
  secret-access-key: ""
  default-region: "ru-central1"
  cli: "aws"

s3:
  endpoint: "https://storage.yandexcloud.net"
  bucket: "ruscraftinresources"
  upload-name: "RusCraftingResource.zip"
  key: "RusCraftingResource.zip"
  manifest-key: "RusCraftingResource.zip.sha256"

publish-notification:
  enabled: true
  redis-cli: "redis-cli"

survival-mirror:
  enabled: false
  source-server-dir: classic
  # Optional directory=session entries, e.g. classic_survival=survival and parkour=parkour.
  # Empty keeps the legacy target-server-dir/target-tmux-session pair below.
  targets: []
  target-server-dir: classic_survival
  target-tmux-session: survival
  backup-keep: 3
  reload-timeout-seconds: 120

force-upload: false
