# =============================================================================
# metrics.yml — Prometheus scrape endpoint (localhost, no auth).
#
# Exposed via nginx on Gercena for utils Prometheus (see gercena-metrics-proxy.conf).
# Gauges refresh on a slow timer — scrape only reads cached values (no main-thread work).
# =============================================================================

enabled: true

bind-host: "127.0.0.1"
bind-port: 9950

# Cheap gauges: TPS, memory, players, redis (seconds)
sample-interval-seconds: 5

# Expensive: sum loaded chunks across worlds (seconds)
heavy-sample-interval-seconds: 60
include-loaded-chunks: true
