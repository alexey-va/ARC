# =============================================================================
# metrics.yml — Prometheus scrape endpoint (localhost, no auth).
#
# Exposed via nginx on Gercena for utils Prometheus (see gercena-metrics-proxy.conf).
# Gauges refresh on slow timers — scrape only reads cached values (no platform/API work).
# =============================================================================

enabled: true

bind-host: "127.0.0.1"
bind-port: 9950

# JVM/OS plus cheap Paper gauges: TPS, MSPT, players, Redis (seconds)
sample-interval-seconds: 5

# Disk and Paper world detail: chunks, entities, block entities, distances (seconds)
heavy-sample-interval-seconds: 60

include-jvm: true
include-system: true
include-disk: true
include-platform-heavy: true

# Network product journey telemetry. Dynamic values (worlds, command roots and
# NPC IDs) stay in the authenticated ops report and never become metric labels.
product-interest:
  enabled: true
  network-enabled: true
  timezone: "Europe/Moscow"
  retention-days: 35
  active-window-seconds: 300
  movement-threshold-blocks: 2.0
  persist-interval-seconds: 30
  max-tracked-players: 10000
  max-detail-values-per-player-day: 128
  qa-player-names:
    - "CodexQA_728"
    - "GrocerMC"
    - "foll"
  meaningful-thresholds:
    block-break: 64
    block-place: 32
    craft: 8
    mob-kill: 5
    chat: 3

# Product metrics for EliteMobs/OTD dungeon worlds. Player identity is never a label.
dungeon-interest:
  enabled: true
  world-globs:
    - "em_*"
    - "spn_*"
    - "otd_dungeon"
  excluded-worlds:
    - "em_adventurers_guild" # EliteMobs hub, not a dungeon visit
  max-tracked-worlds: 128
