        col-0: <#e8dfd2>Лесная сторожка у старой сосны
        col-1: <#e8dfd2>Тропа вдоль ручья
        col-2: <#e8dfd2>Есть указатели
      row-2:
        col-0: <#e8dfd2>Старая пристань
        col-1: <#e8dfd2>Береговая дорога
        col-2: <#e8dfd2>Свободный проход
    '3':
      title: <#ffb277><bold>Длинный текст · высота по содержимому</bold>
      row-0:
        col-0: <#86dcf1>Северная мастерская у старой пристани
      row-1:
        col-0: <#e8dfd2>Пройдите вдоль ограды до рабочего стола. Там подготовлены инструменты и дорожные припасы.
      row-2:
        col-0: <#e8dfd2>Перед выходом осмотрите чертежи. Кошель <white>💰</white> лежит на полке рядом с картой, а дорожный плащ висит у двери.
      row-3:
        col-0: <#e8dfd2>Путь проходит через каменный мост, мимо высокой сосны и дальше вдоль ручья к лесной сторожке.
      row-4:
        col-0: <#e8dfd2>Указатели помогут на развилках. После дождя береговая тропа становится скользкой, поэтому выбирайте каменную дорогу.
      row-5:
        col-0: <#9bd48d>Маршрут проверен — можно продолжить путешествие.
    note: <#e8dfd2>Высота следует за текстом. Колонки переносят слова независимо; фон не перекрывает буквы и тени.
