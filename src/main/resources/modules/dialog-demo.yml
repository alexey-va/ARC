    row-1: {feature: Участники, base: '1', expanded: '2', team: '8'}
    row-2: {feature: Проекты, base: '2', expanded: '4', team: '12'}
    row-3: {feature: Общий план, base: '—', expanded: Да, team: Да}
    row-4: {feature: Архив, base: '7 дней', expanded: '14 дней', team: '30 дней'}
  ranking:
    place: '#'
    builder: Строитель
    count: Построек
    row-1: {name: Северный ветер, count: '1 248'}
    row-2: {name: Тихий мастер, count: '312'}
    row-3: {name: Лесной странник, count: '87'}
    row-4: {name: Новый сосед, count: '6'}
  details:
    title: Лесная мастерская
    row-1: {label: Владелец, value: Тихий мастер}
    row-2: {label: Участники, value: '4 / 8'}
    row-3: {label: Готовые проекты, value: '24'}
    row-4: {label: Последнее обновление, value: Сегодня}
    row-5: {label: Доступ, value: По приглашению}
  tooltip:
    label: Параметр
    value: Значение
  tables:
    intro: <#C6D5E1>Сравните оформление на одинаковых данных. Запомните номера понравившихся вариантов.
    page-1: <gray>Т01–Т03 · лёгкие таблицы без тяжёлых рамок.</gray>
    page-2: <gray>Т04–Т06 · точки, тонкая рамка и двойной контур.</gray>
    page-3: <gray>Т07–Т09 · акцентные линии и ритм строк.</gray>
    page-4: <gray>Т10–Т12 · сравнение, рейтинг и карточка сведений.</gray>
    page-5: <gray>Т13–Т15 · common, uncommon и rare tooltip-рамки.</gray>
    page-6: <gray>Т16–Т18 · epic, legendary и artifact tooltip-рамки.</gray>
    1:
      title: <#E8C383><bold>Т01 · Свободные колонки
      note: <#9AA8B7>Только заголовок и данные. Самый спокойный вариант.
    2:
      title: <#E8C383><bold>Т02 · Тонкий реестр
      note: <#9AA8B7>Линии под заголовком и внизу удерживают общий блок.
    3:
      title: <#83C9E8><bold>Т03 · Вертикальные границы
      note: <#9AA8B7>Колонки отделены, строки остаются открытыми.
    4:
      title: <#95D5B2><bold>Т04 · Точечный ритм
      note: <#9AA8B7>Мягкие разделители помогают вести взгляд по строке.
    5:
      title: <#E8C383><bold>Т05 · Тонкая рамка
      note: <#9AA8B7>Классическая сетка с выделенной строкой заголовка.
    6:
      title: <#83C9E8><bold>Т06 · Двойной контур
      note: <#9AA8B7>Самая выраженная рамка — для особого информационного блока.
    7:
      title: <#95D5B2><bold>Т07 · Открытые края
      note: <#9AA8B7>Две акцентные линии, никаких внутренних перегородок.
    8:
      title: <#C2A9E8><bold>Т08 · Отдельные строки
      note: <#9AA8B7>Больше воздуха и короткий вертикальный акцент у каждой записи.
    9:
      title: <#83C9E8><bold>Т09 · Акцент на числах
      note: <#9AA8B7>Цветная числовая колонка и чередование яркости строк.
    10:
      title: <#83C9E8><bold>Т10 · Сравнение
      note: <#9AA8B7>Четыре колонки. Значения по центру каждой категории.
    11:
      title: <#E8C383><bold>Т11 · Рейтинг
      note: <#9AA8B7>Номера и результаты по правому краю; первая строка выделена.
    12:
      title: <#C2A9E8><bold>Т12 · Карточка сведений
      note: <#9AA8B7>Подписи слева, значения справа. Для профиля или подробностей.
    13:
      title: <#B8C0C8><bold>Т13 · Common tooltip
      note: <#9AA8B7>Серая рамка собрана из 15 глифов исходного tooltip-дизайна.
    14:
      title: <#80D860><bold>Т14 · Uncommon tooltip
      note: <#9AA8B7>Зелёная рамка собрана из углов, линий и стыков без масштабирования.
    15:
      title: <#83C9E8><bold>Т15 · Rare tooltip
      note: <#9AA8B7>Синяя рамка использует исходный пиксельный орнамент rare-tooltip.
    16:
      title: <#C080FF><bold>Т16 · Epic tooltip
      note: <#9AA8B7>Фиолетовая рамка сохраняет смещённые декоративные углы epic-дизайна.
    17:
      title: <#FFD050><bold>Т17 · Legendary tooltip
      note: <#9AA8B7>Золотая рамка использует первый нативный кадр анимированного дизайна.
    18:
      title: <#FF7080><bold>Т18 · Artifact tooltip
      note: <#9AA8B7>Красная рамка использует первый нативный кадр анимированного дизайна.
  dividers:
    intro: <#C6D5E1>Сравните толщину, ритм и акценты. Номера Р01–Р18 помогут выбрать сочетание с таблицей.
    sample: Раздел
    page-1: <gray>Р01–Р06 · простые линии и пунктиры.</gray>
    page-2: <gray>Р07–Р12 · короткие акценты и заголовки.</gray>
    page-3: <gray>Р13–Р18 · цветовые переходы и края блока.</gray>
    1: {title: '<#E8C383><bold>Р01 · Тонкая линия', note: '<#9AA8B7>Нейтральная граница между разделами.'}
    2: {title: '<#E8C383><bold>Р02 · Двойная линия', note: '<#9AA8B7>Более заметное разделение крупных блоков.'}
    3: {title: '<#E8C383><bold>Р03 · Нижняя черта', note: '<#9AA8B7>Линия опущена к основанию строки.'}
    4: {title: '<#E8C383><bold>Р04 · Мелкие точки', note: '<#9AA8B7>Лёгкая и ненавязчивая структура.'}
    5: {title: '<#E8C383><bold>Р05 · Крупные точки', note: '<#9AA8B7>Более выраженный точечный ритм.'}
    6: {title: '<#E8C383><bold>Р06 · Пунктир', note: '<#9AA8B7>Равные штрихи с широкими промежутками.'}
    7: {title: '<#83C9E8><bold>Р07 · Короткий акцент', note: '<#9AA8B7>Компактная линия по центру.'}
    8: {title: '<#E8C383><bold>Р08 · Ромб', note: '<#9AA8B7>Небольшой центральный знак и два коротких крыла.'}
    9: {title: '<#83C9E8><bold>Р09 · Открытый ромб', note: '<#9AA8B7>Тонкий знак и длинные спокойные линии.'}
    10: {title: '<#83C9E8><bold>Р10 · Заголовок в линии', note: '<#9AA8B7>Название раздела становится частью разделителя.'}
    11: {title: '<#E8C383><bold>Р11 · Заголовок в точках', note: '<#9AA8B7>Мягкая версия разделителя с подписью.'}
    12: {title: '<#C2A9E8><bold>Р12 · Скобки', note: '<#9AA8B7>Минимальная рамка вокруг короткого названия.'}
    13: {title: '<#83C9E8><bold>Р13 · Три сегмента', note: '<#9AA8B7>Три согласованных цвета на одной линии.'}
    14: {title: '<#E8C383><bold>Р14 · Акцент у начала', note: '<#9AA8B7>Короткий двойной участок и тонкое продолжение.'}
    15: {title: '<#C2A9E8><bold>Р15 · Переход цвета', note: '<#9AA8B7>Плавная смена голубого на сиреневый.'}
    16: {title: '<#83C9E8><bold>Р16 · Верхний край', note: '<#9AA8B7>Открывающая граница карточки с углами.'}
    17: {title: '<#C2A9E8><bold>Р17 · Нижний край', note: '<#9AA8B7>Закрывающая граница карточки с углами.'}
    18: {title: '<#83C9E8><bold>Р18 · Две строки', note: '<#9AA8B7>Две отдельные линии с небольшим вертикальным интервалом.'}

# Standalone installed-library gallery; always uses its named fonts on both nodes.
design:
  title: <#86dcf1><bold>Библиотека оформления Dialogue</bold>
  intro: |-
    <#e8dfd2>Выберите раздел и сравните компоненты прямо в игре.
    <#e8dfd2>Кнопки-образцы показывают отклик, игровые действия не выполняются.
  page: <#e8dfd2>Образцы · %page%
  previous: <#92bed8>‹ Предыдущая страница
  previous-tip: <#e8dfd2>Показать предыдущие образцы этого раздела.
  next: <#92bed8>Следующая страница ›
  next-tip: <#e8dfd2>Показать следующие образцы этого раздела.
  back: <white>‹ Назад
  back-tip: <#e8dfd2>Вернуться к посещённому разделу.
  close: <white>Закрыть галерею
  close-tip: <#e8dfd2>Закрыть галерею и вернуться в игру.
  sample-tip: <#e8dfd2>Образец оформления. Нажмите, чтобы увидеть отклик этой кнопки.
  sample-selected: '<#e8dfd2>Нажат образец: '
  sections:
    panels:
      label: <#d5b58c>Фоны и границы · 5 ›
      title: <#d5b58c><bold>Фоны и границы</bold>
      tip: <#e8dfd2>Пять оформлений на одинаковых четырёх полях.
      intro: <#e8dfd2>Сравните заливку и форму границы. Ширина следует за содержимым.
    layouts:
      label: <#86dcf1>Компактные раскладки · 4 ›
      title: <#86dcf1><bold>Компактные раскладки</bold>
      tip: <#e8dfd2>Строки, показатели, капсулы и группы с заголовками.
      intro: <#e8dfd2>Те же четыре факта, разная организация пространства.
    sizes:
      label: <#91cbb1>Размеры и переносы ›
      title: <#91cbb1><bold>Размеры и переносы</bold>
      tip: <#e8dfd2>Одна, две и три колонки; узкий блок с длинным текстом.
      intro: <#e8dfd2>Подписи и значения остаются рядом при разных размерах.
    elements:
      label: <#c3a3d5>Списки, шаги и прогресс ›
      title: <#c3a3d5><bold>Элементы содержания</bold>
      tip: <#e8dfd2>Пункты, состояния, путь, числовой прогресс и заголовки.
      intro: <#e8dfd2>Состояние обозначается словами; неизвестные данные не превращаются в нулевой прогресс.
    icons:
      label: <#d5b58c>Значки полей · 10 ›
      title: <#d5b58c><bold>Значки полей</bold>
      tip: <#e8dfd2>Маленький значок рядом с обычной подписью поля.
      intro: <#e8dfd2>Значки помогают найти поле, но не заменяют его название.
    text:
      label: <#86dcf1>Текстовые композиции · 6 ›
      title: <#86dcf1><bold>Текстовые композиции</bold>
      tip: <#e8dfd2>Уголки, заголовок, шаги, чек-лист, сравнение и четыре палитры прогресса.
      intro: <#e8dfd2>Один образец на странице. Все надписи остаются обычным текстом.
    actions:
      label: <#9bd48d>Функциональные кнопки · 21 ›
      title: <#9bd48d><bold>Функциональные кнопки</bold>
      tip: <#e8dfd2>Все 20 стилей действий и отдельный образец «Назад».
      intro: <#e8dfd2>Сравните цвет, значок, наведение и нажатие. Здесь каждое действие — только образец.
    ornaments:
      label: <#c4abff>Декоративные рамки · 4 ›
      title: <#c4abff><bold>Декоративные рамки</bold>
      tip: <#e8dfd2>Двойной угол, шевроны, развилка и клинья.
      intro: <#e8dfd2>Четыре орнамента на одинаковых нативных кнопках.
    tables:
      label: <#f4d87a>Таблицы · T13–T18 ›
      title: <#f4d87a><bold>Текстурные таблицы</bold>
      tip: <#e8dfd2>Шесть существующих tooltip-рамок с одинаковыми данными.
      intro: <#e8dfd2>Одна таблица на странице. Сравните рамки, стыки и выравнивание колонок.
    dividers:
      label: <#92bed8>Разделители · 18 ›
      title: <#92bed8><bold>Разделители</bold>
      tip: <#e8dfd2>Все 18 прежних образцов, по шесть на странице.
      intro: <#e8dfd2>Линии, точки, заголовки и цветовые переходы.
    filled:
      label: <#ffb277>Рамка с заливкой · новая ›
      title: <#ffb277><bold>Закрытая рамка с фоном</bold>
      tip: <#e8dfd2>Компактная плашка, две и три колонки, длинный текст с переносами.
      intro: <#e8dfd2>Проверьте фон и края рамки, чёткость букв и сохранённые тени.
  actions:
    '21': <#9bd48d>ОК
    '22': <white>Отмена
    '23': <#9bd48d>Добавить
    '24': <#92bed8>Предыдущая
    '25': <#92bed8>Следующая
    '26': <#9bd48d>Сохранить
    '27': <white>Поиск
    '28': <#e5ba73>Фильтры
    '29': <#f4d87a>Избранное
    '30': <white>Настройки
    '31': <#86dcf1>Копировать
    '32': <#86dcf1>Поделиться
    '33': <#9bd48d>Забрать
    '34': <#c4a7e7>Создать
    '35': <#9bd48d>Включено
    '36': <white>Выключено
    '37': <white>Заблокировано
    '38': <#ff6b61>Удалить
    '39': <#ffb277>Сбросить
    '40': <#9bd48d>Запустить
    back: <white>Назад
  ornaments:
