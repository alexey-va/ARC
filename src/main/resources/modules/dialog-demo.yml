      sample: |-
        <#86dcf1>Северная тропа
        <#e8dfd2>Дойдите до каменного моста.
        <#e8dfd2>За ним видна старая башня.
      note: <#e8dfd2>Уголки выделяют короткий абзац без сплошного фона.
    '1':
      title: <#86dcf1><bold>02 · Заголовок и разделитель</bold>
      sample-title: <#86dcf1>Путь к мастерской
      sample: <#e8dfd2>Подготовьте инструменты перед выходом.
      note: <#e8dfd2>Заголовок объединяет следующий за ним текст.
    '2':
      title: <#86dcf1><bold>04 · Связанные шаги</bold>
