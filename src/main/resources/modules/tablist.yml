    - '&#F6C453%rediseco_bal_short_vault% &#FFFFFF💰 &#7C8596• &#B58CFF%rediseco_bal_short_tokens% &#FFFFFF'
  location:
    - '&#F4F6FA%arc_worldname%'
    - '@survival ?&#9BD48D%lands_land_name_plain_here%'
