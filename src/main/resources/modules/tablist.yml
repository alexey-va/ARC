# TAB owns the player table. ARC publishes personal multiline header/footer via TAB-Bridge.
# Settings are separate from the sidebar; new optional sections default off.
# This is a visual budget, not a protocol limit. Whole sections return when space is available.
maximum-rows: 22
brand:
  - ''
  - '&#FFFFFF      󰼑      &r'
  - ''
  - ''
