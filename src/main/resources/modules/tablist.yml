# TAB owns the player table. ARC publishes personal multiline header/footer via TAB-Bridge.
# Settings are separate from the sidebar; new optional sections default off.
# Settings reserve the full section height. Whole-section trimming protects older oversized selections.
# This is a visual budget, not a protocol limit.
maximum-rows: 22
brand:
  - ''
  - '&#FFFFFF      󰼑      &r'
  - ''
  - ''
sections:
  profile:
    - '&#FFFFFF%player% &#7C8596• &#53CFE0%arcranks_rank_name%'
  balance:
    - '&#F6C453%rediseco_bal_short_vault% &#FFFFFF💰 &#7C8596• &#B58CFF%rediseco_bal_short_tokens% &#FFFFFF'
  location:
    - '<font:arc:small_caps><#F6C453>Мир</#F6C453> <#F4F6FA>%arc_worldname%</#F4F6FA></font>'
    - '@survival ?<font:arc:small_caps><#F6C453>Место</#F6C453> <#9BD48D>%lands_land_name_plain_here%</#9BD48D></font>'
  coordinates:
    - '<font:arc:small_caps><#F6C453>XYZ</#F6C453> <#63D18E>%player_x% %player_y% %player_z%</#63D18E>  <#F6C453>Взгляд</#F6C453> <#63D18E>%player_direction%</#63D18E></font>'
  rank-progress:
    - '?<font:arc:small_caps><#F6C453>Ранг</#F6C453> <#F4F6FA>%arcranks_next_rank%</#F4F6FA>  <#F6C453>Прогресс</#F6C453> <#63D18E>%arcranks_next_rank_progress_compact%</#63D18E></font>'
  quests:
    - '?&#F6C453%arcranks_quest_board_header%'
    - '?&#F4F6FA%arcranks_quest_board_1%'
    - '?&#F4F6FA%arcranks_quest_board_2%'
    - '?&#F4F6FA%arcranks_quest_board_3%'
  activity:
    - '?<font:arc:small_caps><#F6C453>%arc_sidebar_activity_name%</#F6C453>  <#F4F6FA>Сундуки</#F4F6FA> <#63D18E>%arc_sidebar_activity_progress%</#63D18E></font>'
  profession:
    - '&#F6C453Профессии'
    - '?&#F4F6FA%arc_sidebar_profession_1%'
    - '?&#F4F6FA%arc_sidebar_profession_2%'
  skills:
    - '&#F6C453Навыки'
    - '?&#F4F6FA%arc_sidebar_skill_1%'
    - '?&#F4F6FA%arc_sidebar_skill_2%'
  online:
    - '<font:arc:small_caps><#F6C453>Онлайн</#F6C453> <#63D18E>%online%</#63D18E></font>'
  technical:
    - '<font:arc:small_caps><#F6C453>Пинг</#F6C453> <#63D18E>%player_ping% мс</#63D18E>  <#F6C453>Tps</#F6C453> <#63D18E>%server_tps_5_colored%</#63D18E></font>'
