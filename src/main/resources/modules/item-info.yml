# Контекстная информация только для блоков ItemsAdder и Slimefun.
enabled: true
target-distance: 5.0
# Exact item IDs hidden from ARC's contextual item-info display.
excluded-item-ids: []

text:
  name-only: '<white><name>'
  hologram: '<white><name><newline><gray><id>'
  bossbar: '<white><name> <dark_gray>· <gray><id>'

chest-preview:
  max-items: 6
  max-distance: 4.5
  vertical-gap: 0.15
  # 0 = transparent, 100 = opaque; applied by /arc reload.
  background-opacity: 40
  # Native ItemDisplay model transform context: GUI, FIXED, or NONE; applied by /arc reload.
  item-transform: GUI
