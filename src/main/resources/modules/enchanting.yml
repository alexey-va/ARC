loot:
  server: survival
  worlds: [survival, vanilla, mining, survival_nether, vanilla_nether, world, world_nether, world_the_end]
  # One exclusive bonus roll: a book OR one dust. Creative, spawners and EliteMobs are excluded.
  natural-kill:
    book-percent: 0.2
    dust-percent: 0.8
  open-water-fishing:
    book-percent: 0.5
    dust-percent: 1.5
  # Personal operator QA odds; apply changes with /arc reload, without a server restart.
  # Only listed names are matched (case-insensitive). Omitted activities use ordinary odds.
  # Creative stays ineligible unless that named profile explicitly sets allow-creative: true
  # and configures the activity. Adventure/Spectator are always excluded; OP grants no opt-in.
  # Chunk quotas, cooldowns, natural-block and mature-crop requirements still apply.
  test-overrides:
    enabled: false
    players: {}
    # Replace {} with a named profile, for example:
    #   CodexQA_728:
    #     allow-creative: false
    #     mining-cache:
    #       chance-percent: 100
    #       key-chance-percent: 0
    #     world-cache:
    #       one-in: 1
    #     farming-cache:
    #       chance-percent: 100
    #       key-chance-percent: 0
    # 100/0 selects boxes; use 0/100 for native case_daily keys. Disable after QA.
  # One shared find per chunk; Fortune and repeat placements do not multiply the reward.
  mining-cache:
    enabled: true
    chance-percent: 0.02
    key-chance-percent: 0.001
    worlds: [survival, vanilla, mining]
    materials: [STONE, DEEPSLATE, COAL_ORE, DEEPSLATE_COAL_ORE, IRON_ORE, DEEPSLATE_IRON_ORE,
      COPPER_ORE, DEEPSLATE_COPPER_ORE, GOLD_ORE, DEEPSLATE_GOLD_ORE, REDSTONE_ORE,
      DEEPSLATE_REDSTONE_ORE, LAPIS_ORE, DEEPSLATE_LAPIS_ORE, DIAMOND_ORE,
      DEEPSLATE_DIAMOND_ORE, EMERALD_ORE, DEEPSLATE_EMERALD_ORE]
  # A selected explored chunk gets one bounded surface placement attempt.
  world-cache:
    enabled: true
    one-in: 128
    worlds: [survival, vanilla]
  # Manual harvest of fully grown crops; a find reserves its chunk for all players for one day.
  farming-cache:
    enabled: true
    chance-percent: 0.01
    key-chance-percent: 0.0005
    cooldown-seconds: 86400
    worlds: [survival, vanilla, world, survival_nether, vanilla_nether, world_nether]
    materials: [WHEAT, CARROTS, POTATOES, BEETROOTS, COCOA, NETHER_WART]
  group-weights:
    SIMPLE: 55
    UNIQUE: 25
    ELITE: 15
    ULTIMATE: 4
    LEGENDARY: 1
