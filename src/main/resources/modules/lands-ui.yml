  create-title: '<#c4a7e7>Новое поселение'
  create-body: '<#e8dfd2>Поселение появится там, где вы стоите.<newline><#e8dfd2>Первый чанк защищается автоматически и бесплатно. Новое поселение сразу станет текущим.<newline><newline><#e8dfd2>Название: 5–24 символа, буквы, цифры, _ или - без пробелов.'
