  mainblock-title: '<#86dcf1>Главный блок · <land>'
  mainblock-body: '<#e8dfd2>Чтобы перенести главный блок:<newline><#d7b486>1. <#e8dfd2>Откройте расширенные настройки.<newline><#d7b486>2. <#e8dfd2>Нажмите ЛКМ по колоколу и уберите блок.<newline><#d7b486>3. <#e8dfd2>В новом месте снова откройте меню и установите его.<newline><newline><#e8dfd2>На сервере перенос бесплатный. ПКМ по колоколу переключает голограмму.'

  guide-title: '<#86dcf1>Гайд по приватам'
  guide-body: '<#9bd48d>Поселение<#e8dfd2> — твой приват: защищённые чанки, участники и общая точка дома.<newline><newline><#86dcf1>Чанк<#e8dfd2> — участок 16×16 блоков. Приват защищает его на всю высоту мира: от бедрока до неба. За границей присоединённых чанков защиты нет.<newline><newline><#f4d87a>Блок привата<#e8dfd2> можно получить кнопкой в главном меню «Приваты». Сначала открой карточку нужного поселения. Затем поставь блок на свободной земле рядом, чтобы расширить территорию.<newline><newline><#c4a7e7>Выбранное поселение<#e8dfd2> — цель команд Lands. Открытие своей карточки выбирает это поселение; в списке оно отмечено галочкой ✔. Проверяй название перед изменениями.<newline><newline><#f3a2c9>Участникам<#e8dfd2> назначают роли с нужными правами. Выбери тему ниже, чтобы узнать порядок действий.'
  guide-create-label: '<#9bd48d>Создание ›'
  guide-create-tooltip: '<#e8dfd2>Как основать новое поселение.'
  guide-expand-label: '<#86dcf1>Расширение территории ›'
  guide-expand-tooltip: '<#e8dfd2>Как правильно присоединять новые чанки.'
  guide-members-label: '<#f3a2c9>Участники ›'
  guide-members-tooltip: '<#e8dfd2>Как добавлять и исключать игроков.'
  guide-commands-label: '<#c4a7e7>Команды Lands ›'
  guide-commands-tooltip: '<#e8dfd2>Короткая памятка по ручным командам.'
  guide-create-title: '<#86dcf1>Создание поселения'
  guide-create-body: '<#9bd48d>Создай поселение<newline><#e8dfd2>1. Выбери место для базы и встань в свободный <#86dcf1>чанк<#e8dfd2>.<newline>2. Нажми <#9bd48d>«Создать поселение»<#e8dfd2> и введи название.<newline>3. После создания проверь присоединённую территорию в карточке поселения.<newline><newline><#f4d87a>Проверь границы<newline><#e8dfd2>Защищаются только присоединённые чанки — каждый 16×16 блоков от бедрока до неба. Соседняя местность автоматически приватной не станет.<newline><newline><#c4a7e7>Следующий шаг<newline><#e8dfd2>Вернись в «Приваты» и получи <#f4d87a>блок привата<#e8dfd2> кнопкой ниже таблицы. Расширение описано в отдельной теме гайда.'
  guide-expand-title: '<#86dcf1>Расширение территории'
  guide-expand-body: '<#86dcf1>Расширь территорию<newline><#e8dfd2>1. Открой карточку нужного <#9bd48d>поселения<#e8dfd2>, чтобы выбрать его.<newline>2. Перейди в соседний свободный <#86dcf1>чанк<#e8dfd2>.<newline>3. Поставь <#f4d87a>блок привата<#e8dfd2> или нажми «Присоединить текущий чанк» в карточке.<newline>4. Проверь новый размер территории и её границы.<newline><newline><#f4d87a>Лимит и стоимость<newline><#e8dfd2>Доступный лимит чанков указан в карточке. Расширение учитывает бесплатные чанки, стоимость и остальные ограничения Lands.<newline><newline><#ff8b82>Освобождение чанка<newline><#e8dfd2>Снимает защиту с чанка, где ты стоишь, и требует подтверждения. Проверь выбранное поселение и постройки внутри.<newline><newline><#c4a7e7>Команда расширения: <white>/lands claim<#e8dfd2>. Блок привата получают в главном меню «Приваты».'
  guide-members-title: '<#86dcf1>Участники'
  guide-members-body: '<#f3a2c9>Пригласи игрока<newline><#e8dfd2>Открой карточку своего <#9bd48d>поселения<#e8dfd2> и нажми «Добавить игрока». Выбери игрока онлайн или введи точный ник.<newline>Команда: <white>/lands trust НИК<#e8dfd2>.<newline>Игроку придёт приглашение. Чтобы вступить, ему нужно выполнить <white>/lands accept НАЗВАНИЕ<#e8dfd2>.<newline><newline><#86dcf1>Управляй участниками<newline><#e8dfd2>В разделе <#f3a2c9>«Участники»<#e8dfd2> видны глава, роли и статус игроков. Карточка участника позволяет назначить доступную роль или исключить его с подтверждением.<newline>Команда исключения: <white>/lands untrust НИК<#e8dfd2>.<newline><newline><#f4d87a>Настрой доступ<newline><#e8dfd2>В <#c4a7e7>«Роли и права»<#e8dfd2> задаются разрешения выбранного региона. Раздел «Что здесь разрешено» показывает твои права: строительство, сундуки, двери и PvP.'
  guide-commands-title: '<#86dcf1>Команды Lands'
  guide-commands-body: '<#e8dfd2>Слова <#86dcf1>НАЗВАНИЕ<#e8dfd2> и <#f3a2c9>НИК<#e8dfd2> замени на название поселения и ник игрока.<newline><newline><white>/lands create НАЗВАНИЕ<newline><#e8dfd2>Создать поселение.<newline><white>/lands edit НАЗВАНИЕ<newline><#e8dfd2>Выбрать поселение для следующих команд.<newline><white>/lands claim<newline><#e8dfd2>Присоединить чанк, где ты стоишь.<newline><white>/lands trust НИК<newline><#e8dfd2>Пригласить игрока.<newline><white>/lands accept НАЗВАНИЕ<newline><#e8dfd2>Принять приглашение в поселение.<newline><white>/lands untrust НИК<newline><#e8dfd2>Исключить игрока.<newline><white>/lands menu<newline><#e8dfd2>Открыть полные настройки Lands.<newline><newline><#f4d87a>Перед изменениями<#e8dfd2> проверь выбранное поселение: команда /lands edit задаёт цель.'

