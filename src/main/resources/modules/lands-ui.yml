  mainblock-body: '<#e8dfd2>Чтобы перенести главный блок:<newline><#d7b486>1. <#e8dfd2>Откройте расширенные настройки.<newline><#d7b486>2. <#e8dfd2>Нажмите ЛКМ по колоколу и уберите блок.<newline><#d7b486>3. <#e8dfd2>В новом месте снова откройте меню и установите его.<newline><newline><#aaa49a>На сервере перенос бесплатный. ПКМ по колоколу переключает голограмму.'

  guide-title: '<#86dcf1>Как работают поселения'
  guide-body: '<#e8dfd2>Текущее поселение — это цель команд Lands.<newline><#aaa49a>В этом меню оно всегда отмечено галочкой ✔, а при открытии карточки выбирается явно. Поэтому действие не уйдёт в другое поселение.<newline><newline><#e8dfd2>Выберите тему — внутри есть пошаговое объяснение и нужные кнопки.'
  guide-create-label: '<#86dcf1>Создание ›'
  guide-create-tooltip: '<#e8dfd2>Как основать новое поселение.'
  guide-expand-label: '<#86dcf1>Расширение территории ›'
  guide-expand-tooltip: '<#e8dfd2>Как правильно присоединять новые чанки.'
  guide-members-label: '<#86dcf1>Участники ›'
  guide-members-tooltip: '<#e8dfd2>Как добавлять и исключать игроков.'
  guide-commands-label: '<#86dcf1>Команды Lands ›'
  guide-commands-tooltip: '<#e8dfd2>Короткая памятка по ручным командам.'
  guide-create-title: '<#86dcf1>Создание поселения'
  guide-create-body: '<#d7b486>1. <#e8dfd2>Встаньте в чанк будущей базы.<newline><#d7b486>2. <#e8dfd2>Нажмите «Создать поселение» и введите название.<newline><#d7b486>3. <#e8dfd2>Первый чанк присоединится бесплатно.<newline><#d7b486>4. <#e8dfd2>Новое поселение станет текущим и откроется отдельная карточка результата.<newline><newline><#aaa49a>Другие чанки не присоединяются автоматически.'
  guide-expand-title: '<#86dcf1>Расширение территории'
  guide-expand-body: '<#d7b486>1. <#e8dfd2>Откройте нужное поселение — оно станет текущим.<newline><#d7b486>2. <#e8dfd2>Встаньте в соседний свободный чанк.<newline><#d7b486>3. <#e8dfd2>Откройте «Территория и дом» и присоедините чанк.<newline><newline><#aaa49a>Первый чанк бесплатный. Следующие стоят монет, цена постепенно растёт. Лимит виден в карточке поселения.<newline><newline><#e8dfd2>Ручная команда: <#d7b486>/lands land claim<#e8dfd2>. Обычная /claim для расширения не подходит.'
  guide-members-title: '<#86dcf1>Участники'
  guide-members-body: '<#d7b486>Добавить:<#e8dfd2> откройте поселение → «Участники» → «Добавить игрока». Можно выбрать игрока онлайн или ввести точный ник.<newline><newline><#d7b486>Удалить:<#e8dfd2> нажмите участника в списке и подтвердите действие.<newline><newline><#aaa49a>Лимит участников показан рядом со списком.'
  guide-commands-title: '<#86dcf1>Команды Lands'
  guide-commands-body: '<#aaa49a>Выбрать поселение<newline><#e8dfd2>/lands edit НАЗВАНИЕ<newline><newline><#aaa49a>Присоединить текущий чанк<newline><#e8dfd2>/lands land claim<newline><newline><#aaa49a>Добавить игрока<newline><#e8dfd2>/lands land member add НИК<newline><newline><#aaa49a>Удалить выбранное поселение<newline><#e8dfd2>/lands land delete<newline><newline><#ff6b61>Перед удалением обязательно проверьте текущее поселение.'

  danger-title: '<#ff6b61>Удаление · <land>'
  danger-body: '<#ff6b61><bold>Это необратимое действие.<newline><#e8dfd2>Будет удалено именно поселение <#d7b486><land><#e8dfd2>. Территория перестанет быть защищённой.'
  delete-confirm-label: '<#ff6b61><bold>Удалить навсегда'

