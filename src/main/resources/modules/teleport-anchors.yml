# Путевые якоря в стиле Ender IO. Включаются на нужном сервере runtime-конфигом.
enabled: false
worlds: []

targeting:
  range: 1024.0
  maximum-targets: 24
  visible-angle-degrees: 70.0
  selection-angle-degrees: 10.0

visual:
  block-material: LODESTONE
  proxy-distance: 48.0
  minimum-scale: 1.04
  maximum-scale: 3.0
  label-minimum-scale: 1.8
  label-maximum-scale: 6.0
  update-ticks: 1

naming:
  default-name: 'Путевой якорь'
  dialog:
    title: '<#92bed8><bold>Настройка якоря'
    body: '<#e8dfd2>Название видно при наведении. Ниже можно открыть все свои якоря друзьям.'
    input: '<#e8dfd2>Название'
    access: '<#e8dfd2>Доступ игрокам <#8c8c8c>(ники через запятую)'
    invalid: '<#ff6b61>Введите название длиной от 1 до %limit% символов.'
    access-invalid: '<#ff6b61>Не найдены игроки: <#ffffff>%players%'
    save: '<#9bd48d>Сохранить изменения'
    close: '<#ffffff>Закрыть'

items:
  anchor:
    material: LODESTONE
    custom-model-data: 0
    name: '<#92bed8><bold>Путевой якорь'
    lore:
      - ''
      - '<#b8b8b8>Поставьте его, чтобы связать две точки.'
      - '<#b8b8b8>С соседнего якоря он виден сквозь стены.'
      - '<#b8b8b8>После установки нажмите ПКМ, чтобы дать имя.'
      - ''
      - '<#8c8c8c>[<#92bed8>▶<#8c8c8c>] <#92bed8>ПКМ<#b8b8b8> — установить'
  staff:
    material: BLAZE_ROD
    custom-model-data: 0
    name: '<#d7a8ff><bold>Жезл перехода'
    lore:
      - ''
      - '<#b8b8b8>Показывает путевые якоря из любой точки.'
      - ''
      - '<#8c8c8c>[<#d7a8ff>▶<#8c8c8c>] <#d7a8ff>ПКМ<#b8b8b8> — перейти'

messages:
  placed: '<#92bed8>Путевой якорь установлен.'
