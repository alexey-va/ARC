  shared-anchor-given: '<#92bed8>Выдано общих якорей: <#ffffff>%amount% <#8c8c8c>· <#92bed8>получатель <#ffffff>%player%<#92bed8>.'
  staff-given: '<#d7a8ff>Выдано жезлов: <#ffffff>%amount% <#8c8c8c>· <#d7a8ff>владелец <#ffffff>%player%<#d7a8ff>.'
