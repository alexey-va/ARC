# Путевые якоря в стиле Ender IO. Доступны на всех мирах, пока worlds не ограничен явно.
worlds: []

targeting:
  range: 1024.0
  maximum-targets: 24
  visible-angle-degrees: 70.0
  selection-angle-degrees: 10.0

visual:
  block-material: LODESTONE
  proxy-distance: 48.0
  minimum-scale: 1.04
  maximum-scale: 3.0
  # Вблизи увеличение почти не применяется; полная сила достигается вдали.
  distance-scaling-start: 8.0
  distance-scaling-end: 64.0
  label-minimum-scale: 1.8
  label-maximum-scale: 6.0
  update-ticks: 1

naming:
  default-name: 'Путевой якорь'
  dialog:
    title: '<#92bed8><bold>Настройка якоря'
    overview: '<#ffd166>%name%<newline><#e8dfd2>Владелец: <#ffffff>%owner%<newline><#e8dfd2>Точка: <#ffffff>%server% / %world% · %coords%<newline><#e8dfd2>Режим: %state%'
    name-button: '<#92bed8>Изменить название'
    access-button: '<#9bd48d>Доступ игроков'
    public-button: '<#ffd166>Общий якорь'
    network-button: '<#d7a8ff>Вся сеть'
    name-title: '<#92bed8><bold>Название якоря'
    name-body: '<#e8dfd2>Название видно над якорем и в списке сети.'
    access-title: '<#9bd48d><bold>Доступ к сети'
    access-body: '<#e8dfd2>Эти игроки смогут использовать все якоря владельца на всех серверах.'
    public-title: '<#ffd166><bold>Общий якорь'
    public-body-on: '<#e8dfd2>Любой игрок, вставший на этот якорь или нажавший на него, получит доступ ко всей сети владельца.'
    public-body-off: '<#e8dfd2>Сейчас этот якорь не выдаёт доступ другим игрокам.'
    public-state: '<#9bd48d>общий'
    shared-state: '<#ffd166>общий без владельца'
    private-state: '<#e8dfd2>личный'
    make-public: '<#9bd48d>Сделать общим'
    make-private: '<#ff9a8f>Сделать личным'
    network-title: '<#d7a8ff><bold>Сеть путевых якорей'
    network-body: '<#e8dfd2>Владелец: <#ffffff>%owner% · <#e8dfd2>точек: <#ffffff>%count% · <#e8dfd2>страница: <#ffffff>%page%/%pages%<newline><#e8dfd2>Нажмите на точку, чтобы перейти.'
    network-empty: '<#e8dfd2>В сети игрока %owner% пока нет доступных точек.'
    previous-page: '<#ffffff>Предыдущая страница'
    next-page: '<#ffffff>Следующая страница'
    input: '<#e8dfd2>Название'
    access: '<#e8dfd2>Доступ игрокам <#ffffff>(ники через запятую)'
    invalid: '<#ff6b61>Введите название длиной от 1 до %limit% символов.'
    access-invalid: '<#ff6b61>Не найдены игроки: <#ffffff>%players%'
    save: '<#9bd48d>Сохранить изменения'
    back: '<#ffffff>Назад'
    close: '<#ffffff>Закрыть'

items:
  anchor:
    material: LODESTONE
    custom-model-data: 0
    name: '<#92bed8><bold>Путевой якорь'
    shared-owner: 'Общий'
    lore:
      - ''
      - '<#b8b8b8>Поставьте его, чтобы связать две точки.'
      - '<#b8b8b8>С соседнего якоря он виден сквозь стены.'
      - '<#b8b8b8>После установки нажмите ПКМ, чтобы дать имя.'
      - ''
      - '<#b8b8b8>Владелец: <#92bed8>%owner%'
      - ''
      - '<#8c8c8c>[<#92bed8>▶<#8c8c8c>] <#92bed8>ПКМ<#b8b8b8> — установить'
  staff:
    material: BLAZE_ROD
    custom-model-data: 0
    name: '<#d7a8ff><bold>Жезл перехода'
    lore:
      - ''
      - '<#b8b8b8>Показывает путевые якоря из любой точки.'
      - ''
      - '<#8c8c8c>[<#d7a8ff>▶<#8c8c8c>] <#d7a8ff>ПКМ<#b8b8b8> — перейти'

