  public-access-local: '<#ffd166>Доступ к сети игрока <#ffffff>%owner%<#ffd166> получен только на этом сервере: Redis недоступен.'
  target-anchor: '<#ffd166>%name% <#8c8c8c>· <#ffd166>Shift<#b8b8b8> — перейти · <#ffffff>%distance% м'
  target-staff: '<#ffd166>%name% <#8c8c8c>· <#d7a8ff>ПКМ<#b8b8b8> — перейти · <#ffffff>%distance% м'
  no-target: '<#b8b8b8>Наведитесь на подсвеченный якорь.'
  wrong-world: '<#c42323>Путевые якоря недоступны в мире <#ffffff>%world%<#c42323>.'
