# =============================================================================
# auto-build.yml — автопостройка по книге (BuildingManager): лимиты, частицы, NPC, материалы.
# construction — скорость постройки, звуки, списки пропускаемых блоков, скины NPC.
# =============================================================================

# Тик интервала очистки «зависших» построек
cleanup-interval: 20
build-book:
  display-name: '<#92bed8><bold><name>'
  lore:
    - '<#969696>Книга строительства <#8c8c8c>• <#92bed8><state>'
    - ''
    - '<#8c8c8c>Автор: <#e6fff3><creator>'
    - '<#8c8c8c>Объём: <#e6fff3><blocks> блоков'
    - '<#8c8c8c>Выпуск: <#2bba43><price>'
    - '<#8c8c8c>ID экземпляра: <#969696><instance>'
    - ''
    - '<#8c8c8c>Поворот: <#e6fff3><rotation>° <#8c8c8c>• смещение: <#e6fff3><offset_x>, <offset_y>, <offset_z>'
    - ''
    - '<#8c8c8c>• <#92bed8>ПКМ по земле<#e6fff3> — показать превью'
    - '<#8c8c8c>• <#92bed8>ПКМ в воздух<#e6fff3> — настроить'
  received: '<#92bed8>◇ <#2bba43>Книга строительства создана: <#e6fff3><building>'
  player-copy:
    max-offset: 16
    max-per-player: 24
    custom-model-data: 0
    default-name: 'Моя постройка'
  editor:
    title: '<dark_gray>Настройка книги'
    invalid: '<#92bed8>◇ <#c42323>Книга повреждена или её чертёж недоступен.'
    no-permission: '<#92bed8>◇ <#c42323>У вас нет доступа к настройке этой книги.'
    preview-blocked: '<#92bed8>◇ <#ff9f0f>После этого изменения постройка выйдет за доступную область.'
    overview:
      name: '<#92bed8><bold><name>'
      lore:
        - '<#e6fff3>Настройте положение будущей постройки.'
        - ''
        - '<#8c8c8c>Поворот: <#92bed8><rotation>°'
        - '<#8c8c8c>Смещение: <#92bed8><offset_x>, <offset_y>, <offset_z>'
        - ''
        - '<#969696>Открытое превью обновляется сразу.'
    axis-x:
      name: '<#92bed8><bold>Смещение X'
      lore:
        - '<#8c8c8c>Текущее значение: <#92bed8><value>'
        - ''
        - '<#8c8c8c>• <#e6fff3>ЛКМ: −1 <#8c8c8c>• <#e6fff3>ПКМ: +1'
        - '<#969696>С Shift шаг равен 5 блокам.'
    axis-y:
      name: '<#92bed8><bold>Высота Y'
      lore:
        - '<#8c8c8c>Текущее значение: <#92bed8><value>'
        - ''
        - '<#8c8c8c>• <#e6fff3>ЛКМ: −1 <#8c8c8c>• <#e6fff3>ПКМ: +1'
        - '<#969696>С Shift шаг равен 5 блокам.'
    axis-z:
      name: '<#92bed8><bold>Смещение Z'
      lore:
        - '<#8c8c8c>Текущее значение: <#92bed8><value>'
        - ''
        - '<#8c8c8c>• <#e6fff3>ЛКМ: −1 <#8c8c8c>• <#e6fff3>ПКМ: +1'
        - '<#969696>С Shift шаг равен 5 блокам.'
    rotation:
      name: '<#92bed8><bold>Поворот'
      lore:
        - '<#8c8c8c>Текущее значение: <#92bed8><value>°'
        - ''
        - '<#8c8c8c>• <#e6fff3>ЛКМ: −90° <#8c8c8c>• <#e6fff3>ПКМ: +90°'
    reset:
      name: '<#ff9f0f><bold>Сбросить настройку'
      lore:
        - '<#e6fff3>Вернуть нулевое смещение и поворот.'
        - ''
        - '<#8c8c8c>• <#92bed8>Нажмите<#e6fff3>, чтобы сбросить <#8c8c8c>•'
    close:
      name: '<#2bba43><bold>Готово'
      lore:
        - '<#e6fff3>Сохранить настройку в книге.'
        - ''
        - '<#8c8c8c>• <#92bed8>ПКМ по земле<#e6fff3> — открыть превью <#8c8c8c>•'
# На classic (спавн/данжи): true. На survival: false.
disable-building: false
cant-build-message: |-
  <#92bed8>◇ <#c42323>Здесь нельзя разместить эту постройку.
  <#8c8c8c>  • <#e6fff3>Проверьте право строительства на всей площадке.
disabled-message: '<#92bed8>◇ <#ff9f0f>Автопостройка в этом мире отключена.'
display:
  border-particle-interval: 5
  border-particle: FLAME
  border-particle-count: 1
  border-particle-corner-count: 3
  border-particle-offset: 0.0
  border-particle-corner-offset: 0.07
  center-particle: NAUTILUS
  center-particle-count: 1
  max-blocks: 20000
  max-per-10-min: 10000000
start-message: |-
  <#92bed8>◇ <#e6fff3>Предпросмотр постройки включён.
  <#8c8c8c>  • <#92bed8>Контур обновляется постоянно <#8c8c8c>• <#e6fff3>ПКМ в воздух — настройка
  <#8c8c8c>  • <#e6fff3>Нажмите тот же блок ещё раз, когда всё готово.
confirm-time: 180
construction:
  # Default limit for books without arc:cooldown_seconds. Set a book to 0 for unlimited simple builds.
  default-cooldown-seconds: 3600
  npc-skins:
    '&6Агадиль': https://minesk.in/e8eae58c095949de87ff9c9b5b7c17f2
    '&6Николаич': https://minesk.in/6666ba384aa3486b88c21fa7541fb856
    '&6Иваныч': https://minesk.in/3ff30e8f08ae48c2abece46bbf0c09d6
    '&6Петрович': https://minesk.in/faca74c68a104b6987bc8c11ffebb092
  not-drop-materials:
    - GRASS_BLOCK
    - SHORT_GRASS
    - TALL_GRASS
    - DIRT
  skip-materials:
    - TRAPPED_CHEST
    - BARREL
    - PLAYER_HEAD
    - CHEST
    - PLAYER_WALL_HEAD
  cycle-duration-ticks: 10
  blocks-per-tick: 3
  play-sounds: true
  show-particles: false
confirm-message: '<#92bed8>◇ <#e6fff3>Проверьте площадку и нажмите <#92bed8>ПКМ по строителю<#e6fff3>.'
confirm-gui:
  title: '<dark_gray>Подтверждение постройки'
  confirm:
    material: PAPER
    display: '<#2bba43><bold>Начать строительство'
    lore:
      - '<#e6fff3>Применить показанный план.'
      - ''
      - '<#8c8c8c>• <#ff9f0f>Книга будет израсходована <#8c8c8c>•'
    customModelData: 0
  cancel:
    material: RED_STAINED_GLASS_PANE
    display: '<#c42323><bold>Вернуться к настройке'
    lore:
      - '<#e6fff3>Закрыть подтверждение без изменений.'
    customModelData: 0
start-build-message: '<#92bed8>◇ <#2bba43>Строительство началось.'
already-building-message: '<#92bed8>◇ <#ff9f0f>Сначала завершите текущую постройку.'
building-gui:
  progress:
    material: PAPER
    display: '<#92bed8><bold>Ход строительства'
  cancel:
    material: RED_STAINED_GLASS_PANE
    display: '<#c42323><bold>Отменить строительство'
    lore:
      - '<#e6fff3>Остановить текущую постройку.'
      - ''
      - '<#8c8c8c>• <#ff9f0f>Использованная книга не вернётся <#8c8c8c>•'
      - '<#969696>Нажмите ещё раз для подтверждения.'
    customModelData: 0
  cancel-confirm:
    display: '<#ff9f0f><bold>Подтвердить отмену'
  cancel-hint: '<#92bed8>◇ <#ff9f0f>Нажмите «Отменить» ещё раз, чтобы остановить строительство.'
  fast-finish:
    material: BLAZE_POWDER
    display: '<#2bba43><bold>Завершить мгновенно'
inactivity-cancel-message: '<#92bed8>◇ <#969696>Предпросмотр закрыт из-за неактивности.'
messages:
  display-limit: '<#92bed8>◇ <#ff9f0f>Показана часть чертежа: <#e6fff3><amount>/<max> блоков.'
  display-limit-2: '<#92bed8>◇ <#c42323>Этот чертёж слишком велик для безопасного предпросмотра.'
cancel-build-message: '<#92bed8>◇ <#969696>Постройка отменена.'
