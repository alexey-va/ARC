      <white>/данж выйти</white>
    unavailable: <red>Данжи сейчас недоступны.</red>
    player-only: <red>Эта команда доступна только игроку.</red>
    entry: '<gold>Данж</gold> <gray>·</gray> <click:run_command:''/данж''><green>[/данж — меню похода]</green></click> <gray>Старт, группа и выход. Быстрый запуск: <white>/начать</white>.'
    complete: <gold>Данж</gold> <gray>·</gray> <white>Заберите добычу.</white> <click:run_command:'/dungeon quit'><green>[Выйти из данжа]</green></click>
    saves-hint: <click:run_command:'/сохранения'><gold>[/сохранения]</gold></click> <gray>— ваши места и начало данжа. <white>/сохраниться [название]</white> — запомнить место. <white>/данж
