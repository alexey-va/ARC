# ARC owns the native Paper sidebar; activity providers may temporarily replace it.
enabled: true
enabled-servers: [spawn, survival, slimefun]
minimum-client-protocol: 774
title: '&#B22222&lRus&f&lCrafting'

# One layout. Personal section visibility is stored in LuckPerms metadata.
# '?' hides a row when its placeholders are empty; '@server ' scopes a row.
# Empty groups disappear, with one separator between remaining groups.
sections:
  rank:
    - '&6| &f%arcranks_rank_name% &e/rank'
  balance:
    - '&6| &f💰 &6%rediseco_bal_short_vault%  &f &d%rediseco_bal_short_tokens%'
  location:
    - '&6Место'
    - '&6| &f%arc_worldname%'
    - '@survival &6| &f%lands_land_name_plain_here%'
  quests:
    - '?%arcranks_quest_board_header%'
    - '?&6| %arcranks_quest_board_1%'
    - '?&6| %arcranks_quest_board_2%'
    - '?&6| %arcranks_quest_board_3%'
  rewards:
    - '?&6| %arcranks_quest_reward_summary%'
  footer:
    - '&7Онлайн: &a%online% &7• &fПинг: &e%player_ping% мс'

# Slimefun uses the same section preferences with its own currency and island data.
slimefun:
  sections:
    rank:
      - '&6| &f%player%'
    balance:
      - '&6| &fСлаймы: &a%rediseco_bal_formatted_shorthand_slimes%'
    location:
      - '&6Остров'
      - '&6| &f%superior_island_name%'
      - '&6| &fУровень: &e%superior_island_level_format%'
      - '&6| &f%slimefun_place%'
      - '&6| &fМеню: &e/skyblock'
    footer:
      - '&fВ режиме: &a%serveronline% &f• Пинг: &e%player_ping% мс'
