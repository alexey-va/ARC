# ARC owns new player graves. GravesX is optional legacy-data compatibility only.
storage:
  retention-seconds: 10800
  maximum-per-player: 18
  experience-fraction: 0.8
interaction:
  claim-distance: 6.0
teleport:
  default-fee: 100.0
  free-permission: arc.graves.teleport.free
glow:
  nearby-radius: 32
tracking:
  enabled-by-default: true
notifications:
  creation-message: false
hud:
  refresh-ticks: 2
# Random-selection weights only. Explicit player choices remain selectable; all zero weights fall back to slate.
appearance:
  # Fraction of graves using an engraved Yamipa monument; the rest use the original designs.
  engraved-chance: 0.5
  weights:
    slate: 35.0
    obelisk: 15.0
    cairn: 20.0
    timber: 20.0
    broken: 10.0
  # Legacy graves without a personal snapshot use this optional plain-text pool.
  # New graves use graves/epitaphs.yml by death cause or the player's /mm settings.
  # At most 128 legacy entries of 96 characters; empty hides their inscription.
  epitaphs: []
  # Opt-in examples requested by the owner:
  # epitaphs:
  #   - 'Похуй...'
  #   - 'Собаке собачья смерть'
  #   - 'Да не ссы, ничего не будет'
