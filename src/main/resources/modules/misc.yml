# =============================================================================
# modules/misc.yml — глобальные настройки ARC (порталы, синк, join/quit GUI, миры).
# Redis: modules/redis.yml (arc-core-redis).
# Стиль YAML: элементы списков (-) вложены в ключ (на 2 пробела правее, чем ключ).
#
# Фичевые YAML (announce, board, mobspawn, …) лежат в каталоге modules/ — см. paths ниже и ConfigManager.ofModule.
#
# Секции: join, portal, bees, xaction, sync, join-message-gui, leave-message-gui,
#         date-format, timezone, worlds, world-names, respawn-intercept-worlds.
#
# join-message-gui / leave-message-gui: только оформление меню.
#   Каталог фраз и иконок задаётся в ProxyARC/modules/join-messages.yml и приходит через Redis.
# world-names: ключ = имя мира Bukkit; значение = подпись (MiniMessage / & коды).
# =============================================================================

# --- Пути данных (документация; загрузчик в коде: ConfigManager.MODULE_YAML_DIR) ---
paths:
  # Каталог с per-module *.yml относительно папки плагина
  feature-config-directory: modules

# --- Совместимость старых интеграций с RedisEconomy ---
economy:
  legacy-money-alias:
    # /money give|take|set <игрок> [валюта] <сумма> -> нативная команда RedisEconomy.
    # Отключено по умолчанию; включайте только пока есть старые Quest/GUI/скрипты.
    enabled: false

# --- Вход игрока: краткая неуязвимость и полное здоровье ---
join:
  # Временная неуязвимость при входе
  invulnerable-enabled: true
  full-heal: true
  # Длительность неуязвимости (тики Bukkit)
  invulnerable-ticks: 140
  # Задержка перед полным хилом (тики)
  full-heal-delay-ticks: 30

# --- Порталы из команд (PlayerWarps / CMI): частицы, радиусы, сообщения ---
# Раньше дублировалось в portal.yml — теперь только эта секция (CommandListener, CMIListener, Portal).
portal:
  # Включить обработку «портальных» команд
  command-portals: true
  # Подкоманды, которые не открывают портал
  excluded-sub-commands:
  - about
  - addwarps
  - amount
  - ban
  - category
  - desc
  - favourite
  - icon
  - list
  - open
  - rate
  - reload
  - set
  - setowner
  - remove
  - removeall
  - rename
  - reset
  # Алиасы команд, считающихся «варпами»
  aliases:
  - pw
  - warp
  # Проверять ли варпы PlayerWarps / CMI перед порталом
  check-player-warps: true
  check-cmi-warps: false
  # Типы CMI-телепортов, при которых показывается портальный эффект (CMIListener)
  cmi-tp-types:
  - home
  - warmup
  - spawn
  # Выполнять commands-only CMI portal, если игрок подключился уже внутри cuboid
  cmi-command-only-on-join: false
  # Сообщение при появлении портала (MiniMessage)
  message: <dark_green>Недалеко появляется портал...
  # Дистанция отображения частиц
  particle-distance: 50.0
  # ItemDisplay-портал с выбором вида через LuckPerms meta arc-portal-style.
  # В переносимом default отключён; серверный override задаёт ItemsAdder ID.
  # Все параметры ниже применяются после /arc reload, без рестарта Paper.
  origin-gate:
    enabled: false
    default-style: origin
    items:
      origin: ""
      astral: ""
      chaos: ""
      solar: ""
      void: ""
    opening-start-tick: 0
    opening-duration-ticks: 66
    # smooth — равномерно; dramatic — заряд и резкое раскрытие.
    opening-curve: dramatic
    closing-duration-ticks: 12
    width: 6.0
    height: 8.4
    vertical-offset: 2.75
    yaw-offset-degrees: 180.0
    view-range: 1.0
    sound:
      enabled: true
      # 20 тиков = 1 секунда; отсчитывается от начала анимации.
      delay-ticks: 40
      id: minecraft:block.end_portal.spawn
      volume: 1.35
      pitch: 0.9
    suction:
      enabled: true
      streams: 10
      reduced-streams: 4
      points-per-stream: 3
      reduced-points-per-stream: 1
      radius: 6.0
      height: 7.0
      turns: 2.25
      particle-size: 0.8
      core-count: 12
  # DUST_COLOR_TRANSITION: цвета и размер рамки
  border:
    color:
      red-start: 121
      green-start: 56
      blue-start: 163
      red-end: 0
      green-end: 0
      blue-end: 0
      size: 0.5
    offset: 0.015
    count: 2
    particle: DUST_COLOR_TRANSITION
  portal-particle:
    count: 5
    particle: PORTAL
    extra: 0.2
    offset: 0.3
  blindness: true
  blindness-radius: 2.0
  blindness-duration: 40
  radius-initial: 3
  radius-secondary: 6
  tp-other-disabled:
    message: <red>Этот игрок не разрешил другим игрокам телепортироваться через его порталы!
  tp-by-other-disabled:
    message: <red>Вы не можете телепортироваться через порталы других игроков!
# --- Пасека (если используется связанная фича) ---
bees:
  enabled: false

# --- Имя сервера для XAction / кросс-сервера (см. также redis.server-name) ---
xaction:
  server-name: test-server

# --- Синхронизация данных с другими плагинами (модули SyncModule) ---
sync:
  em: true
  cmi: false
  aura-skills: true
  duels: true
  slimefun: true

# --- Оформление GUI; фразы, ранги и иконки приходят из ProxyARC через Redis ---
join-message-gui:
  rows: 6
  title: '&8Сообщения при входе'
  back-button:
    material: BLUE_STAINED_GLASS_PANE
    display: <italic:false><gold>Назад
    lore:
    - <italic:false><gray>Вернуться в главное меню
    customModelData: 11013
  switch-button:
    material: LIME_STAINED_GLASS_PANE
    display: <italic:false><gold>Выбрать сообщения при <red>выходе
    lore: []
    customModelData: 0
  common-rank: <italic:false><green>Для всех
  show-all: true
  back-command: menu
  prefix: '<dark_green>❖ '
  max-len: 80
  spaces-padding: 3
  next-button:
    material: BLUE_STAINED_GLASS_PANE
    display: <italic:false><gold>Далее
    lore:
    - <italic:false><gray>Перейти к следующей странице
    customModelData: 11008
  prev-button:
    material: BLUE_STAINED_GLASS_PANE
    display: <italic:false><gold>Назад
    lore:
    - <italic:false><gray>Перейти к предыдущей странице
    customModelData: 11009
  default-lore:
    - <italic:false><white>%prefix%%message%
  forbidden-lore:
    - <italic:false><red>Эта фраза пока недоступна
  current-lore:
    - <italic:false><green>Выбрано
  forbidden-temp-display: <red>Эта фраза пока недоступна.
  error: <red>Меню фраз сейчас недоступно. Попробуйте ещё раз.
leave-message-gui:
  title: '&8Сообщения при выходе'
  switch-button:
    material: RED_STAINED_GLASS_PANE
    display: <italic:false><gold>Выбрать сообщения при <green>входе
    lore: []
    customModelData: 0
  common-rank: <italic:false><green>Для всех
  show-all: true
  prefix: '<dark_red>❖ '
  max-len: 80
  spaces-padding: 3
  default-lore:
    - <italic:false><white>%prefix%%message%
  forbidden-lore:
    - <italic:false><red>Эта фраза пока недоступна
  current-lore:
    - <italic:false><green>Выбрано
  forbidden-temp-display: <red>Эта фраза пока недоступна.
date-format: MM-dd HH:mm:ss
timezone: '+3'

# --- Набор имён миров для фильтров (YAML set; пусто = без ограничений по этому полю) ---
