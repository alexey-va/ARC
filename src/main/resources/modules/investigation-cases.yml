      a: { correct: true, title: "Просроченную доверенность переоформили внешне", explanation: ["Смерть прекратила её силу.", "Новую ленту добавили без нотариуса."] }
      b: { title: "Домна знала о смерти и подделала лист", explanation: ["Она получила готовый лист и не видела уведомления."] }
      c: { title: "Елисей законно продлил доверенность", explanation: ["Он отказался и не делал новой записи."] }
      d: { title: "Страховая ошиблась датой смерти", explanation: ["Уведомление старше поддельной ленты."] }
      e: { title: "Доверенность действует после смерти", explanation: ["Право было личным и прекратилось по уведомлению."] }

