# Authored Bureau of Investigations catalog.
#
# Add a witness under `witnesses`, give the same key a point in
# modules/investigations.yml, then reference exactly five witnesses from a case
# timeline. A five-edge cross-check cycle guarantees that any three collected
# testimonies reveal at least one useful comparison. `correct: true` must appear
# exactly once among the five conclusions. `/arc reload` applies valid edits;
# malformed cases are skipped with a log message while the remaining catalog
# stays playable. Active paid cases keep their embedded snapshot.
schema-version: 1

variables:
  seller: ["купец Авдей", "артель Ладоги", "лавка Кручины", "мастер Путята", "обоз Милована", "гость Нежата", "двор Вышаты", "дом Яромира"]
  goods: ["тюки шёлка", "мешки зерна", "ящики красителя", "связки инструментов", "кипы бумаги", "брусья тиса", "короба пряностей", "листы меди"]
  suspect: ["писарь Добрын", "приёмщик Карп", "оценщик Ладо", "подрядчик Силан", "старший возчик Микула"]
  runner: ["посыльный Левко", "возчик Твердило", "младший писарь Онфим", "носильщик Ждан", "приказчик Борята"]
  lot: ["17", "24", "31", "46", "58", "63", "77", "91"]
  color: ["синего", "алого", "зелёного", "янтарного", "чёрного"]
  gate: ["северных ворот", "боковой арки", "речного проезда", "старой заставы"]

witnesses:
  stavr: { name: "Глашатай Ставр", location: "восточный стол первого этажа", material: BELL }
  prokhor: { name: "Архивариус Прохор", location: "восточный стол первого этажа", material: BOOK }
  gordey: { name: "Пристав Гордей", location: "патруль первого этажа", material: SHIELD }
  agata: { name: "Почерковед Агата", location: "южный стол второго этажа", material: FEATHER }
  tikhon: { name: "Счётовод Тихон", location: "южный стол второго этажа", material: BARREL }
  mikula: { name: "Купец Микула", location: "северная галерея первого этажа", material: EMERALD }
  vlada: { name: "Страховщица Влада", location: "северная галерея первого этажа", material: PAPER }
  ratsha: { name: "Оценщик Ратша", location: "южная галерея первого этажа", material: SPYGLASS }
  zhdan: { name: "Носильщик Ждан", location: "южная галерея первого этажа", material: LEAD }
  elisey: { name: "Нотариус Елисей", location: "северный балкон второго этажа", material: WRITABLE_BOOK }
  marfa: { name: "Печатница Марфа", location: "северный балкон второго этажа", material: HONEYCOMB }
  varvara: { name: "Посыльная Варвара", location: "южный балкон у лестницы", material: RABBIT_FOOT }
  domna: { name: "Перекупщица Домна", location: "северный балкон у перил", material: NAME_TAG }

cases:
  side_gate_switch:
    title: "Телега у {gate}"
    briefing: ["После торгов лот {lot} отправили на склад.", "Утром вместо {goods} внутри нашли камни.", "Пломба и запись дела {case} выглядят целыми."]
    question: "Где и когда подменили груз?"
    suspicious-lead: "На дворе осталась свежая синяя бечева."
    timeline:
      1: { time: "До колокола", witness: stavr, event: "{seller} показал закрытый лот {lot}" }
      2: { time: "После торгов", witness: prokhor, event: "В реестр внесли одну опломбированную телегу" }
      3: { time: "У ворот", witness: gordey, event: "{runner} вернул телегу за якобы забытой биркой" }
      4: { time: "Перед полуночью", witness: agata, event: "Возвратную записку дописали поверх старого текста" }
      5: { time: "На рассвете", witness: tikhon, event: "Вес совпал только из-за камней и новой тары" }
    testimonies:
      stavr: ["Лот был закрыт до объявления и содержал настоящий товар.", "После удара колокола я его не открывал."]
      prokhor: ["В книге есть один выезд и один приход.", "Промежуточного возврата никто не регистрировал."]
      gordey: ["{runner} вернул телегу к {gate}.", "Он назвал забытую бирку причиной второго въезда."]
      agata: ["Слово «бирка» вписано позже остальной записки.", "Дополнение сделано пером, которым пользуется {suspect}."]
      tikhon: ["Утренний вес верен только вместе с новой тарой.", "Камни повторяют вес исчезнувших {goods}."]
    cross-checks:
      a: { witnesses: [stavr, prokhor], insight: "До торгов лот был настоящим, а реестр признаёт лишь одну телегу." }
      b: { witnesses: [prokhor, gordey], insight: "Гордей видел возврат, которого нет в книге Прохора." }
      c: { witnesses: [gordey, agata], insight: "Предлог для второго въезда дописали уже после торгов." }
      d: { witnesses: [agata, tikhon], insight: "Подложная записка и равный вес прикрывают одну подмену." }
      e: { witnesses: [tikhon, stavr], insight: "Настоящий груз был до звонка, а камни появились после возврата." }
    conclusions:
      a: { correct: true, title: "Подмена при ложном возврате", explanation: ["Телегу вернули после торгов.", "У ворот товар сменили на равный по весу груз."] }
      b: { title: "Подмена до объявления", explanation: ["Ставр видел настоящий товар в закрытом лоте."] }
      c: { title: "Кража на складе", explanation: ["Она не объясняет незаписанный второй въезд."] }
      d: { title: "Ошибка весов", explanation: ["Камни и новая тара намеренно сохранили общий вес."] }
      e: { title: "Сделка чиста", explanation: ["Возвратная записка противоречит караулу и реестру."] }

  borrowed_bell:
    title: "Колокол на четверть часа раньше"
    briefing: ["Лот {lot} исчез между объявлением и выдачей.", "Караул покинул главные ворота по знакомому звону.", "Архив дела {case} ставит закрытие на четверть часа позже."]
    question: "Кто создал окно для вывоза и как?"
    suspicious-lead: "Один свидетель слышал два одинаковых удара."
    timeline:
      1: { time: "Перед закрытием", witness: mikula, event: "В переулок внесли завёрнутый ручной колокол" }
      2: { time: "Первый звон", witness: stavr, event: "Из переулка повторили ритм закрытия" }
      3: { time: "Смена караула", witness: gordey, event: "Стражники ушли запирать боковой двор" }
      4: { time: "Через четверть часа", witness: varvara, event: "{runner} вывез лот через открытые ворота" }
      5: { time: "Настоящий звон", witness: prokhor, event: "Архив отметил официальное закрытие" }
    testimonies:
      mikula: ["Я видел у {suspect} малый колокол под войлоком.", "Он унёс его в переулок перед закрытием."]
      stavr: ["Первый удар повторял мой ритм, но звучал из переулка.", "Настоящий колокол я поднял позже."]
      gordey: ["По первому звону я отвёл людей к боковому двору.", "Главные ворота ещё не получили приказ закрыться."]
      varvara: ["Между звонками я разминулась с телегой {runner}.", "На ней лежал лот {lot}."]
      prokhor: ["Архивные часы отмечают закрытие позже.", "Запись дела {case} сделана после настоящего звона."]
    cross-checks:
      a: { witnesses: [mikula, stavr], insight: "Малый колокол объясняет ложный звук из переулка." }
      b: { witnesses: [stavr, gordey], insight: "Караул ушёл по сигналу, который Ставр не подавал." }
      c: { witnesses: [gordey, varvara], insight: "Телега прошла именно пока главные ворота остались без стражи." }
      d: { witnesses: [varvara, prokhor], insight: "Вывоз случился до официального архивного закрытия." }
      e: { witnesses: [prokhor, mikula], insight: "Колокол появился до временного окна и исчез после него." }
    conclusions:
      a: { correct: true, title: "Ложный звон отвёл караул", explanation: ["{suspect} скопировал сигнал закрытия.", "{runner} вывез лот до настоящего звона."] }
      b: { title: "Стража открыла ворота ночью", explanation: ["Телега ушла до официального закрытия."] }
      c: { title: "Ставр перепутал время", explanation: ["Он различил направление двух ударов."] }
      d: { title: "Архив отстал на четверть часа", explanation: ["Время Прохора подтверждает независимая посыльная."] }
      e: { title: "Лот остался во дворе", explanation: ["Варвара видела его на уходящей телеге."] }

  twin_registry:
    title: "Два покупателя одного лота"
    briefing: ["Лот {lot} продали утром и повторно вечером.", "Обе выдачи ссылаются на дело {case}.", "Второй покупатель получил лишь обещание склада."]
    question: "Как одна партия получила две законные продажи?"
    suspicious-lead: "У двух корешков разные поля, но одна клякса."
    timeline:
      1: { time: "Утренние торги", witness: stavr, event: "Первый покупатель оплатил весь лот" }
      2: { time: "После оплаты", witness: tikhon, event: "Склад выдал всю партию по белому корешку" }
      3: { time: "Днём", witness: agata, event: "С корешка сняли точную копию вместе с кляксой" }
      4: { time: "Вечерние торги", witness: domna, event: "Домне продали копию как новое право на груз" }
      5: { time: "После закрытия", witness: prokhor, event: "Оба корешка подшили под номером {case}" }
    testimonies:
      stavr: ["Название лота прозвучало дважды.", "Во второй раз продавцом выступил {suspect}."]
      tikhon: ["Вся партия ушла утром.", "К вечеру складской остаток был равен нулю."]
      agata: ["Второй корешок отпечатан с первого.", "Даже случайная клякса повторена точка в точку."]
      domna: ["Мне показали корешок и потребовали оплату сразу.", "{runner} обещал выдать груз утром без новой сверки."]
      prokhor: ["Под номером {case} лежат два листа.", "Их края разные, но регистрационная клякса одна."]
    cross-checks:
      a: { witnesses: [stavr, tikhon], insight: "После первой продажи склад уже отдал весь лот." }
      b: { witnesses: [tikhon, agata], insight: "Копию изготовили после обнуления складского остатка." }
      c: { witnesses: [agata, domna], insight: "Домне продали механическую копию утреннего права." }
      d: { witnesses: [domna, prokhor], insight: "Второй корешок попал в архив только после второй оплаты." }
      e: { witnesses: [prokhor, stavr], insight: "Два объявления опирались на одну исходную запись." }
    conclusions:
      a: { correct: true, title: "Продали дубликат корешка", explanation: ["{suspect} скопировал утреннюю запись.", "Вечером продали право на уже выданный груз."] }
      b: { title: "Склад выдал груз дважды", explanation: ["К вечеру партия отсутствовала целиком."] }
      c: { title: "Первый покупатель вернул товар", explanation: ["Возврата и нового остатка в книге нет."] }
      d: { title: "Совпали два номера", explanation: ["Одинаковая клякса доказывает копирование."] }
      e: { title: "Ошибка глашатая", explanation: ["Поддельный корешок существовал до второго объявления."] }

  wet_wax:
    title: "Печать на ещё пустом листе"
    briefing: ["Разрешение дела {case} открыло склад ночью.", "Подпись и печать настоящие.", "Порядок появления следов на бумаге невозможен."]
    question: "Как из настоящей печати сделали ложное разрешение?"
    suspicious-lead: "Чернила заходят на сургуч, но нигде не лежат под ним."
    timeline:
      1: { time: "За день до торгов", witness: marfa, event: "Из канцелярии вынесли лист с настоящей печатью" }
      2: { time: "После торгов", witness: prokhor, event: "Архив создал подлинную запись дела {case}" }
      3: { time: "Поздним вечером", witness: agata, event: "Текст дописали вокруг старого сургуча" }
      4: { time: "Ночью", witness: gordey, event: "{runner} предъявил лист у склада" }
      5: { time: "На рассвете", witness: tikhon, event: "Со склада исчез лот {lot}" }
    testimonies:
      marfa: ["Я ставила оттиск на пустом листе для пробы формы.", "{suspect} обещал сразу перечеркнуть бумагу."]
      prokhor: ["Подлинник дела {case} всё время лежал в архиве.", "Разрешения на ночную выдачу в нём нет."]
      agata: ["Сургуч лёг на чистую бумагу.", "Текст позже обвёл уже застывшую печать."]
      gordey: ["{runner} показал лист с настоящим оттиском.", "Я проверил знак, но не возраст чернил."]
      tikhon: ["Лот {lot} выдан ночью целиком.", "Основанием записан лист, которого нет в архиве."]
    cross-checks:
      a: { witnesses: [marfa, prokhor], insight: "Пробный лист существовал раньше настоящего дела." }
      b: { witnesses: [prokhor, agata], insight: "Архив не знает разрешения, а текст моложе сургуча." }
      c: { witnesses: [agata, gordey], insight: "Гордею предъявили настоящий оттиск с поздним текстом." }
      d: { witnesses: [gordey, tikhon], insight: "Именно спорный лист открыл ночную выдачу." }
      e: { witnesses: [tikhon, marfa], insight: "Пробную печать превратили в основание для пропажи лота." }
    conclusions:
      a: { correct: true, title: "Текст дописали к пробной печати", explanation: ["{suspect} сохранил пустой лист.", "Позже вокруг оттиска создали разрешение."] }
      b: { title: "Подделали сам оттиск", explanation: ["Марфа подтверждает подлинность печати."] }
      c: { title: "Архив потерял разрешение", explanation: ["Чернила появились после сургуча, а не одновременно."] }
      d: { title: "Гордей открыл склад без бумаги", explanation: ["Он видел лист и проверял знак."] }
      e: { title: "Выдача была законной", explanation: ["Документа нет в деле, и его слои нарушают порядок."] }

  locked_archive:
    title: "Запись из запертого архива"
    briefing: ["Ночная справка точно цитирует закрытую книгу.", "Ключ оставался у Прохора.", "Дело {case} не выносили из комнаты."]
    question: "Как узнали текст закрытой записи?"
    suspicious-lead: "На полях книги есть след от тонкой угольной пыли."
    timeline:
      1: { time: "Перед закрытием", witness: elisey, event: "Нотариус оставил книгу раскрытой у окна" }
      2: { time: "После закрытия", witness: prokhor, event: "Архив заперли единственным ключом" }
      3: { time: "Снаружи", witness: varvara, event: "{runner} прижал бумагу к оконному стеклу" }
      4: { time: "У ворот", witness: gordey, event: "Справка дословно повторила скрытую строку" }
      5: { time: "На торгах", witness: domna, event: "По справке сняли запрет с лота {lot}" }
    testimonies:
      elisey: ["Книга осталась раскрыта на нужной странице.", "Окно было закрыто, но шторы не опустили."]
      prokhor: ["Дверь и ключ ночью не трогали.", "Утром на полях появилась угольная пыль."]
      varvara: ["Я видела у окна {runner} с тонкой бумагой.", "Он водил по ней тёмным бруском."]
      gordey: ["Справка повторяла даже перенос строки.", "Такого текста не знали у ворот."]
      domna: ["После справки запрет сняли немедленно.", "Лот купил человек, связанный с {suspect}."]
    cross-checks:
      a: { witnesses: [elisey, prokhor], insight: "Книгу не открывали заново: она уже лежала у окна." }
      b: { witnesses: [prokhor, varvara], insight: "Угольная пыль осталась после снятия копии через стекло." }
      c: { witnesses: [varvara, gordey], insight: "Снятая копия объясняет дословный перенос в справке." }
      d: { witnesses: [gordey, domna], insight: "Подложная справка сразу изменила судьбу лота." }
      e: { witnesses: [domna, elisey], insight: "Покупатель использовал строку со страницы, оставленной у окна." }
    conclusions:
      a: { correct: true, title: "Строку сняли через окно", explanation: ["Бумагу прижали к стеклу.", "Угольный протир скопировал открытую страницу."] }
      b: { title: "Прохор передал ключ", explanation: ["Замок не открывали, а ключ оставался при нём."] }
      c: { title: "Елисей продиктовал строку", explanation: ["Справка повторяет даже случайный перенос."] }
      d: { title: "Справку написали наугад", explanation: ["Точное совпадение и угольный след исключают догадку."] }
      e: { title: "Запрет сняли законно", explanation: ["Основанием была копия закрытой записи."] }

  false_return:
    title: "Возврат без вернувшегося товара"
    briefing: ["{seller} получил выплату за возврат {goods}.", "Страховая отметила целую тару.", "Склад не может показать сам товар."]
    question: "Что именно вернули вместо партии?"
    suspicious-lead: "На расписке указан вес пустых ящиков с мокрой тканью."
    timeline:
      1: { time: "После жалобы", witness: mikula, event: "Продавец потребовал оформить полный возврат" }
      2: { time: "На осмотре", witness: vlada, event: "Страховке показали закрытые мокрые ящики" }
      3: { time: "У разгрузки", witness: zhdan, event: "Носильщики сняли только пустую тару" }
      4: { time: "При оценке", witness: ratsha, event: "Вес тары выдали за вес повреждённого товара" }
      5: { time: "В остатках", witness: tikhon, event: "Склад записал возврат без новой партии" }
    testimonies:
      mikula: ["{suspect} торопил меня и не разрешил открыть ящики.", "Он говорил, что товар испорчен водой."]
      vlada: ["Мне показали пломбы и мокрую ткань.", "Содержимое я не видела из-за требования сохранить следы."]
      zhdan: ["Ящики были пусты, но очень тяжелы от воды.", "Ни одного места с {goods} мы не переносили."]
      ratsha: ["В акт внесли общий вес тары.", "Нормальный товар весил бы иначе и шевелился внутри."]
      tikhon: ["В книге вырос остаток, а в ячейке ничего не появилось.", "Пустые ящики поставили отдельно."]
    cross-checks:
      a: { witnesses: [mikula, vlada], insight: "Запрет на вскрытие заставил страховку поверить внешним следам." }
      b: { witnesses: [vlada, zhdan], insight: "Пломбы были целы, но носильщики разгружали пустую тару." }
      c: { witnesses: [zhdan, ratsha], insight: "Вода дала пустым ящикам нужный общий вес." }
      d: { witnesses: [ratsha, tikhon], insight: "Бумажный вес попал в остаток без физического товара." }
      e: { witnesses: [tikhon, mikula], insight: "Выплата появилась, а возвращённая партия — нет." }
    conclusions:
      a: { correct: true, title: "Вернули утяжелённую пустую тару", explanation: ["Ящики намочили до нужного веса.", "Страховка увидела пломбы, но не содержимое."] }
