# Authored Bureau of Investigations catalog. Every case uses five witnesses,
# a five-link comparison cycle and five possible explanations. Active paid
# cases keep their embedded snapshot when this file is reloaded.
schema-version: 1

variables:
  seller: ["горожанин", "постоялец", "ремесленник", "путник"]
  goods: ["личные вещи", "домашняя утварь", "подарок", "дорожная поклажа"]

witnesses:
  stavr: { name: "Глашатай Ставр", location: "восточный стол первого этажа", material: BELL }
  prokhor: { name: "Архивариус Прохор", location: "восточный стол первого этажа", material: BOOK }
  gordey: { name: "Пристав Гордей", location: "патруль первого этажа", material: SHIELD }
  agata: { name: "Почерковед Агата", location: "южный стол второго этажа", material: FEATHER }
  tikhon: { name: "Счётовод Тихон", location: "южный стол второго этажа", material: BARREL }
  mikula: { name: "Купец Микула", location: "северная галерея первого этажа", material: EMERALD }
  vlada: { name: "Страховщица Влада", location: "северная галерея первого этажа", material: PAPER }
  ratsha: { name: "Оценщик Ратша", location: "южная галерея первого этажа", material: SPYGLASS }
  zhdan: { name: "Носильщик Ждан", location: "южная галерея первого этажа", material: LEAD }
  elisey: { name: "Нотариус Елисей", location: "северный балкон второго этажа", material: WRITABLE_BOOK }
  marfa: { name: "Печатница Марфа", location: "северный балкон второго этажа", material: HONEYCOMB }
  varvara: { name: "Посыльная Варвара", location: "южный балкон у лестницы", material: RABBIT_FOOT }
  domna: { name: "Перекупщица Домна", location: "северный балкон у перил", material: NAME_TAG }

cases:
  missing_pie:
    title: "Куда исчез праздничный пирог"
    briefing: ["Утром на общем столе оставили вишнёвый пирог.", "К полудню блюдо опустело, а каждый уверяет, что не брал ни крошки.", "На подоконнике лежит чистая салфетка с красным пятном."]
    requester: "Микула просит разобраться до вечернего праздника, пока взрослые не обвинили детей в краже."
    stakes: ["Пирог готовили всем двором для первого общего ужина после долгой зимы.", "Если назвать виновного наугад, праздник начнётся со ссоры и ребёнка накажут за чужой поступок."]
    question: "Кто унёс пирог и зачем спрятал пустое блюдо?"
    suspicious-lead: "На полу есть сахарная дорожка, но она обрывается у окна."
    timeline:
      1: { time: "Раннее утро", witness: mikula, event: "Микула поставил пирог на стол и накрыл синей салфеткой" }
      2: { time: "После звонка", witness: stavr, event: "Ставр видел, как блюдо унесли к лестнице" }
      3: { time: "Через минуту", witness: vlada, event: "Влада услышала детский смех за ширмой" }
      4: { time: "Перед полуднем", witness: gordey, event: "Гордей нашёл пустое блюдо под лавкой" }
      5: { time: "Позже", witness: prokhor, event: "Прохор обнаружил записку с благодарностью в книге сказок" }
    testimonies:
      mikula: ["Пирог был цел, а синяя салфетка лежала сверху.", "Я разрешил детям взять его после урока, но они могли не расслышать.", "Когда вернулся, салфетки тоже не было — значит, блюдо унесли накрытым."]
      stavr: ["Блюдо нёс невысокий человек под синей тканью.", "Сахар на полу появился уже после того, как он прошёл.", "Он шёл не к выходу, а к ширме у детского стола и всё время оглядывался."]
      vlada: ["За ширмой дети делили пирог и спорили о последней вишне.", "Они боялись, что взяли его слишком рано.", "Один из них повторял, что Микула разрешил, но только после урока."]
      gordey: ["Блюдо спрятали небрежно, но отмыли до блеска.", "Сахар у окна рассыпала кухарка, когда ставила чай.", "На ободке остался запах вишни, а под лавкой лежал мокрый угол синей салфетки."]
      prokhor: ["В записке дети благодарят Микулу и обещают вернуть блюдо.", "Лист спрятали в книге, которую читали на уроке.", "Почерк неровный и общий: каждую строку, похоже, дописывал другой ребёнок."]
    cross-checks:
      a: { witnesses: [mikula, stavr], insight: "Синяя ткань была салфеткой с блюда, а не одеждой похитителя." }
      b: { witnesses: [stavr, vlada], insight: "Блюдо отнесли именно за ширму, где собрались дети." }
      c: { witnesses: [vlada, gordey], insight: "Дети съели пирог и спрятали уже вымытое блюдо." }
      d: { witnesses: [gordey, prokhor], insight: "Записка объясняет, почему блюдо спрятали, а не украли." }
      e: { witnesses: [prokhor, mikula], insight: "Разрешение было настоящим, но дети начали раньше условленного времени." }
    conclusions:
      a: { correct: true, title: "Дети поторопились с угощением", explanation: ["Они приняли разрешение за немедленное и после еды спрятали чистое блюдо."] }
      b: { title: "Пирог украла кухарка", explanation: ["Сахар у окна появился позже и не связан с блюдом."] }
      c: { title: "Микула разыграл пропажу", explanation: ["Ставр видел, как пирог унесли после его ухода."] }
      d: { title: "Пирог выбросили", explanation: ["За ширмой его ели, а блюдо затем вымыли."] }
      e: { title: "Гордей спрятал блюдо", explanation: ["Он только нашёл его после детского чаепития."] }

  library_key:
    title: "Ключ внутри запертой библиотеки"
    briefing: ["Вечером библиотеку заперли снаружи.", "Утром ключ оказался на столе внутри комнаты.", "Замок цел, окно закрыто, запасного ключа нет."]
    requester: "Прохор боится, что кто-то научился обходить замок библиотеки и доберётся до редких рукописей."
    stakes: ["До выяснения причины читальный зал закрыт, а городские ученики остались без занятий.", "Ложное обвинение в тайном проникновении лишит ключника должности и опозорит его семью."]
    question: "Как ключ попал внутрь уже запертой комнаты?"
    suspicious-lead: "Под дверью заметна тонкая дуга в пыли."
    timeline:
      1: { time: "Перед закрытием", witness: prokhor, event: "Прохор положил ключ в карман и проверил пустой стол" }
      2: { time: "У двери", witness: elisey, event: "Елисей видел, как дверь заперли обычным ключом" }
      3: { time: "После закрытия", witness: varvara, event: "Варвара передала Прохору длинную записку на плотной бумаге" }
      4: { time: "На лестнице", witness: agata, event: "Агата заметила надрыв на нижнем крае записки" }
      5: { time: "Ночью", witness: gordey, event: "Гордей слышал короткий металлический стук за дверью" }
    testimonies:
      prokhor: ["Я запер дверь и достал из кармана только записку.", "Ключа уже не было, но я решил, что оставил его дома.", "Свёрток зацепился за порог, однако я не стал разворачивать его в тёмном коридоре."]
      elisey: ["Ключ повернулся в замке снаружи, дверь точно закрылась.", "После этого к ручке никто не подходил.", "Прохор ушёл со свёртком в руке, а карман его пальто выглядел пустым."]
      varvara: ["Записка была свёрнута трубкой и перевязана бечевой.", "Прохор прижал её к ключу в той же руке.", "Бумага была очень плотной, поэтому ключ мог скрыться между её слоями."]
      agata: ["На бумаге есть свежая прорезь ровно по ширине ключа.", "Тяжёлый предмет выскользнул из свёртка.", "Края разрыва направлены наружу: предмет прошёл из трубки, а не вошёл в неё."]
      gordey: ["Стук раздался сразу после шороха под дверью.", "Он был лёгким, как ключ на деревянном полу.", "Утром ключ лежал на продолжении той самой дуги, что осталась в пыли."]
    cross-checks:
      a: { witnesses: [prokhor, elisey], insight: "Дверь заперли настоящим ключом, а пропал он сразу после поворота." }
      b: { witnesses: [elisey, varvara], insight: "После запирания у Прохора в руке осталась свёрнутая записка." }
      c: { witnesses: [varvara, agata], insight: "Ключ случайно завернулся в бумагу и прорвал её край." }
      d: { witnesses: [agata, gordey], insight: "Через прорезь ключ выскользнул под дверью и упал внутри." }
      e: { witnesses: [gordey, prokhor], insight: "Ночной стук объясняет, почему утром ключ лежал на внутреннем полу." }
    conclusions:
      a: { correct: true, title: "Ключ проскользнул в свёртке", explanation: ["Он зацепился за записку, а под дверью выпал внутрь."] }
      b: { title: "Был тайный запасной ключ", explanation: ["Дверь после закрытия не открывали."] }
      c: { title: "Прохор бросил ключ в окно", explanation: ["Окно закрыто, а стук слышали у двери."] }
      d: { title: "Замок открывается без ключа", explanation: ["Елисей видел обычное запирание."] }
      e: { title: "Гордей вошёл ночью", explanation: ["Пыль и целый замок не показывают входа."] }

  wet_footprints:
    title: "Мокрые следы из сухого подвала"
    briefing: ["После дождя в зале появилась цепочка мокрых следов.", "Она начинается у запертого сухого подвала и заканчивается у пропавшего плаща.", "На ступенях нет ни одной капли."]
    requester: "Хозяин плаща требует найти вора, а смотритель подвала настаивает, что дверь никто не открывал."
    stakes: ["Слух о тайном ходе уже пугает работников и мешает им спускаться к запасам.", "Нужно отделить настоящую пропажу от детской выходки, прежде чем караул начнёт обыски домов."]
    question: "Откуда взялись следы и кто забрал плащ?"
    suspicious-lead: "Левый след заметно темнее правого."
    timeline:
      1: { time: "После дождя", witness: zhdan, event: "Ждан оставил мокрые сапоги у служебной двери" }
      2: { time: "Через минуту", witness: domna, event: "Домна переставила один сапог, чтобы освободить проход" }
      3: { time: "У подвала", witness: ratsha, event: "Ратша увидел мальчика с одним мокрым сапогом в руке" }
      4: { time: "В коридоре", witness: marfa, event: "Марфа заметила, как мальчик ставит сапог на пол" }
      5: { time: "У выхода", witness: gordey, event: "Гордей принял у мальчика найденный плащ" }
    testimonies:
      zhdan: ["Оба сапога были мокрыми, но я никуда в них не ходил.", "Когда вернулся, один стоял носком в другую сторону.", "На правом сапоге грязь осталась по краям, а середина подошвы была словно отпечатана о гладкий пол."]
      domna: ["Я переставила только правый сапог и сразу ушла.", "Рядом крутился мальчик, который искал хозяина плаща.", "Он спросил, можно ли по следам понять, куда человек ушёл, и долго смотрел на подошву."]
      ratsha: ["Мальчик держал сапог за голенище и рассматривал подошву.", "Из подвала он не выходил, дверь была заперта.", "Его собственные башмаки были сухими, поэтому обычных парных следов рядом не было."]
      marfa: ["Он прижимал мокрую подошву к полу через равные шаги.", "Сам он шёл в сухих башмаках.", "Каждый тёмный отпечаток одинаково повёрнут влево — так человек ногами не ходит."]
      gordey: ["Мальчик нёс плащ к караулу как найденную вещь.", "Позже хозяин забрал его у меня.", "Он сразу признался в игре с сапогом, когда я спросил про одинокие следы."]
    cross-checks:
      a: { witnesses: [zhdan, domna], insight: "Переставленный сапог оказался ближе всего к мальчику." }
      b: { witnesses: [domna, ratsha], insight: "Мальчик взял мокрый сапог, но не открывал подвал." }
      c: { witnesses: [ratsha, marfa], insight: "Следы отпечатывали вручную одной и той же подошвой." }
      d: { witnesses: [marfa, gordey], insight: "Дорожка вела за мальчиком, который нёс найденный плащ к страже." }
      e: { witnesses: [gordey, zhdan], insight: "Ни плащ, ни сапог не были украдены и оба вернулись владельцам." }
    conclusions:
      a: { correct: true, title: "Следы напечатал ребёнок", explanation: ["Он играл мокрым сапогом, а плащ нёс как найденную вещь."] }
      b: { title: "В подвале есть тайный выход", explanation: ["Дверь не открывали, а следы сделаны одной подошвой."] }
      c: { title: "Домна украла плащ", explanation: ["Плащ был у мальчика и затем у караула."] }
      d: { title: "Ждан ходил в подвал", explanation: ["Он снял сапоги до появления дорожки."] }
      e: { title: "Марфа нарисовала следы", explanation: ["Она только видела игру мальчика."] }

  broken_window:
    title: "Окно разбилось изнутри"
    briefing: ["В пустой комнате разбилось высокое окно.", "Камень лежит снаружи, а большая часть стекла внутри.", "Никто не признаётся, что входил в комнату."]
    requester: "Смотритель дома просит установить причину до приезда мастера и не выставлять счёт невиновному."
    stakes: ["За окном хранили детские учебные доски, и следующий порыв ветра испортит их дождём.", "Камень у стены выглядит как улика против соседского мальчика, которого уже хотят наказать."]
    question: "Что разбило окно и почему камень оказался снаружи?"
    suspicious-lead: "На раме осталась тонкая белая нитка."
    timeline:
      1: { time: "Утром", witness: tikhon, event: "Тихон оставил окно приоткрытым для проветривания" }
      2: { time: "Перед обедом", witness: mikula, event: "Микула натянул во дворе верёвку с бельём" }
      3: { time: "Порыв ветра", witness: varvara, event: "Варвара увидела, как простыня влетела в створку" }
      4: { time: "Сразу после", witness: agata, event: "Агата услышала два удара с короткой паузой" }
      5: { time: "После звона", witness: gordey, event: "Гордей нашёл оборванную верёвку и камень-противовес" }
    testimonies:
      tikhon: ["Створка держалась на одном крючке и могла распахнуться внутрь.", "Камней в комнате не было.", "Я оставил щель всего в ладонь, но крючок уже был погнут и дрожал от сильного ветра."]
      mikula: ["К концу верёвки я привязал камень, чтобы бельё не улетало.", "Верёвка проходила рядом с окном.", "После звона камень лежал на прежнем месте, но узел вытянулся и конец верёвки лопнул."]
      varvara: ["Ветер втянул простыню внутрь и резко дёрнул верёвку.", "После рывка створка ударилась о стену.", "Простыня на миг закрыла окно, поэтому самого удара снаружи никто не увидел."]
      agata: ["Сначала был глухой удар створки, потом звон стекла.", "Звук шёл из комнаты.", "Между звуками была короткая пауза: рама ударилась первой, стекло осыпалось следом."]
      gordey: ["Камень остался снаружи на оборванном конце.", "Белые волокна на раме совпадают с верёвкой.", "На камне нет стеклянной пыли, так что через окно он точно не пролетал."]
    cross-checks:
      a: { witnesses: [tikhon, mikula], insight: "Приоткрытое окно стояло прямо у натянутой верёвки." }
      b: { witnesses: [mikula, varvara], insight: "Простыня передала порыв ветра на створку через верёвку." }
      c: { witnesses: [varvara, agata], insight: "Первым был удар створки изнутри, затем разбилось стекло." }
      d: { witnesses: [agata, gordey], insight: "Камень не бил окно, он остался на верёвке снаружи." }
      e: { witnesses: [gordey, tikhon], insight: "Нитка на раме и слабый крючок объясняют случай без входа в комнату." }
    conclusions:
      a: { correct: true, title: "Ветер дёрнул створку бельевой верёвкой", explanation: ["Простыня потянула верёвку, створка ударила стену, а камень остался снаружи."] }
      b: { title: "Камень бросили со двора", explanation: ["Он остался привязанным, а первый удар пришёл из комнаты."] }
      c: { title: "Тихон разбил стекло", explanation: ["После проветривания он не возвращался."] }
      d: { title: "Птица врезалась в окно", explanation: ["Перья отсутствуют, зато есть волокна верёвки."] }
      e: { title: "Стекло лопнуло от холода", explanation: ["Два удара и оборванная верёвка указывают на механику."] }

  swapped_parcels:
    title: "Две посылки не тем людям"
    briefing: ["Две одинаковые коробки доставили соседям.", "В одной оказался чай, в другой игрушечная лодка.", "Обе бирки подписаны правильно, но получатели перепутаны."]
    requester: "Варвара просит восстановить путь коробок, чтобы вернуть подарки адресатам и не потерять работу."
    stakes: ["Лодку ждали к именинам ребёнка, а редкий чай предназначался больной хозяйке.", "Если ошибка произошла при упаковке, отвечают отправители; если в пути — вся вина ляжет на посыльную."]
    question: "На каком этапе поменялись коробки?"
    suspicious-lead: "Бечева на одной коробке завязана дважды."
    timeline:
      1: { time: "Утром", witness: mikula, event: "Микула упаковал чай в тяжёлую коробку" }
      2: { time: "Следом", witness: domna, event: "Домна положила лодку в лёгкую коробку" }
      3: { time: "При выдаче", witness: prokhor, event: "Прохор прикрепил бирки к лежащим рядом крышкам" }
      4: { time: "На лестнице", witness: zhdan, event: "Ждан поднял обе коробки после падения" }
      5: { time: "Перед доставкой", witness: varvara, event: "Варвара получила коробки уже перевязанными" }
    testimonies:
      mikula: ["Моя коробка была тяжелее и имела царапину сбоку.", "Крышку я не прибивал, только обвязал.", "Бирка с именем больной хозяйки лежала на моей крышке, а не на самом ящике."]
      domna: ["Лодка почти ничего не весит, а её коробка была без царапин.", "Наши крышки одинаковые.", "Я запомнила только красную бечеву; после падения обе коробки перевязали такой же."]
