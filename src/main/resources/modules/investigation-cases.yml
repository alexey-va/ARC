      b: { witnesses: [mikula, elisey], insight: "После отказа нотариуса документ обновили без его участия." }
      c: { witnesses: [elisey, domna], insight: "Домна получила старую доверенность с чужой новой лентой." }
      d: { witnesses: [domna, agata], insight: "Внешне целая лента моложе документа и не продлевает его силу." }
      e: { witnesses: [agata, vlada], insight: "Новая дата появилась уже после уведомления о смерти." }
