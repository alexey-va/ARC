      mikula: ["{suspect} знал об известии и всё равно торопил покупку.", "Он говорил, что наследники ещё ничего не знают."]
      elisey: ["Я отказался продлевать документ.", "Кто-то заменил ленту без новой нотариальной записи."]
      domna: ["Мне дали лист с целой лентой и старой подписью.", "О смерти я узнала только после победы."]
      agata: ["Лента и дата установлены недавно.", "Основной текст и подпись значительно старше."]
