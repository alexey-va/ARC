# =============================================================================
# ops-http.yml — локальный HTTP API для ops / MCP (только с секретным токеном).
#
# Слушает bind-host:bind-port (по умолчанию 127.0.0.1 — только с Gercena через SSH/curl).
# Заголовок: Authorization: Bearer <token>  или  X-ARC-Ops-Token: <token>
# =============================================================================

enabled: true

# Сгенерируй свой секрет и не коммить в git на проде.
token: "CHANGE_ME_generate_a_long_random_secret"

bind-host: "127.0.0.1"
bind-port: 25823

# POST /ops/console — произвольные команды консоли (осторожно)
console-enabled: false

# POST /ops/message — broadcast / player / ops на ЭТОМ инстансе (MiniMessage)
messages-enabled: true

# POST /ops/broadcast — кросс-сервер через XAction/Redis (как board announce)
# Один POST на spawn → все серверы в сети. servers: all | spawn | survival | spawn,survival

# POST /ops/effect — title / actionbar / sound онлайн-игроку
effects-enabled: true

# POST /ops/reload — только arc или denizen (не minecraft reload!)
reload-enabled: true

# POST /ops/run-as — выполнить команду от имени онлайн-игрока (осторожно)
run-as-enabled: false

# GET /ops/economy/audit — persisted sources/sinks, top balances and anomalies.
economy-audit-read-enabled: true

# GET /ops/player/{name}/inventory — инвентарь онлайн-игрока (слоты 0-40)
# GET /ops/player/{name}/item?slot= | ?hand=true — один слот / предмет в руке
items-read-enabled: true

# POST /ops/player/{name}/give — выдать предмет по JSON ItemSpec
# POST /ops/item/preview — собрать ItemSpec без выдачи
items-give-enabled: false
items-give-max-stack: 64

# GET/preview read the live ARC item-presets catalog.
item-presets-read-enabled: true
# PUT/DELETE atomically persist modules/item-presets.yml.
# Production mutation: enable only for an explicitly authorized operation.
item-presets-write-enabled: false

# GET/preview используют CMI Java API и обычные ItemSpec JSON.
# PUT /ops/cmi/kits/{name} меняет runtime CMI kit и вызывает KitsManager.safeSave().
# По умолчанию запрещено: включать только для явно авторизованной content-операции.
cmi-kits-write-enabled: false

# Native CMI hologram API. Read/preview never modify Saves/Holograms.yml.
cmi-holograms-read-enabled: true
# PUT/DELETE update CMI runtime state and persistence. Enable only for an
# explicitly authorized production content operation.
cmi-holograms-write-enabled: false

# GET/preview для modules/scheduled-commands.yml.
scheduled-commands-read-enabled: true
# PUT/DELETE сохраняют расписание через ScheduledCommandsManager.
# Production mutation: включать только для явно авторизованной операции.
scheduled-commands-write-enabled: false

# GET/preview expose normalized weighted coordinates, not internal persistence JSON.
location-pools-read-enabled: true
# PUT/DELETE persist through LocationPoolManager using atomic file replacement.
location-pools-write-enabled: false

# Native ARC treasure/reward pools. Preview never grants rewards or runs commands.
treasure-pools-read-enabled: true
# Production mutation: enable only for an explicitly authorized content operation.
treasure-pools-write-enabled: false

# Native Citizens API. Preview/list are read-only; create/move/delete stay gated.
npcs-read-enabled: true
npcs-write-enabled: false

# Native LuckPerms API. Reads are safe on every Paper instance.
luckperms-groups-read-enabled: true
luckperms-users-read-enabled: true
# Shared-storage writes are enabled only in the private spawn runtime config.
luckperms-groups-write-enabled: false
luckperms-users-write-enabled: false
luckperms-migrations-enabled: false

# Сколько WARN/ERROR держать в памяти для GET /ops/errors
error-buffer-size: 200
