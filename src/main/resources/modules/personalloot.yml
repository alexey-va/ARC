# =============================================================================
# personalloot.yml — персональные сундуки структур с пулами ARC.
# GUI: guis/personal-loot.yml (заголовок, слоты). Здесь — лимиты и сообщения.
# =============================================================================

# Максимум игроков, которые могут «зарегистрироваться» на одном сундуке
max-players: 5
# Типы инвентарей Bukkit, где обрабатывается открытие (CHEST, BARREL, …)
inventories:
  - CHEST
# Лут создаётся один раз для каждого нового игрока; старые записи сохраняются.
use-bs-loot: false
loot:
  # Пулы редактируются в treasures/ или через /arc treasure-pool.
  common-pool: structures_common
  min-rolls: 3
  max-rolls: 5
  # Один независимый бонус на сундук, а не на каждый обычный бросок.
  bonus-pool: structures_special
  bonus-chance: 0.10
# Сколько раз нужно сломать блок, чтобы уничтожить сундук и очистить данные
max-breaks: 3
gui:
  # Размер и доступные слоты управляются layouts personal-loot-1..6 в guis/menus.yml.
  title: '<dark_gray>Лут данжа'
messages:
  inventory-full: '<red>В инвентаре нет места. Заберите предмет на курсор обычным кликом.'
  # При ломании; плейсхолдер <amount> — сколько ударов осталось до разрушения
  break: <red>Этот сундук нужно сломать еще <amount> раз
  # Когда у сундука уже max-players и игрок не в списке; %amount% — текущее число
  max-players: <red>Слишком много игроков уже открыли этот сундук!
  # Лут уже забран (пустой CustomLootData)
  already-opened: <red>Вы уже открывали этот сундук
  load-error: '<red>Не удалось загрузить содержимое сундука. Попробуйте ещё раз.'
