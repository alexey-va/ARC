# Ротация объявлений только на main-server (spawn), раз в 30 минут.
# Три строки, по одной пустой строке сверху и снизу. Внешний отступ 0 px.
# U+E532: arc:announce_bell_large, height 27 / ascent 26, advance 25.
# Пиксельные пробелы U+F0F01..05: колонка значка 28 px, текста 31 px; глифа по центру (1 + 25 + 5 px).
# Глифа находится на третьей строке и занимает всю высоту блока.
# Клик по двум строкам текста открывает соответствующее меню/справку.
# Нижняя строка показывает прямую команду темы; все три строки открывают её.
# Глифа и отступы некликабельны.
# Все темы имеют одинаковый вес 1; parkour исключён из получателей.
config:
  delay-seconds: 1800
messages:
  '1':
    message: '<newline>󰼅󰼄󰼃󰼂󰼁<click:run_command:"/mm"><hover:show_text:"Нажмите, чтобы открыть главное меню сервера."><#F28E85>Исследуйте данжи</#F28E85></hover></click><newline>󰼅󰼄󰼃󰼂󰼁<click:run_command:"/mm"><hover:show_text:"Нажмите, чтобы открыть главное меню сервера."><#E8DFD2>Откройте «Данжи» в главном меню.</#E8DFD2></hover></click><newline>󰼁<white></white>󰼃󰼁<click:run_command:"/mm"><hover:show_text:"Нажмите, чтобы открыть главное меню сервера."><#E8DFD2>Меню сервера — </#E8DFD2><#FFB2A8>/mm</#FFB2A8></hover></click><newline>'
    servers: [spawn, survival]
    player-specific: false
    cache: true
    conditions:
      - type: permission
        permission: arc.chat.notify
    type: chat
    serialization-type: mini_message
    weight: 1
    personal: false
