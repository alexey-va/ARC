# Охота за сокровищами: spawn смешивает три вида; остальные пресеты выбирают один вид.
# /arc hunt start preset=spawn chests=6
# /arc hunt start locations=<pool> chests=6 chest=halloween rewards=spawn_hunt
# aliases — доступные ItemsAdder-модели для chest=; vanilla встроен.
# Пул локаций, награды и внешний вид задаются независимо. Подсветка через стены выключена.
highlight:
  enabled: false
  color: '#ffc242'
grapple:
  enabled: true
  cooldown-ticks: 12
  max-distance: 34.0
  projectile-blocks-per-tick: 4.0
  pull-speed: 1.0
  stop-distance: 1.6
  max-pull-ticks: 45
  cable-segments: 8
  item-name: <gold>Крюк-кошка
  item-lore:
  - ''
  - <gray>Нажмите <white>ПКМ<gray>, чтобы выстрелить и подтянуться.
  - <gray>Повторный <white>ПКМ<gray> меняет цель даже в полёте.
  - ''
  - <dark_gray>Действует во время охоты на спавне.
  messages:
    item-received: <gold>Крюк-кошка добавлен на панель быстрого доступа.
    inventory-full: <gray>Освободите слот на панели быстрого доступа — крюк появится автоматически.
    missed: <gray>Крюк не зацепился за поверхность.
    pulling: <aqua>Есть зацеп! Вас подтягивает.
aliases:
  halloween: elitecreatures:halloween_decoration_v1_pumpkin_1
  easter: elitecreatures:easterbunny_animated_weapon_set_chest
treasure-hunt-types:
  spawn:
    location-pool-id: spawn
    boss-bar-message: <gold>Охота за сокровищами <white>· Осталось <gold>%left%
    boss-bar-visible: true
    seconds-ttl: 1800
    announce-stop: true
    stop-message: <gold>Охота за сокровищами <gray>· <white>Поиск завершён.
    announce-start: true
    start-message: "\n  <gold>Охота за сокровищами\n  <white>Ищите тайники на спавне: у вас <gold>30 минут<white>.\n"
    announce-start-globally: true
    launch-fireworks: false
    boss-bar-color: YELLOW
    boss-bar-overlay: PROGRESS
    chest-types:
      vanilla:
        type: VANILLA
        treasure-pool-id: spawn_hunt
        particle-path: default
        weight: 1
      halloween:
        type: IA
        ia-namespace-id: halloween
        treasure-pool-id: spawn_hunt
        particle-path: halloween
        weight: 1
      easter:
        type: IA
        ia-namespace-id: easter
        treasure-pool-id: spawn_hunt
        particle-path: easter
        weight: 1
