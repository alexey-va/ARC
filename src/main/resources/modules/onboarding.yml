    offer: '<#e8dfd2>Найдите место в мире выживания, защитите свой участок и постройте первый дом. Квест подскажет следующий шаг.'
    complete: '<#9bd48d>Первый дом готов.<newline><#e8dfd2>Точка возвращения сохранена, а участок защищён.'
    unavailable: '<#e8dfd2>Квест сейчас не запущен для вас.'
    pending: '<#e8dfd2>Обновляю квест…'
    goal-travel: '<#c4abff>Найдите место для дома<newline><#e8dfd2>Откройте телепортацию и выберите мир выживания.'
    goal-home: '<#c4abff>Сохраните точку дома<newline><#e8dfd2>Выберите место для базы и создайте здесь точку возвращения в меню домов.'
    goal-match: '<#c4abff>Совместите дом и участок<newline><#e8dfd2>Создайте точку дома внутри защищённого чанка. Дом и приват должны быть в одном месте.'
    goal-claim: '<#c4abff>Защитите участок<newline><#e8dfd2>Поставьте блок привата в чанке с точкой дома. Он есть в стартовом наборе.'
    goal-build-book: '<#c4abff>Откройте книгу «Первый дом»<newline><#e8dfd2>Возьмите её из стартового набора и откройте внутри своего защищённого участка.'
    goal-build-start: '<#c4abff>Постройте первый дом<newline><#e8dfd2>Выберите место для постройки в книге «Первый дом» и запустите строительство на своём участке.'
    goal-building: '<#c4abff>Дом строится<newline><#e8dfd2>Дождитесь завершения постройки. Квест отметит результат автоматически.'
    row-travel: '<#e8dfd2>Мир выживания'
    row-home: '<#e8dfd2>Точка дома'
    row-claim: '<#e8dfd2>Защита участка'
    row-build: '<#e8dfd2>Первый дом'
    status-ahead: '<#e8dfd2>Впереди'
    status-current: '<#c4abff>Текущая цель'
    status-done: '<#9bd48d>✔ Готово'
    status-mismatch: '<#ffb277>Вне участка'
    status-building: '<#c4abff>Строится'
    accept: '<#9bd48d>Начать квест'
    accept-tip: '<#e8dfd2>Начать путь к своему первому дому. Прогресс сохраняется между серверами.'
    teleport: '<#92bed8>Телепортация ›'
    teleport-tip: '<#e8dfd2>Выбрать мир или открыть другие направления телепортации.'
    action-home: '<#9bd48d>Мои дома ›'
    action-home-tip: '<#e8dfd2>Создать точку возвращения в выбранном месте.'
    action-claim: '<#9bd48d>Мой участок ›'
    action-claim-tip: '<#e8dfd2>Открыть управление приватом и подсказку по защите земли.'
    action-build: '<#9bd48d>Получить стартовый набор'
    action-build-tip: '<#e8dfd2>Получить обычный стартовый набор с книгой «Первый дом». Доступность набора проверяется как обычно.'
    restart: '<#c4a7e7>Начать заново'
    restart-tip: '<#e8dfd2>Начать новую проверку квеста для себя. Сбрасываются только этапы квеста.'
    stop: '<#ff6b61>Выключить тест'
    stop-tip: '<#e8dfd2>Остановить свой тест квеста и убрать персональный знак над телепортатором.'
    close: '<white>Закрыть'

# Личная подсветка при удержании блока Lands. Не меняет правила привата.
claim-guide:
  enabled: true
  # CURRENT_CHUNK — только чанк под игроком; NEARBY_GRID — прежняя сетка соседних чанков.
  # Радиус предмета и стены существующих приватов от этого режима не меняются.
  grid-mode: CURRENT_CHUNK
  # Полупрозрачные вертикальные стенки над красными/зелёными границами приватов.
  land-walls-enabled: true
  text:
    title: '<#92bed8>Поставь блок на землю'
    subtitle: '<white>Снять защиту здесь: <#ff9f0f>/unclaim'
    aim: '<white>Посмотри на землю рядом — покажу участок'
    free: '<#b3d3df>Ничейная земля<newline><white>Поставь блок — создай приват'
    expand: '<#92bed8>Расширить «{land}»<newline><white>Поставь блок на ничейной земле'
    action-expand: '<white>Расширить «{land}» — поставь блок на ничейной земле'
    own: '<#80e89b>Этот чанк уже защищен<newline><white>Для расширения поставь блок за границей'
    occupied: '<#ff8178>Здесь уже занято<newline><white>Выбери другое место'
    world-unavailable: '<#ff8178>В этом мире приват недоступен'
    success-title: '<#80e89b>Участок защищён'
    success-subtitle: '<white>Здесь твои постройки под защитой'
    success: '<#92bed8>Готово! Этот участок защищён'
    action-free: '<white>Поставь блок — защити эту землю'
    action-own: '<white>Расширить — поставь блок за голубой границей'
    action-occupied: '<#ff8178>Место занято • <white>Найди свободный участок'
    boundary-enter: "<#92bed8>Участок «{land}» <gray>• <white>Земля под защитой"
    boundary-leave: "<#ff9f0f>Ты вышел из «{land}» <gray>• <white>Здесь нет привата"
    grid-legend: '<gray>Тонкие линии — чанки 16×16 <dark_gray>• <#92bed8>Толстые — приваты'
    remove: '<white>Встань внутри своего участка → <#ff9f0f>/unclaim <white>— снять защиту здесь'
    menu: '<gray>Shift + F - меню'
