# Личная подсветка при удержании блока Lands. Не меняет правила привата.
claim-guide:
  enabled: true
  # CURRENT_CHUNK — только чанк под игроком; NEARBY_GRID — прежняя сетка соседних чанков.
  # Радиус предмета и стены существующих приватов от этого режима не меняются.
  grid-mode: CURRENT_CHUNK
  # Полупрозрачные вертикальные стенки над красными/зелёными границами приватов.
  land-walls-enabled: true
  text:
    title: '<#92bed8>Поставь блок на землю'
    subtitle: '<white>Снять защиту здесь: <#ff9f0f>/unclaim'
    aim: '<white>Посмотри на землю рядом — покажу участок'
    free: '<#b3d3df>Ничейная земля<newline><white>Поставь блок — создай приват'
    expand: '<#92bed8>Расширить «{land}»<newline><white>Поставь блок на ничейной земле'
    action-expand: '<white>Расширить «{land}» — поставь блок на ничейной земле'
    own: '<#80e89b>Этот чанк уже защищен<newline><white>Для расширения поставь блок за границей'
    occupied: '<#ff8178>Здесь уже занято<newline><white>Выбери другое место'
    world-unavailable: '<#ff8178>В этом мире приват недоступен'
    success-title: '<#80e89b>Участок защищён'
    success-subtitle: '<white>Здесь твои постройки под защитой'
    success: '<#92bed8>Готово! Этот участок защищён'
    action-free: '<white>Поставь блок — защити эту землю'
    action-own: '<white>Расширить — поставь блок за голубой границей'
    action-occupied: '<#ff8178>Место занято • <white>Найди свободный участок'
    boundary-enter: "<#92bed8>Участок «{land}» <gray>• <white>Земля под защитой"
    boundary-leave: "<#ff9f0f>Ты вышел из «{land}» <gray>• <white>Здесь нет привата"
    grid-legend: '<gray>Тонкие линии — чанки 16×16 <dark_gray>• <#92bed8>Толстые — приваты'
    remove: '<white>Встань внутри своего участка → <#ff9f0f>/unclaim <white>— снять защиту здесь'
    menu: '<gray>Shift + F - меню'
    cost: '<#e8dfd2>Стоимость: <#f4d87a>{cost} <white>💰</white>'
