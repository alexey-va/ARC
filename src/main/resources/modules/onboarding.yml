    offer: '<#e8dfd2>Найдите место и постройте свой первый дом.'
    complete: '<#9bd48d>Дом готов, участок защищён.'
    unavailable: '<#e8dfd2>Квест не запущен.'
    pending: '<#e8dfd2>Загрузка…'
    goal-travel: '<#c4abff>1 / 4 · Найдите место<newline><#e8dfd2>Выберите мир выживания.'
    goal-home: '<#c4abff>2 / 4 · Точка дома<newline><#e8dfd2>Встаньте на месте базы и сохраните дом.'
