# Начальный квест «Первый дом». Автоматического вступления нет.
# До публичного запуска тест включается администратором только для себя:
# /arc onboarding test; журнал /arc onboarding; заново /arc onboarding restart.
worlds:
  - survival
  - mining
  - vanilla

quest:
  public-enabled: false
  # Существующий Проводник на спавне. Его обычный выбор мира сохраняется.
  npc-id: 447
  text:
