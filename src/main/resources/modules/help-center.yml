  settings-scoreboard-skills-label: "Навыки"
  settings-scoreboard-skills-tooltip: "<#e8dfd2>До двух выбранных навыков: уровень и прогресс.<newline>Без выбора — два наиболее развитых навыка."
  settings-scoreboard-activity-label: "Текущее занятие"
