  legacy-settings-portal-tooltip: '<#e8dfd2>Разрешить телепортацию через порталы игроков.'
  legacy-settings-notifications: "<#d7b486>Уведомления: <state>"
  legacy-settings-notifications-tooltip: '<#e6fff3>Системные объявления RusCrafting в чате.<newline><#e8dfd2>Отключите их, если хотите меньше<newline>информационных сообщений от сервера.<newline>Это отдельная настройка от режима чата.<newline><newline><#d7b486>Нажмите, чтобы включить или выключить.'
  legacy-settings-flight: "<#d7b486>Полёт и подзарядка ›"
  legacy-settings-flight-tooltip: '<#e6fff3>Полёт с расходуемым запасом заряда.<newline><#e8dfd2>Заряд тратится при перемещении и зависании.<newline>Его можно пополнять за опыт или игровые деньги.<newline><newline><#d7b486>Нажмите, чтобы узнать правила расхода,<newline>выбрать автопополнение и управлять полётом.'
  legacy-settings-shift-edit: "<#d7b486>Правка табличек: <state>"
  legacy-settings-shift-tooltip: '<#e6fff3>Редактирование текста уже поставленных табличек.<newline><#e8dfd2>Нажмите ПКМ по доступной для правки табличке;<newline>при необходимости удерживайте Shift.<newline>Защита территории продолжает действовать.<newline><newline><#d7b486>Нажмите, чтобы переключить редактирование.'
  legacy-settings-resource-pack: "<#d7b486>Ресурспак: <state>"
  legacy-settings-resource-pack-tooltip: '<#e6fff3>Автоматическая загрузка ресурспака при входе.<newline><#e8dfd2>Он добавляет серверные модели, предметы<newline>и значки, которые используются в меню.<newline>Выбор будет учитываться при следующем входе.<newline><newline><#d7b486>Нажмите, чтобы включить или выключить.'
  legacy-settings-totem: "<#d7b486>Полоса автототема: <state>"
  legacy-settings-totem-tooltip: '<#e6fff3>Полоса состояния автототема вверху экрана.<newline><#e8dfd2>Показывает его перезарядку, когда работает<newline>механика автоматического использования тотема.<newline>Настройка управляет отображением полосы.<newline><newline><#d7b486>Нажмите, чтобы показать или скрыть её.'
  legacy-settings-stairs-sit: "<#d7b486>Сидеть на ступеньках: <state>"
  legacy-settings-stairs-tooltip: '<#e6fff3>Посадка на ступеньки по правой кнопке мыши.<newline><#e8dfd2>Включите, чтобы использовать их как сиденье.<newline>Отключите, если случайно садитесь при стройке.<newline><newline><#d7b486>Нажмите, чтобы включить или выключить.'
  legacy-settings-tpa: "<#d7b486>Запросы телепортации: <state>"
  legacy-settings-tpa-tooltip: '<#e6fff3>Входящие запросы на телепортацию от игроков.<newline><#e8dfd2>Включено — вы можете получать запросы /tpa.<newline>Выключено — запросы будут игнорироваться.<newline>Разрешение запроса не означает его принятие.<newline><newline><#d7b486>Нажмите, чтобы переключить приём запросов.'
  legacy-settings-portal-style: "<#d7b486>Вид портала: <state><#d7b486> ›"
  legacy-settings-portal-style-tooltip: "<#e8dfd2>Внешний вид создаваемого вами портала.<newline><#e8dfd2>Можно выбрать обычное, астральное, солнечное<newline>и другие оформления. Текущий вид указан на кнопке.<newline><newline><#d7b486>Нажмите, чтобы открыть выбор оформления."
