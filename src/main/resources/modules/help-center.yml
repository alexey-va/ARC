  settings-flight-how: "<italic:false><#e8dfd2>Заряд расходуется при движении в воздухе и зависании.<newline>Для взлёта включите полёт и дважды нажмите прыжок.<newline><#e8dfd2>Нужны доступ к полёту и оставшийся заряд."
