  warp-no-description: 'Владелец ещё не добавил описание этого места.'
  warp-conditions: '<#e8dfd2>Доступ, стоимость и безопасность проверяются перед переходом.<newline><#e8dfd2>После нажатия не двигайтесь, пока не закончится отсчёт телепортации.'
  warp-changed: '<#ff6b61>Варп или условия доступа изменились. Обновите список и выберите точку заново.'
  warp-teleport-label: '<#92bed8>Телепортироваться'
