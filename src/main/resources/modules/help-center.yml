  settings-controls-title: "<italic:false><#f3a2c9>Управление"
  legacy-action-flight-recharge-tooltip: '<#e6fff3>Меню ручного пополнения запаса полёта.<newline><#e8dfd2>В нём можно выбрать опыт или игровые деньги<newline>и посмотреть стоимость доступного количества.<newline>Покупка заряда выполняется в этом меню.<newline><newline><#d7b486>Нажмите, чтобы открыть пополнение.'
  legacy-action-flight-toggle-tooltip: '<#e6fff3>Включить или выключить режим полёта за заряд.<newline><#e8dfd2>Для взлёта дважды нажмите прыжок.<newline>Нужны доступ к полёту и оставшийся заряд.<newline>Эта кнопка не выбирает способ подзарядки.<newline><newline><#d7b486>Нажмите, чтобы переключить режим полёта.'
  legacy-action-flight-off-tooltip: '<#e6fff3>Отключить автоматическую покупку заряда.<newline><#e8dfd2>Опыт и деньги перестанут тратиться<newline>на автопополнение. Накопленный заряд сохранится,<newline>и его можно будет использовать для полёта.<newline><newline><#d7b486>Нажмите, чтобы выключить автоподзарядку.'
  legacy-action-flight-money-tooltip: '<#e6fff3>Автоматически пополнять заряд за игровые деньги.<newline><#e8dfd2>Когда запас снизится, деньги будут списываться<newline>с вашего баланса без отдельного нажатия.<newline>Автопополнение за опыт будет выключено.<newline><newline><#d7b486>Нажмите, чтобы выбрать оплату деньгами.'
  legacy-action-flight-exp-tooltip: '<#e6fff3>Автоматически пополнять заряд за очки опыта.<newline><#e8dfd2>Когда запас снизится, опыт будет списываться<newline>без отдельного нажатия. Это очки, а не уровни.<newline>Автопополнение за деньги будет выключено.<newline><newline><#d7b486>Нажмите, чтобы выбрать оплату опытом.'
  flight-body-start: '<#f4bd6a>Как взлететь<newline><#e6fff3>Включите режим кнопкой «Переключить полёт», затем дважды нажмите прыжок. Нужны доступ к полёту и запас заряда. Настройка подзарядки сама по себе их не выдаёт.'
  flight-body-recharge: '<#f4bd6a>Автоподзарядка<newline><#e6fff3>При низком запасе заряд пополняется за выбранный ресурс: очки опыта или игровые деньги. Ресурс списывается автоматически. Режим «выкл» отключает только автопополнение.'
  flight-body-how: '<#f4bd6a>Как работает полёт<newline><#e6fff3>Это полёт с запасом заряда: он расходуется, пока вы летите или зависаете в воздухе. Остаток показывает полоса вверху экрана.'
  setting-trails-off-tooltip: '<#e6fff3>Ваши шаги участвуют в создании тропинок.<newline><#e8dfd2>Повторные проходы меняют подходящую землю<newline>и постепенно прокладывают маршрут.<newline>Выключение не убирает уже созданные тропы.<newline><newline><#d7b486>Нажмите, чтобы больше не протаптывать землю.'
  setting-trails-on-tooltip: '<#e6fff3>Повторные проходы постепенно протаптывают землю.<newline><#e8dfd2>Подходящие блоки меняются по стадиям,<newline>и на часто используемом маршруте появляется тропа.<newline><newline><#d7b486>Нажмите, чтобы ваши шаги создавали тропинки.'
  setting-particles-tooltip: '<#e6fff3>Видимость эффектов PlayerParticles.<newline><#e8dfd2>Отключите их, если частицы отвлекают,<newline>или включите, чтобы снова видеть эффекты.<newline>Настройка меняет их отображение для вас.<newline><newline><#d7b486>Нажмите, чтобы показать или скрыть частицы.'
  setting-chat-local-tooltip: '<#e6fff3>Локальный чат для общения поблизости.<newline><#e8dfd2>Ваши сообщения увидят игроки рядом.<newline>Подходит для разговора в одном месте.<newline><newline><#d7b486>Нажмите, чтобы писать в локальный чат.'
  setting-chat-global-tooltip: '<#e6fff3>Глобальный чат для общего общения.<newline><#e8dfd2>Сообщения отправляются в общий канал,<newline>даже если собеседник далеко от вас.<newline><newline><#d7b486>Нажмите, чтобы писать в глобальный чат.'
  legacy-settings-portal-for-other-tooltip: '<#e6fff3>Доступ других игроков к вашим порталам.<newline><#e8dfd2>Включено — разрешаете гостям использовать<newline>ваши порталы. Выключено — закрываете доступ.<newline>У гостя также должны быть включены чужие порталы.<newline><newline><#d7b486>Нажмите, чтобы переключить разрешение.'
  legacy-settings-portal-by-other-tooltip: '<#e6fff3>Использование порталов других игроков.<newline><#e8dfd2>Включено — вы разрешаете перемещать себя<newline>через чужие порталы, если владелец их открыл.<newline>Выключено — такие переходы запрещены.<newline><newline><#d7b486>Нажмите, чтобы переключить разрешение.'
  legacy-settings-shortcut: "<#d7b486>Shift + F: <state><#d7b486> ›"
  legacy-settings-shortcut-tooltip: '<#e6fff3>Выберите действие для Shift + F.<newline><#e8dfd2>Если вы сменили клавиши управления: приседание + смена рук.<newline>Выбор сохраняется между серверами. Обычная F не меняется.'
  legacy-settings-escape: "<#d7b486>Escape: <state><#d7b486> ›"
