  travel-loading: '<#e6fff3>Загружаю ваши дома…'
  travel-body: '<#91c4ff>Дома <#e8dfd2>возвращают в ваши личные точки, <#86dcf1>варпы <#e8dfd2>ведут к местам игроков, а случайная телепортация помогает начать исследование выбранного мира.<newline><#e8dfd2>Телепортация может иметь короткую задержку — не двигайтесь до её завершения.'
  travel-empty: '<#e6fff3>У вас пока нет домов. Создайте первый в текущей точке.'
