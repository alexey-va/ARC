  settings-flight-unavailable: "<#e8dfd2>Запас заряда и состояние полёта недоступны.<newline>Откройте раздел позже, чтобы обновить данные."
  settings-flight-status: "<#e4b878>Запас заряда<newline><#9bd48d><filled><#e8dfd2><empty>  <#e8dfd2><percent>%<newline><#e8dfd2><charge> / <maximum><#e8dfd2>    Полёт: <state>"
