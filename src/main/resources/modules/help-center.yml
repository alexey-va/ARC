  guide-title: '<#f4bd6a>Первые шаги'
  guide-body: '<#f4bd6a>1 · Подготовьтесь<newline><#e8dfd2>Заберите стартовый набор: инструменты и припасы помогут спокойно освоиться.<newline><newline><#86dcf1>2 · Найдите место<newline><#e8dfd2>Выберите подходящий мир, осмотритесь и не спешите строить постоянную базу в первом попавшемся месте.<newline><newline><#ffb277>3 · Освойте заработок<newline><#e8dfd2>Работы платят за обычные игровые действия. Выберите профессию под то, чем уже занимаетесь.<newline><newline><#9bd48d>4 · Закрепитесь<newline><#e8dfd2>Сохраните дом, затем создайте поселение и защитите чанки. Дом отвечает за возвращение, приват — за безопасность территории.<newline><newline><#c4abff>5 · Выберите свой путь<newline><#e8dfd2>Стройте, исследуйте, торгуйте, проходите данжи или играйте вместе — обязательной линейки здесь нет.'
