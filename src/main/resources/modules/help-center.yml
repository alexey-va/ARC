  legacy-settings-scoreboard-tooltip: '<#e6fff3>Панель с информацией справа на экране.<newline><#e8dfd2>Выберите подходящий набор данных:<newline>баланс, координаты, профессии или прогресс.<newline><newline><#d7b486>Нажмите, чтобы выбрать один из 20 видов<newline>или полностью скрыть панель.'
  legacy-settings-tablist: "<#d7b486>Tab: <state><#d7b486> ›"
  legacy-settings-tablist-tooltip: '<#e6fff3>Оформление списка игроков по клавише Tab.<newline><#e8dfd2>Виды отличаются набором дополнительных<newline>данных: профиль, баланс, место и прогресс.<newline><newline><#d7b486>Нажмите, чтобы выбрать один из 20 видов<newline>или выключить дополнительное оформление.'
  legacy-settings-lands: "<#d7b486>Границы земель ›"
  legacy-settings-lands-tooltip: '<#e6fff3>Подсветка границ территории Lands.<newline><#e8dfd2>Помогает понять, где заканчивается участок<newline>и какие блоки входят в поселение.<newline><newline><#d7b486>Нажмите, чтобы показать границы рядом<newline>или убрать их отображение.'
