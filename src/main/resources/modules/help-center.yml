  favorites-picker-body: '<#e6fff3>Выберите раздел, затем нужное действие.<newline><#e8dfd2>В его карточке нажмите «Добавить в избранное».'
  goal-earn-body: '<#e6fff3>Работы платят за игровые действия, а магазины выкупают ресурсы.<newline><#e8dfd2>Редкие вещи можно предложить другим игрокам на аукционе.'
  goal-build-body: '<#e6fff3>Сначала защитите место для базы, затем выбирайте материалы и инструменты.<newline><#e8dfd2>В технологиях есть механизмы, а в каталоге — дополнительные предметы.'
  goal-explore-body: '<#e6fff3>Выберите мир или готовую точку для путешествия.<newline><#e8dfd2>Перед дальней дорогой сохраните дом в разделе «Телепортация».'
  goal-fight-body: '<#e6fff3>Дуэли — для боя с игроком, данжи — для приключений с противниками.<newline><#e8dfd2>Условия участия и награды показаны внутри выбранной активности.'
  goal-develop-body: '<#e6fff3>Откройте ранг, чтобы увидеть условия следующего повышения.<newline><#e8dfd2>Работы, задания и навыки дают отдельные цели для развития.'
  goal-together-body: '<#e6fff3>Найдите друга в сети: можно написать, позвать к себе или пригласить в приват.<newline><#e8dfd2>События и дуэли помогут выбрать совместное занятие.'
  diagnostic-cannot-teleport-help: '<#e6fff3>Не двигайтесь во время отсчёта телепортации.<newline>Проверьте сохранённые дома или отправьте другу новый запрос.<newline><#e8dfd2>Если команда отказала, причина будет в последнем сообщении чата.'
  diagnostic-cannot-claim-help: '<#e6fff3>Выберите своё поселение в разделе «Приват».<newline>Проверьте лимит чанков, доступный баланс и права на расширение.<newline><#e8dfd2>Чужую территорию занять нельзя. Подробный отказ покажет Lands.'
  diagnostic-cannot-find-player-help: '<#e6fff3>Откройте «Игроки», выберите всю сеть и сбросьте поиск.<newline>Попробуйте часть ника, затем обновите список.<newline><#e8dfd2>В списке показаны только игроки онлайн.'
  diagnostic-lost-item-help: '<#e6fff3>Возьмите предмет в основную руку и откройте его карточку.<newline>Для дополнительных предметов доступен рецепт, если его предоставляет каталог.<newline><#e8dfd2>Переход в магазин или на аукцион сам по себе ничего не продаёт.'
  diagnostic-command-failed-help: '<#e6fff3>Найдите действие через поиск — там есть описание и точная команда.<newline>Проверьте последнее сообщение чата: в нём может быть причина отказа.<newline><#e8dfd2>Недоступный на этом сервере раздел может отсутствовать в каталоге.'
