  settings-chat-body: "<italic:false><#e5ba73>Локальный чат <#e8dfd2>— для игроков рядом.<newline><#e5ba73>Глобальный чат <#e8dfd2>— для всей сети.<newline><newline>Выбор определяет, куда отправляются ваши обычные сообщения."
  settings-chat-tooltip: "<italic:false><#e8dfd2>Выберите, кто будет получать ваши сообщения."
  settings-chat-title: "<italic:false><#e5ba73>Канал чата"
  settings-escape-label: "<italic:false><#f3a2c9>Escape"
  settings-shortcut-label: "<italic:false><#f3a2c9>Shift + F"
  search-all-query: "все действия"
  search-lexical-notice: "<italic:false><#e8dfd2>Сейчас доступен поиск по названиям и описаниям."
  rules-body: "<italic:false><#86dcf1><bold>Честная игра</bold><newline><#e8dfd2>Не используйте читы и не злоупотребляйте багами.<newline><newline><#86dcf1><bold>Общение</bold><newline><#e8dfd2>Без спама, чрезмерного мата и оскорблений игроков или их близких.<newline><newline><#86dcf1><bold>Обращения к администрации</bold><newline><#e8dfd2>Опишите проблему сразу. Не просите выдать предметы.<newline><newline><#86dcf1><bold>PvP и защита</bold><newline><#e8dfd2>В поселениях соблюдайте установленный режим PvP. Защиту территории и клана нельзя обходить.<newline><newline><#e8dfd2>Незнание правил не освобождает от ответственности."
  rules-title: "<italic:false><#86dcf1>Правила сервера"
  rules-tooltip: "<italic:false><#e8dfd2>Прочитать правила, не выходя из меню."
