  settings-tablist-visible-label: "Дополнительные строки"
  settings-scoreboard-rewards-label: 'Итог наград'
  settings-scoreboard-rewards-tooltip: '<#e8dfd2>Итог под квестами: получено сегодня / всего.<newline>Показывается вместе с секцией квестов.'
  settings-options-scoreboard-body: "<#e8dfd2>Включайте нужные секции панели справа на экране.<newline>Новые секции выключены по умолчанию; выбор сохраняется для вашего игрока.<newline>Панель вмещает 15 строк. При нехватке места целые секции временно скрываются: сначала онлайн, итог наград, навыки и профессии.<newline>Квесты, занятие и координаты имеют приоритет."
