  menu-close-label: "<#ffffff>Закрыть меню"
  dungeons-title: "<#86dcf1>Данжи"
  dungeons-body: "<#e8dfd2>В данжах вас ждут элитные противники, боссы, задания и особое снаряжение.<newline><newline><#9bd48d>Порталы <#e8dfd2>— перейти в Гильдию искателей приключений.<newline><#f4bd6a>Гайд <#e8dfd2>— разобраться в подготовке и прохождении.<newline><#86dcf1>Меню /em <#e8dfd2>— открыть журнал EliteMobs."
  dungeons-portals-label: "<#9bd48d>› Порталы"
  dungeons-portals-tooltip: "<#9bd48d>Куда попадёте<newline><#e8dfd2>В Гильдию искателей приключений: к порталам и специалистам по снаряжению.<newline><newline><#f4bd6a>Что сделать там<newline><#e8dfd2>Выберите данж по уровню, прочитайте условия и подготовьтесь к бою.<newline><#e8dfd2>Нажатие закроет меню и выполнит /pw aguild. Если рядом появился портал — войдите в него; в режиме прямой телепортации перенос начнётся автоматически."
  dungeons-guide-label: "<#f4bd6a>◇ Гайд"
  dungeons-guide-tooltip: "<#e6fff3>Подробно о входе, группах, навыках, наградах и командах.<newline><#e8dfd2>Сначала выберите подходящий раздел для новичка."
  dungeons-menu-label: "<#86dcf1>Меню /em"
  dungeons-menu-tooltip: "<#86dcf1>Журнал EliteMobs<newline><#e8dfd2>Открывает родное меню: снаряжение, навыки, задания и доступные входы.<newline><newline><#e8dfd2>С выживания к основным данжам сначала перейдите через «Порталы». Подробные объяснения и команды собраны в гайде рядом."
  dungeons-guide-title: "<#f4bd6a>Гайд по данжам"
  dungeons-guide-body: "<#e8dfd2>Этот гайд объясняет прохождения на сервере спавна. С выживания сначала перейдите туда кнопкой «Порталы».<newline><newline><#e8dfd2>Новичку пригодятся «С чего начать», «Снаряжение» и «Бой». Для похода с друзьями — «Группа», после победы — награды и улучшения.<newline><#e8dfd2>В каждой главе: порядок действий, механики и команды."
  dungeons-guide-start-label: "<#d7b486>С чего начать"
  dungeons-guide-start-tooltip: "<#e6fff3>Первые шаги для входа в данж.<newline><#e8dfd2>Откройте раздел, чтобы увидеть порядок действий и команды."
  dungeons-guide-start-intro: "<#f4bd6a>Первый поход<newline><#e8dfd2>1. Нажмите «Порталы» или введите /pw aguild. Если рядом появился портал — войдите в него: он ведёт в Гильдию. В режиме прямой телепортации перенос начнётся автоматически.<newline>2. Найдите вход с посильным уровнем. Прочитайте описание: сложность, условия и размер группы.<newline>3. Возьмите броню, оружие, еду и лечение; оставьте место для добычи. Начните с обычной сложности.<newline>4. Подтвердите вход. Если открылось лобби, дождитесь товарищей и запуска прохождения."
  dungeons-guide-start-mechanics: "<#f4bd6a>Если не получается войти<newline><#e8dfd2>Проверьте требования самого входа: уровень, доступ и готовность группы. Открытый данж и отдельное прохождение запускаются по-разному.<newline>После похода осмотрите добычу, сдайте задания и почините экипировку. Затем выбирайте следующий маршрут — усложнять первый заход не обязательно."
  dungeons-guide-start-commands: "<#f4bd6a>Меню данжа<newline><#9bd48d>Shift + F <#e8dfd2>— открыть меню внутри данжа<newline><#e8dfd2>В лобби нажмите «Начать поход», а для выхода — «Выйти из данжа»."
  dungeons-guide-equipment-label: "<#d7b486>Снаряжение"
  dungeons-guide-equipment-tooltip: "<#e6fff3>Как подготовить экипировку.<newline><#e8dfd2>Откройте раздел, чтобы увидеть порядок действий и команды."
  dungeons-guide-equipment-intro: "<#f4bd6a>Что взять с собой<newline><#e8dfd2>Прочное оружие, полный комплект брони, еду и лечение. Для дальнего боя проверьте боезапас; оставьте свободные ячейки для трофеев.<newline>У элитных вещей читайте уровень и особые свойства в описании. Сравнивайте весь набор, а не только материал: алмазный предмет не обязательно лучше подходящей элитной вещи."
  dungeons-guide-equipment-mechanics: "<#f4bd6a>Уровень и привязка<newline><#e8dfd2>Элитное снаряжение проверяет соответствующий навык: оружие — свой тип, броня — навык брони. У вещей выше 20-го уровня действует ограничение по навыку: слишком сильную находку сначала отложите.<newline>Привязка к владельцу защищает добычу: чужой игрок не сможет просто подобрать и использовать её. Это отдельное свойство, которое не исчезает от ремонта. Перед обменом проверьте владельца в описании."
  dungeons-guide-equipment-commands: "<#f4bd6a>Команды<newline><#9bd48d>/em repair <#e8dfd2>— ремонт у специалиста<newline><#9bd48d>/em unbind <#e8dfd2>— снятие привязки<newline><#9bd48d>/em <#e8dfd2>— ваше снаряжение и навыки"
  dungeons-guide-combat-label: "<#d7b486>Бой"
  dungeons-guide-combat-tooltip: "<#e6fff3>Как работает бой с элитным мобом.<newline><#e8dfd2>Откройте раздел, чтобы увидеть порядок действий и команды."
  dungeons-guide-combat-intro: "<#f4bd6a>Как сражаться<newline><#e8dfd2>Следите за уровнем и именем противника. Элитные мобы и боссы используют особые атаки: замечайте предупреждения, эффекты на земле, снаряды и призванных помощников.<newline>Не стойте в опасной зоне ради ещё одного удара. Держите лечение под рукой, оставляйте путь для отхода. В группе заранее договоритесь, кто отвлекает босса и кто разбирается с помощниками."
  dungeons-guide-combat-mechanics: "<#f4bd6a>Поражение и повторная попытка<newline><#e8dfd2>У отдельных прохождений свои условия смерти и оставшихся попыток. После исчерпания попыток можно оказаться наблюдателем: следите за сообщениями данжа и действиями группы.<newline>Не обещайте себе мгновенное возвращение в бой: возможность продолжить зависит от маршрута. Если нужно выйти, используйте команду ниже, затем восстановите запасы и пересмотрите сложность."
  dungeons-guide-combat-commands: "<#f4bd6a>Выход из данжа<newline><#9bd48d>Shift + F <#e8dfd2>→ «Выйти из данжа».<newline>После выхода кнопка «К порталам» вернёт к подготовке в Гильдии."
  dungeons-guide-dungeons-label: "<#d7b486>Типы данжей"
  dungeons-guide-dungeons-tooltip: "<#e6fff3>Чем отличаются форматы данжей.<newline><#e8dfd2>Откройте раздел, чтобы увидеть порядок действий и команды."
  dungeons-guide-dungeons-intro: "<#f4bd6a>Выберите подходящий формат<newline><#e8dfd2>Открытый данж — общий мир: рядом могут быть другие игроки, а противники появляются повторно.<newline>Отдельное прохождение — отдельная копия локации для участников, со своим началом и завершением.<newline>Динамический данж — вариант отдельного прохождения с выбором уровня или сложности. Перед подтверждением посмотрите, что именно выбрано."
  dungeons-guide-dungeons-mechanics: "<#f4bd6a>Что означает название<newline><#e8dfd2>Логово и святилище обычно сосредоточены на боссе. Подземелье ведёт по маршруту через обычных противников и промежуточные бои. Приключение объединяет исследование и цепочку заданий, арена — последовательные волны.<newline>ID — служебное имя конкретного данжа или арены. Если его не знаете, выбирайте вход через портал или /em; русское название вместо ID может не подойти."
  dungeons-guide-dungeons-commands: "<#f4bd6a>Команды<newline><#9bd48d>/em <#e8dfd2>— выбрать вход через меню<newline><#9bd48d>/em dungeontp ID <#e8dfd2>— перейти к известному данжу<newline><#9bd48d>/em arena ID <#e8dfd2>— войти на указанную арену"
  dungeons-guide-rewards-label: "<#d7b486>Награды и валюта"
  dungeons-guide-rewards-tooltip: "<#e6fff3>Что делать с добычей.<newline><#e8dfd2>Откройте раздел, чтобы увидеть порядок действий и команды."
  dungeons-guide-rewards-intro: "<#f4bd6a>Разберите добычу после боя<newline><#e8dfd2>Сначала сравните найденные вещи с надетыми: уровень, свойства, прочность и привязку. Полезные оставьте; ненужные можно продать или разобрать на материалы для ремонта.<newline>Проверьте задания: победа над боссом может выполнить цель, но за самой наградой ещё потребуется вернуться к NPC. Условия конкретного данжа важнее обещания одинаковой награды за любой бой."
  dungeons-guide-rewards-mechanics: "<#f4bd6a>Кристаллы и покупки<newline><#e8dfd2>В EliteMobs используется отдельная валюта — кристаллы. Это баланс для магазинов и услуг Гильдии; проверяйте его командой ниже.<newline>Перед покупкой, зачарованием или снятием привязки прочитайте цену и условия. При переводе другому игроку учитывается налог: полученная сумма может отличаться от отправленной. НИК и СУММА в примере заменяются именем игрока и числом."
  dungeons-guide-rewards-commands: "<#f4bd6a>Команды<newline><#9bd48d>/em money check <#e8dfd2>— баланс кристаллов<newline><#9bd48d>/em shop dynamic <#e8dfd2>— магазин с меняющимся ассортиментом<newline><#9bd48d>/em shop custom <#e8dfd2>— магазин особых предметов<newline><#9bd48d>/em pay НИК СУММА <#e8dfd2>— перевести кристаллы"
  dungeons-guide-guild-label: "<#d7b486>Гильдия и навыки"
  dungeons-guide-guild-tooltip: "<#e6fff3>Что есть в гильдейском хабе.<newline><#e8dfd2>Откройте раздел, чтобы увидеть порядок действий и команды."
  dungeons-guide-guild-intro: "<#f4bd6a>Где искать помощь<newline><#e8dfd2>Гильдия искателей приключений — место подготовки между походами. Здесь находятся порталы, выдающие задания NPC, магазины и специалисты по предметам.<newline>Разборщик перерабатывает ненужную добычу, Ремонтник восстанавливает прочность, Зачарователь улучшает зачарования. За свитками, снятием привязки и бонусами навыков обращайтесь к соответствующим специалистам."
  dungeons-guide-guild-mechanics: "<#f4bd6a>Навыки и бонусы<newline><#e8dfd2>Развиваются девять навыков: броня, мечи, топоры, луки, арбалеты, трезубцы, мотыги, булавы и копья. Побеждайте элитных мобов оружием нужного типа; броня растёт медленнее.<newline>На уровнях 10, 25, 50 и 75 открываются ступени бонусов. Для одного типа навыка можно выбрать до трёх активных бонусов. Проверяйте новые варианты после повышения уровня — открытый бонус ещё нужно выбрать."
  dungeons-guide-guild-commands: "<#f4bd6a>Команды<newline><#9bd48d>/pw aguild <#e8dfd2>— в Гильдию<newline><#9bd48d>/em <#e8dfd2>— навыки и доступные разделы"
  dungeons-guide-crafting-label: "<#d7b486>Предметы и улучшения"
  dungeons-guide-crafting-tooltip: "<#e6fff3>Как обслуживать добычу.<newline><#e8dfd2>Откройте раздел, чтобы увидеть порядок действий и команды."
  dungeons-guide-crafting-intro: "<#f4bd6a>Ремонт и разбор<newline><#e8dfd2>Ненужный элитный предмет отдайте Разборщику: при успешном разборе получите материалы. Действие расходует исходную вещь — сначала проверьте, что выбрали.<newline>Материалы используются у Ремонтника для восстановления прочности. Ремонт не повышает уровень, не добавляет зачарования и не снимает привязку."
  dungeons-guide-crafting-mechanics: "<#f4bd6a>Зачарования, свитки и привязка<newline><#e8dfd2>Зачарователь работает с элитной вещью и книгой зачарования. Попытка стоит кристаллы, цена зависит от уже имеющихся зачарований, а успех не гарантирован; талон удачи может помочь.<newline>Свиток придаёт обычной вещи элитный уровень через специалиста по свиткам. Снятие привязки позволяет освободить вещь от владельца на условиях отдельной услуги. Перед любой операцией прочитайте стоимость и предупреждение в её меню."
  dungeons-guide-crafting-commands: "<#f4bd6a>Команды<newline><#9bd48d>/em repair <#e8dfd2>— ремонт<newline><#9bd48d>/em scrap <#e8dfd2>— разбор<newline><#9bd48d>/em enchant <#e8dfd2>— зачарование<newline><#9bd48d>/em scroll <#e8dfd2>— применение свитка<newline><#9bd48d>/em unbind <#e8dfd2>— снятие привязки"
  dungeons-guide-quests-label: "<#d7b486>Квесты"
  dungeons-guide-quests-tooltip: "<#e6fff3>Как брать и отслеживать квесты.<newline><#e8dfd2>Откройте раздел, чтобы увидеть порядок действий и команды."
  dungeons-guide-quests-intro: "<#f4bd6a>От принятия до награды<newline><#e8dfd2>1. Поговорите с выдающим задания NPC и прочитайте цель: кого победить, куда сходить или что принести.<newline>2. Примите задание. Отслеживание включается автоматически; следите за счётчиком прогресса.<newline>3. После выполнения цели вернитесь к указанному NPC и сдайте задание. Заполненный счётчик ещё не означает, что награда получена."
  dungeons-guide-quests-mechanics: "<#f4bd6a>Почему задание недоступно<newline><#e8dfd2>Одновременно можно вести до 10 заданий. Следующее может открыться только после предыдущего, требовать нужного NPC или ожидания повторного прохождения.<newline>Если места не хватает, завершите текущие задания либо откажитесь от ненужного. ID в командах — идентификатор задания: используйте его только если он известен; для первого раза удобнее диалог с NPC."
  dungeons-guide-quests-commands: "<#f4bd6a>Команды<newline><#9bd48d>/em quest accept ID <#e8dfd2>— принять<newline><#9bd48d>/em quest track ID <#e8dfd2>— отслеживать<newline><#9bd48d>/em quest complete ID <#e8dfd2>— сдать выполненное<newline><#9bd48d>/em quest leave ID <#e8dfd2>— отказаться"
  dungeons-guide-groups-label: "<#d7b486>Группа"
  dungeons-guide-groups-tooltip: "<#e6fff3>Как пройти вместе.<newline><#e8dfd2>Откройте раздел, чтобы увидеть порядок действий и команды."
  dungeons-guide-groups-intro: "<#f4bd6a>Соберите группу<newline><#e8dfd2>Сначала перейдите к порталам на сервере спавна: команды группы доступны там.<newline>Лидер создаёт группу и приглашает товарищей по никам. Каждый участник принимает приглашение; перед входом проверьте состав через меню группы.<newline>Заранее договоритесь о данже и сложности. Почините броню, пополните еду и освободите инвентарь до подтверждения готовности — остальные не должны ждать, пока вы закончите подготовку."
  dungeons-guide-groups-mechanics: "<#f4bd6a>Совместный вход<newline><#e8dfd2>Лидер выбирает конкретный данж, остальные подтверждают тот же маршрут и сложность. Если кто-то отказался, не ответил вовремя или состав изменился, соберите готовых участников и повторите выбор.<newline>Во время похода держитесь рядом для общего прогресса заданий. Не уходите из группы случайно: выход меняет состав, а уже начатое прохождение имеет собственные правила. Приглашение в группу и вход в данж — два разных шага."
  dungeons-guide-groups-commands: "<#f4bd6a>Команды<newline><#9bd48d>/em party create <#e8dfd2>— создать группу<newline><#9bd48d>/em party invite НИК <#e8dfd2>— пригласить<newline><#9bd48d>/em party accept <#e8dfd2>— принять приглашение<newline><#9bd48d>/em party menu <#e8dfd2>— состав и управление<newline><#9bd48d>/em party leave <#e8dfd2>— выйти из группы"
  dungeons-guide-commands-label: "<#d7b486>Управление"
  dungeons-guide-commands-tooltip: "<#e6fff3>Короткая памятка.<newline><#e8dfd2>Как открыть меню, начать поход и пользоваться сохранениями."
  dungeons-guide-commands-intro: "<#f4bd6a>Управление походом<newline><#e8dfd2>Кнопки «Порталы» и «Журнал EliteMobs» помогут выбрать маршрут.<newline>Внутри данжа нажмите Shift + F. В лобби кнопка «Начать поход» запускает подготовленный заход, а «Выйти из данжа» позволяет завершить поход раньше. Обычный открытый данж не требует запуска."
  dungeons-guide-commands-mechanics: "<#f4bd6a>Сохранения мест<newline><#e8dfd2>Нажмите Shift + F внутри данжа. Кнопка «Сохранить здесь» запоминает вашу позицию, «Сохранения» открывает список и переход к выбранному месту, «К началу данжа» возвращает ко входу.<newline>Есть 5 ручных точек и 3 автосохранения. Автосохранение появляется примерно раз в 2 минуты, если вы прошли хотя бы 8 блоков и вышли из боя. Перед переходом стойте неподвижно 3 секунды.<newline>Предметы, монстры и награды не откатываются. Смерть и завершение очищают точки; новое прохождение начинает отдельный набор."
  dungeons-guide-commands-commands: "<#f4bd6a>Меню данжа<newline><#9bd48d>Shift + F <#e8dfd2>— открыть меню внутри данжа<newline><#e8dfd2>Здесь доступны старт прохождения, сохранения, группа, припасы и выход."
  settings-flight-back-label: "<#ffffff>‹ Назад"
  settings-flight-auto-off-help: "<#e8dfd2>Отключение сохранит накопленный заряд.<newline><#e8dfd2>Режим полёта включается на предыдущем экране."
  settings-flight-auto-current: "<#e8dfd2>Настройки / Полёт / Автопополнение<newline><#e8dfd2>Выбран способ: <state>"
