# Informational topics stay searchable across servers; actions are typed and checked in code.
guides:
  first-steps:
    title: "Первые шаги"
    description: "Набор новичка, своё место и первое занятие."
    body: "Получите стартовый набор и выберите мир для выживания. Мир добычи предназначен для ресурсов; постоянную базу стройте в мире выживания.\n\nСохраните дом для возвращения и создайте приват для защиты постройки. Затем выберите профессию, задание или другое занятие в меню."
    keywords: "новичок начало старт как начать обучение набор вещи kit menu"
  rules:
    title: "Правила и честная игра"
    description: "Общение, честная игра и правила PvP."
    body: "Прочитайте правила перед игрой и общением. Запреты на бой в привате и внутри клана действуют вместе с общими правилами сервера.\n\nЕсли возникла спорная ситуация, сохраните обстоятельства и обратитесь к администрации. Кнопка ниже открывает действующие правила."
    keywords: "правила можно нельзя запрещено грифер жалоба чит pvp"
  profile:
    title: "Профиль и баланс"
    description: "Монеты, жетоны, ранг, дома и текущий мир."
    body: "В профиле собраны ваш ранг, отдельные балансы монет и жетонов, дома, приваты и координаты. Это удобная проверка перед покупкой, путешествием или расширением территории.\n\nДом сохраняет точку телепортации, а приват защищает территорию: одно не заменяет другое."
    keywords: "мой профиль про меня баланс деньги жетоны координаты где я"
  recovery:
    title: "Если что-то не работает"
    description: "Проверить телепортацию, приват, игрока или пропавшие вещи."
    body: "Откройте «Что случилось?» и выберите проблему. Подсказки учитывают доступные действия, текущий мир и ограничения.\n\nЕсли вы застряли, используйте возврат на спавн. После смерти сначала проверьте могилы; потерянная добыча из данжей хранится отдельно."
    keywords: "помощь проблема застрял потерялся не работает ошибка умер смерть вещи"
  graves:
    title: "Могилы и вещи после смерти"
    description: "Найти свою могилу и забрать сохранённые вещи."
    body: "После смерти проверьте свои могилы. Когда есть активная могила, главное меню показывает отдельную кнопку для неё. Откройте список и проверьте место и доступные действия.\n\nВозврат на прежнее место и могила — разные возможности. Не рассчитывайте на восстановление предметов, которых нет в могиле или другом хранилище."
    keywords: "могила могилы смерть умер вещи инвентарь graves вернуть после смерти"
  lost-loot:
    title: "Потерянная добыча"
    description: "Забрать сохранённую добычу из данжей."
    body: "Этот раздел хранит подходящую добычу элитных мобов, которую сервер успел сохранить за вами. Откройте хранилище, заберите нужное и проверьте доступную продажу ненужного.\n\nЭто не общий архив инвентаря: обычные выброшенные вещи и содержимое могил ищутся другими способами. Добыча и расчёты в данжах используют свою валюту — кристаллы."
    keywords: "потерянная добыча лут loot elitemobs вещи пропали кристаллы"
  worlds:
    title: "Миры и случайная телепортация"
    description: "Выбрать мир для базы, ресурсов или исследования."
    body: "В разделе телепортации выберите случайное место и нужный мир. Обычный мир и мир новых биомов подходят для выживания; мир добычи служит источником ресурсов и обновляется.\n\nСначала проверьте выбранный мир, затем подтвердите переход. Сохраните подходящее место как дом, если планируете возвращаться."
    keywords: "миры обычный ванильный новые биомы добыча шахта ресурсы ртп rtp random случайное место"
  homes:
    title: "Дома"
    description: "Сохранить точку, вернуться домой или перенести дом."
    body: "Откройте телепортацию и создайте дом в текущем месте. В карточке дома можно вернуться к нему, перенести точку сюда или удалить её. Перенос и удаление требуют подтверждения.\n\nКоличество доступных домов показано в меню. Дом не защищает блоки: для этого создайте приват."
    keywords: "дом дома хом home sethome delhome edithome сохранить точку перенести удалить вернуться"
  public-homes:
    title: "Публичные дома"
    description: "Открыть свою точку для гостей и находить чужие дома."
    body: "Выберите свой дом в меню телепортации и сделайте его публичным. После этого другие игроки смогут найти точку в списке публичных домов и телепортироваться к ней.\n\nЧтобы закрыть посещение через этот список, снова сделайте дом личным. Публичный дом сам по себе не даёт гостям права строить в привате."
    keywords: "публичный дом личный открытый гости посетить public privacy"
  player-warps:
    title: "Варпы игроков"
    description: "Найти магазин, постройку или открытую точку игрока."
    body: "Откройте варпы и выберите интересующее место. Перед переходом проверьте владельца, мир, описание и указанную стоимость телепортации.\n\nВарп отличается от личного дома: это публичная точка для посетителей. Правила и цены владельца смотрите в карточке самой точки."
    keywords: "варпы варп warp warps pw точки посетить магазин телепорт"
  player-teleport:
    title: "Телепортация к игроку"
    description: "Отправить запрос другу и ответить на входящий запрос."
    body: "Найдите игрока в сетевом списке и откройте его карточку. Выберите телепортацию и дождитесь согласия получателя.\n\nВходящие запросы доступны отдельно. Если запросы отключены в личных настройках, проверьте переключатель; ограничения мира или привата тоже могут влиять на переход."
    keywords: "телепорт к другу tpa tpahere принять отклонить запрос игрок"
  origin-portals:
    title: "Порталы на спавне"
    description: "Переходить между игровыми направлениями через порталы."
    body: "Вернитесь на спавн и подойдите к нужному порталу. Направление и условия перехода указаны у него; некоторые переходы требуют находиться рядом.\n\nДля Slimefun используйте его портал. После перехода на сервер технологий откройте местное меню острова и гайд. Дом и обычный случайный телепорт не заменяют этот вход."
    keywords: "портал порталы спавн сервер сеть переход слизь slimefun skyblock"
  lands:
    title: "Приваты и защита построек"
    description: "Создать поселение и защитить свою территорию."
    body: "Выберите постоянное место и откройте «Приваты». Создайте поселение, затем добавьте нужные чанки. До подтверждения проверьте стоимость и доступные лимиты.\n\nУправление участниками, ролями и территорией находится в том же разделе. Сохранённый дом не является приватом."
    keywords: "приват приваты земля lands поселение защита дом гриферы создать claim"
  land-members:
    title: "Участники и права привата"
    description: "Пригласить друга и определить, что ему разрешено."
    body: "Откройте нужное поселение и его участников. Пригласите игрока, затем назначьте подходящую роль и проверьте права этой роли.\n\nЕсли доступ больше не нужен, исключите участника. Членство в клане и право строить в конкретном привате — разные настройки."
    keywords: "добавить пригласить друга участник доступ доверить trust untrust исключить права роли"
  land-growth:
    title: "Территория и границы"
    description: "Расширить приват, увидеть чанки и управлять его областями."
    body: "В управлении поселением выберите добавление или освобождение территории. Проверяйте, к какому поселению относится выбранный участок, сколько чанков доступно и что стоит действие.\n\nГраницы помогают увидеть занятые чанки. Главный блок и отдельные области настраиваются внутри выбранного поселения."
    keywords: "границы чанки расширить занять освободить участок область главный блок колокол костер"
  pvp:
    title: "PvP, клан и территория"
    description: "Разобраться, почему бой разрешён или запрещён."
    body: "На возможность боя влияют правила территории и отношения внутри клана. Проверьте оба условия, если урон не проходит там, где вы его ожидали.\n\nНастройки привата меняются в его управлении, клана — в меню клана. Для согласованного поединка используйте дуэли и заранее прочитайте их условия."
    keywords: "пвп pvp бой урон не проходит клан территория друзья сражение"
  earning:
    title: "Как заработать"
    description: "Выбрать профессию, подработку, контракт или торговлю."
    body: "Профессии оплачивают подходящие игровые действия. Подработки на спавне — отдельные смены у жителей. Ресурсные контракты принимают нужные предметы по текущим условиям.\n\nПредметы можно продавать игрокам или через доступную быструю продажу. Сначала выберите занятие и посмотрите его условия: одинакового гарантированного дохода у этих способов нет."
    keywords: "заработок заработать зарабатывать деньги доход монеты работа подработка профессия продажа"
  money:
    title: "Деньги и переводы"
    description: "Проверить баланс, перевести монеты и различать валюты."
    body: "Монеты, премиальные жетоны и кристаллы данжей — разные валюты. Их балансы и назначения не складываются в одну сумму. Монеты и жетоны видны в профиле.\n\nДля перевода монет найдите игрока, укажите сумму и проверьте получателя на экране подтверждения. Банковский счёт открывается отдельно."
    keywords: "деньги монеты баланс валюта жетоны токены кристаллы перевод заплатить pay"
  jobs:
    title: "Работы и профессии"
    description: "Получать прогресс за подходящие действия выбранной профессии."
    body: "Откройте работы, выберите профессию и изучите действия, которые она учитывает. Следите за активной профессией и её прогрессом; условия начисления показаны в её меню.\n\nЭто длительное развитие профессии. Разовая смена у жителя на спавне относится к подработкам и запускается у самого жителя."
    keywords: "работа работы профессия профессии зарплата заработок деньги ecojobs arcjobs jobs"
  odd-jobs:
    title: "Подработки у жителей"
    description: "Выполнять отдельные смены в конюшне и кузне."
    body: "На спавне найдите Сеню в конюшне или Эдгара в кузне. Зажмите Shift и нажмите по жителю правой кнопкой мыши, затем прочитайте условия смены и начните её.\n\nВыполняйте показанные задания и возвращайтесь к рабочему месту. Состояние и ограничения смены проверяются там же; профессия в меню «Работы» — отдельная механика."
    keywords: "подработка подработки подзаработать смена сеня конюшня эдгар кузня npc работа у жителей"
  resource-contracts:
    title: "Ресурсные контракты"
    description: "Сдавать запрошенные ресурсы по действующим заказам."
    body: "Откройте доску контрактов и выберите действующую закупку. Проверьте нужный предмет, доступный объём, срок и текущую выплату. Подготовьте ресурсы и следуйте к указанному месту сдачи.\n\nПеред подтверждением ещё раз проверьте принимаемое количество и итог. Личные ограничения и оставшийся объём закупки могут меняться."
    keywords: "контракт контракты ресурсы закупка заказ сдать сдача бюджет ресурсные деньги заработок"
  shops:
    title: "Магазины и покупка"
    description: "Выбрать товар и проверить стоимость перед покупкой."
    body: "Откройте магазины и выберите нужный раздел. Проверьте предмет, количество и итоговую цену перед подтверждением. У торговых жителей и магазинов игроков ассортимент может отличаться.\n\nДля точной покупки по известному пути товара существует /buy <путь> <количество>. Путь берётся из конкретного каталога; он не является названием предмета наугад."
    keywords: "магазин магазины купить покупка buy shop shops товар точное количество"
  sell:
    title: "Быстрая продажа"
    description: "Продать предметы, которые принимает текущий каталог."
    body: "Откройте быструю продажу и выберите подходящие предметы. Перед подтверждением проверьте принимаемый ассортимент, количество и итоговую сумму. Не каждый предмет подходит для выкупа сервером.\n\nАукцион продаёт вещи другим игрокам, а ресурсные контракты принимают конкретные заказы. Это отдельные способы торговли."
    keywords: "быстрая продажа быстро продать продажа sell деньги сбыт скупка выкуп"
  auction:
    title: "Аукцион"
    description: "Покупать и выставлять предметы для других игроков."
    body: "Откройте аукцион, найдите предмет и проверьте свойства лота, количество и цену. Для своей продажи используйте управление лотами.\n\nДо выставления прочитайте комиссию и срок. Размещение лота ещё не означает продажу: предмет должен купить другой игрок. Следите за завершёнными и истёкшими лотами."
    keywords: "аукцион ah лот выставить продать купить торговать игроки комиссия"
  bank:
    title: "Банк"
    description: "Управлять личным банковским счётом."
    body: "Откройте банк, проверьте баланс счёта и выберите доступную операцию внесения или снятия. Перед подтверждением смотрите сумму и условия в окне банка.\n\nМонеты на счёте и наличный баланс — разные места хранения. Вклад сам по себе не является заработком. Проценты на денежный вклад сейчас отключены."
    keywords: "банк банковский счет счёт вклад хранить деньги положить снять bank"
  player-shops:
    title: "Магазины игроков"
    description: "Торговать через магазины с сундуками."
    body: "Найдите магазин игрока и взаимодействуйте с его торговой табличкой или витриной. Проверьте, продаёт он предметы вам или покупает их у вас, а также цену и количество.\n\nПри создании своего магазина следуйте подсказкам у сундука. Доступ к сундуку, запас товара и права на территории влияют на работу магазина."
    keywords: "магазины игроков сундук табличка quickshop покупка продажа свой магазин chestshop"
  autosell:
    title: "Автопродажа"
    description: "Продавать подходящие ресурсы через сундук автопродажи."
    body: "Сундук автопродажи использует доступный ассортимент выкупа. Проверьте его описание и настройки, положите подходящие ресурсы и следите за результатом операции.\n\nПредметы, которых нет в принимаемом каталоге, не становятся продаваемыми от помещения в сундук. Условия быстрой продажи и автоматической продажи зависят от текущего выкупа сервера."
    keywords: "автопродажа авто продажа autosell сундук автоматически продать ресурсы"
  ranks:
    title: "Ранги"
    description: "Проверить текущий ранг и условия следующего повышения."
    body: "Откройте ранги: меню показывает ваше положение и следующую цель. Изучите требования, выполните их и подтвердите повышение, когда оно станет доступно.\n\nПути развития, задания, контракты, усиления и награды находятся в связанных разделах ранга. Условия конкретного уровня проверяйте в его карточке."
    keywords: "ранг ранги rank rankup повысить повышение развитие уровень требования"
  rank-paths:
    title: "Пути развития"
    description: "Следить за отдельными направлениями прогресса ранга."
    body: "В меню ранга откройте пути и выберите направление. Карточка показывает текущий прогресс, следующую цель и подходящие действия.\n\nРазвивайте нужные направления в обычной игре. Не путайте прогресс пути с балансом монет или опытом отдельного навыка."
    keywords: "пути путь мастерство специализация развитие прогресс направление"
  rank-contracts:
    title: "Контракты ранга"
    description: "Выполнять личные цели и забирать награды."
    body: "Откройте контракты в меню ранга. Прочитайте личную цель, прогресс, доступную награду и оставшееся время. После выполнения заберите награду через этот раздел.\n\nКонтракты ранга отличаются от ресурсных закупок: у них собственные условия и порядок получения наград. Актуальные ограничения видны в карточке."
    keywords: "контракты ранга недельный контракт задание награда личная цель"
  daily-quests:
    title: "Задания и квесты"
    description: "Выполнять персональные цели и следить за прогрессом."
    body: "Откройте квесты, выберите цель и проверьте подходящие действия, награду и оставшееся время. У ежедневных и недельных заданий разные окна выполнения.\n\nПосле выполнения проверьте получение награды в самом задании. Отображение активных целей на экране настраивается отдельно в интерфейсе."
    keywords: "квест квесты задания дейлики ежедневные недельные цели награды quests"
  rank-rewards:
    title: "Награды и наборы ранга"
    description: "Проверить доступные награды и возможность повторного получения."
    body: "В меню ранга откройте награды или наборы. Проверьте, что доступно вашему рангу и сколько осталось ждать до следующего получения.\n\nПолучайте награду через её кнопку и проверяйте результат. Награды за задания, контракты и голосования открываются в своих разделах."
    keywords: "награда награды набор кит еженедельный weekly kit бонус получить забрать"
  boosts:
    title: "Усиления"
    description: "Посмотреть действующие усиления и условия активации."
    body: "Откройте усиления в меню ранга. Перед покупкой или активацией проверьте эффект, срок, стоимость и используемую валюту.\n\nРазные усиления меняют разные действия. Их длительность и совместимость смотрите в текущем меню; усиление не означает выплату за любое действие."
    keywords: "усиления бусты boost множитель опыт профессия деньги эффект"
  skills:
    title: "Навыки"
    description: "Развивать способности обычными игровыми действиями."
    body: "Откройте навыки и выберите интересующий. Меню показывает уровень, прогресс и связанные способности. Выполняйте действия этого навыка, чтобы продвигаться дальше.\n\nНавык, профессия и ранг развиваются отдельно. Их условия и эффекты смотрите в соответствующих разделах."
    keywords: "навыки auraskills skills способности умения прокачка опыт уровень"
  players:
    title: "Игроки сети"
    description: "Найти друга, открыть его действия и пригласить в игру."
    body: "Откройте список игроков и введите ник или часть ника. Список позволяет искать на всей сети или только на текущем сервере.\n\nВ карточке игрока доступны подходящие действия: сообщение, запрос телепортации, перевод монет, дуэль и приглашение в поселение. Перед переводом проверьте получателя и сумму."
    keywords: "игрок игроки друг друзья онлайн найти ник пригласить"
  messages:
    title: "Чат и личные сообщения"
    description: "Выбрать канал общения или написать конкретному игроку."
    body: "Локальный чат предназначен для общения рядом, глобальный — для общего общения сети. Текущий канал можно выбрать в настройках.\n\nДля личного сообщения найдите игрока и откройте его карточку. Соблюдайте правила общения; сообщения в публичном канале видит не только выбранный собеседник."
    keywords: "чат локальный глобальный общий лс личка написать сообщение msg g l"
  clans:
    title: "Кланы"
    description: "Играть вместе и управлять составом своего клана."
    body: "Откройте кланы, создайте свой или примите приглашение. В меню доступны участники и действия, разрешённые вашей роли.\n\nДля совместной стройки отдельно выдайте права на нужный приват. Настройки клана и территории могут влиять на PvP между участниками."
    keywords: "клан кланы гильдия команда teams clans guild участники друзья вступить"
  requests:
    title: "Входящие запросы"
    description: "Отвечать на запросы и проверять доступные награды."
    body: "Откройте входящие запросы и выберите нужный. Перед принятием проверьте отправителя и действие, на которое вы соглашаетесь.\n\nЗдесь же собраны переходы к доступным наградам и заданиям. Если ожидаемый запрос не появляется, проверьте личные настройки и состояние соответствующего раздела."
    keywords: "входящие запросы приглашения принять отклонить tpa награды"
  dungeons:
    title: "Данжи и элитные мобы"
    description: "Подготовиться к походу, собрать группу и получить добычу."
    body: "Откройте данжи, изучите гайд и выберите портал. В подробном руководстве описаны подготовка, снаряжение, бой, группа, навыки и награды.\n\nПоходы начинаются через предусмотренные порталы. С выживания сначала перейдите к ним на спавн; потерянную сохранённую добычу можно проверить отдельно."
    keywords: "данж данжи подземелье боссы elite elitemobs мобы кристаллы группа поход"
  events:
    title: "События"
    description: "Участвовать в доступных серверных событиях."
    body: "Откройте события и выберите доступное. Перед входом прочитайте правила, состояние и условия участия.\n\nСостав событий меняется: отсутствие активного события означает, что сейчас вход не открыт. Результаты и награды проверяйте в самом событии."
    keywords: "событие события ивент event minigame миниигра участвовать"
  duels:
    title: "Дуэли"
    description: "Вызвать игрока на согласованный поединок."
    body: "Откройте дуэли или карточку игрока и отправьте вызов. Согласуйте доступные условия и дождитесь принятия.\n\nПеред началом прочитайте правила выбранного режима. Дуэль и обычный бой в мире могут иметь разные ограничения."
    keywords: "дуэль дуэли поединок pvp пвп сразиться арена бой"
  parkour:
    title: "Паркур"
    description: "Выбрать трассу и проходить её через контрольные точки."
    body: "Откройте паркур и выберите доступную трассу. Следуйте её маршруту и правилам; контрольные точки и результат принадлежат выбранной трассе.\n\nПеред стартом проверьте условия завершения и награды. Для возвращения используйте штатный выход из прохождения."
    keywords: "паркур parkour pa pkr прыжки трасса контрольные точки рекорд"
  farms:
    title: "Ферма и шахта"
    description: "Выполнять общие заказы и пользоваться шахтным лифтом."
    body: "На спавне подойдите к порталу фермы или шахты. Это общие занятия: участники выполняют один заказ и продвигают его вместе.\n\nНа ферме следуйте этапам подготовки, посадки, ухода и сбора. В шахте выполняйте разведку, добычу и погрузку по текущим подсказкам. У лифта вызовите кабину и выберите этаж; меню ниже показывает доступные занятия."
