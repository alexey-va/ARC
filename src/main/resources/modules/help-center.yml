# Search intents are safe navigation targets. They never execute destructive
# commands directly; the destination dialog owns selection and confirmation.
intents:
  my: { label: 'Про меня', description: 'Открыть личный профиль, дома, поселения и прогресс', keywords: 'мой профиль баланс деньги координаты где я мои данные' }
  home-create: { label: 'Создать дом', description: 'Сохранить текущую точку как новый дом', keywords: 'поставить дом создать хом sethome сохранить точку' }
  home-move: { label: 'Перенести дом', description: 'Выбрать дом и заменить его сохранённую точку', keywords: 'передвинуть переместить перенести точку дома edithome' }
  home-delete: { label: 'Удалить дом', description: 'Выбрать сохранённый дом для удаления', keywords: 'удалить стереть снести дом хом delhome' }
  land-create: { label: 'Создать поселение', description: 'Открыть поселения и начать создание', keywords: 'создать основать сделать поселение землю приват' }
  land-delete: { label: 'Удалить поселение', description: 'Открыть список и выбрать поселение для удаления', keywords: 'как удалить распустить закрыть снести поселение землю приват lands' }
  land-invite: { label: 'Добавить игрока в поселение', description: 'Выбрать поселение и пригласить участника', keywords: 'добавить пригласить позвать друга игрока участника доверить trust' }
  land-remove: { label: 'Исключить игрока из поселения', description: 'Выбрать поселение и убрать участника', keywords: 'удалить выгнать исключить убрать игрока участника untrust' }
  land-main-block: { label: 'Перенести блок поселения', description: 'Открыть управление главным блоком поселения', keywords: 'перенести передвинуть переместить блок колокол костер mainblock' }
  land-claim: { label: 'Расширить территорию', description: 'Открыть поселение и управление чанками', keywords: 'заприватить занять добавить чанк участок территорию claim' }
