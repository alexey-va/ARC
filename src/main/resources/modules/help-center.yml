  settings-options-lands-title: "<#9bd48d>Границы земель"
  settings-options-tablist-body: "<#e8dfd2>Выберите разделы над и под таблицей игроков.<newline>Выбор сохраняется, даже когда дополнительные строки отключены."
  settings-options-tablist-capacity-body: "<#e8dfd2>Выбрано секций: <sections>. Занято строк: <used>/<maximum>; свободно: <available>.<newline>Резервируем место для данных, которые появятся позже. Выбор проверяется до включения раздела."
