text:
  warps-title: '<#92bed8>Варпы игроков'
  warps-body: '<#92bed8>Места игроков <#e8dfd2>— магазины, фермы и постройки, куда можно заглянуть.<newline><#e8dfd2>Доступно: <#ffffff><count><#e8dfd2> · страница <page>/<pages><newline><#e8dfd2>Откройте карточку места и проверьте стоимость перед переходом.'
  warps-empty: '<#e8dfd2>Сейчас нет доступных вам варпов. Закрытые точки в этом списке не показываются.'
  warps-error: '<#ff6b61>Не удалось загрузить варпы.<newline><#e8dfd2>Попробуйте ещё раз или вернитесь к другим телепортациям.'
  warps-retry-label: '<#92bed8>Обновить список'
  warps-refresh-label: '<#92bed8>Вернуться к списку ›'
