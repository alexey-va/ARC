  category-technology-title: '<#f4bd6a>Технологии'
  category-trade-body: '<#f4d87a>Выберите удобный способ торговли.<newline><#e8dfd2>Магазины дают понятные маршруты покупки, быстрая продажа освобождает инвентарь, а аукцион связывает вас с другими игроками.<newline><#86dcf1>Перед подтверждением <#e8dfd2>проверьте предмет, количество и итоговую сумму.'
  category-progress-body: '<#c4abff>Развивайте персонажа в удобном темпе.<newline><#e8dfd2>Ранг показывает общий путь, задания дают короткие цели, работы и навыки растут от привычных действий.'
  category-activities-body: '<#ffb277>Выберите формат под настроение.<newline><#e8dfd2>Для короткой сессии подойдут события, дуэли или паркур; для долгого похода — данжи и фермы.<newline><#f4d87a>Розыгрыши и голосование <#e8dfd2>можно проверить между делом.'
  category-technology-body: '<#85dfc4>Технологии расширяют возможности базы и персонажа.<newline><#e8dfd2>Изучайте механизмы в книге, улучшайте снаряжение, стройте быстрее специальными инструментами и открывайте маунтов.'
