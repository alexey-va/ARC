  favorites-picker-title: '<#f4bd6a>Добавить в избранное'
  favorites-picker-body: '<#e6fff3>Выберите раздел, затем нужное действие.<newline><#969696>В его карточке нажмите «Добавить в избранное».'
  goal-earn-body: '<#e6fff3>Работы платят за игровые действия, а магазины выкупают ресурсы.<newline><#969696>Редкие вещи можно предложить другим игрокам на аукционе.'
  goal-build-body: '<#e6fff3>Сначала защитите место для базы, затем выбирайте материалы и инструменты.<newline><#969696>В технологиях есть механизмы, а в каталоге — дополнительные предметы.'
  goal-explore-body: '<#e6fff3>Выберите мир или готовую точку для путешествия.<newline><#969696>Перед дальней дорогой сохраните дом в разделе «Телепортация».'
  goal-fight-body: '<#e6fff3>Дуэли — для боя с игроком, данжи — для приключений с противниками.<newline><#969696>Условия участия и награды показаны внутри выбранной активности.'
  goal-develop-body: '<#e6fff3>Откройте ранг, чтобы увидеть условия следующего повышения.<newline><#969696>Работы, задания и навыки дают отдельные цели для развития.'
  goal-together-body: '<#e6fff3>Найдите друга в сети: можно написать, позвать к себе или пригласить в приват.<newline><#969696>События и дуэли помогут выбрать совместное занятие.'
  diagnostic-cannot-teleport-help: '<#e6fff3>Не двигайтесь во время отсчёта телепортации.<newline>Проверьте сохранённые дома или отправьте другу новый запрос.<newline><#969696>Если команда отказала, причина будет в последнем сообщении чата.'
  diagnostic-cannot-claim-help: '<#e6fff3>Выберите своё поселение в разделе «Приват».<newline>Проверьте лимит чанков, доступный баланс и права на расширение.<newline><#969696>Чужую территорию занять нельзя. Подробный отказ покажет Lands.'
  diagnostic-cannot-find-player-help: '<#e6fff3>Откройте «Игроки», выберите всю сеть и сбросьте поиск.<newline>Попробуйте часть ника, затем обновите список.<newline><#969696>В списке показаны только игроки онлайн.'
  diagnostic-lost-item-help: '<#e6fff3>Возьмите предмет в основную руку и откройте его карточку.<newline>Для дополнительных предметов доступен рецепт, если его предоставляет каталог.<newline><#969696>Переход в магазин или на аукцион сам по себе ничего не продаёт.'
  diagnostic-command-failed-help: '<#e6fff3>Найдите действие через поиск — там есть описание и точная команда.<newline>Проверьте последнее сообщение чата: в нём может быть причина отказа.<newline><#969696>Недоступный на этом сервере раздел может отсутствовать в каталоге.'
