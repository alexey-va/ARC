# Скрытие и блокировка команд по наследуемым permission-группам.
#
# Игрок получает ограничения группы, когда у него есть arc.command.hide.<group>.
# arc.command.hide.bypass отключает все ограничения для сотрудника.
# /arc commandhide allow|restrict|status управляет прямой выдачей этого bypass
# для точного онлайн-игрока и не трогает чужие LuckPerms nodes;
# право администратора: arc.command.hide.admin.
enabled: true
bypass-permission: "arc.command.hide.bypass"

# Один namespace-шаблон закрывает также namespaced-варианты команды:
# plugins -> bukkit:plugins, paper:plugins и т. п.
strip-command-namespace: true

# Namespaced-дубли (bukkit:plugins, playerwarps:pwarp и т. п.) не показываются
# ограниченным игрокам, но сами команды не блокируются только из-за namespace.
hide-namespaced-roots: true

# До загрузки permissions применяется fail-closed политика обычного игрока.
# После join дерево пересобирается и bypass/другие группы учитываются точно.
default-group: "player"

# Политика игрока обновляется сразу при пересборке command tree; TTL страхует
# изменения permissions, которые не вызвали такую пересборку.
policy-cache: 5s
blocked-message: "<red>Неизвестная команда."

# Шаблон сравнивается без учёта регистра и без начального "/".
#   *  — ровно одно слово
#   ** — ноль или больше оставшихся слов; допустим только последним
#
# Без wildcard совпадение точное. Для всей ветки команды используй "**":
# "plugins **" блокирует /plugins и любое количество аргументов.
groups:
  plugin-list:
    inherits: []
    commands:
      - "plugins **"
      - "pl **"

  player:
    inherits:
      - "plugin-list"
    commands: []
