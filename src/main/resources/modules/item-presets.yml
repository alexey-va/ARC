        amount: 3
  lootbox_bundle:
    description: SF×2, AE×1, enchant×1, potion×1, money tier 4
    items:
      - preset: sf_lootbox
        amount: 2
      - preset: ae_lootbox
        amount: 1
      - preset: enchant_token
        amount: 1
      - preset: potion_token
        amount: 1
      - preset: money_bag
        amount: 1
  lootbox_bundle_large:
    description: SF×N, AE×2, enchant×2, potion×2, money tier 4
    items:
      - preset: sf_lootbox
        amount: scaled
      - preset: ae_lootbox
        amount: 2
      - preset: enchant_token
        amount: 2
      - preset: potion_token
        amount: 2
      - preset: money_bag
