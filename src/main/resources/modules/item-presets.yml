      - '<#8c8c8c>Внутри: <#fff2df>5–6 наград'
      - <#8c8c8c>Усиленные сплавы, генераторы
      - <#8c8c8c>и продвинутые механизмы.
      - ''
      - '<#8c8c8c>[<#5fffd2>▶<#8c8c8c>] <#5fffd2>ПКМ<#b8b8b8> — вскрыть'
    customData:
      slimefun_token: 1
      "arc:treasure_key": sf_advanced
      "arc:treasure_rolls_min": 5
      "arc:treasure_rolls_max": 6
  sf_lootbox_master:
