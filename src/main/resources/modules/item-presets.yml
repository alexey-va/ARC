# =============================================================================
# item-presets.yml — пресеты для /arc give и MCP arc_ops_give_preset.
#
# presets.<id> — ItemSpec (material, display, lore, customModelData, customData, itemsadder, …)
#   description — подсказка в /arc give list (не часть ItemSpec)
# bundles.<id> — набор preset + amount (amount: scaled = масштаб от аргумента команды)
# =============================================================================

presets:
  gui_background:
    description: Фон GUI (серая панель, CMD 11000)
    itemsadder: arc:background
  gui_back:
    description: Кнопка «Назад» (CMD 11013)
    itemsadder: arc:left_gray
  gui_cancel:
    description: Кнопка отмены
    itemsadder: arc:cancel
  gui_confirm:
    description: Кнопка подтверждения
    itemsadder: arc:confirm_gray
  gui_money_icon:
    description: Иконка баланса / мешок монет (CMD 11138)
    itemsadder: iageneric:bag_of_coins
    display: <gold>Монеты
  gold_coin:
    description: Монета IA (CMD 11137)
    itemsadder: iageneric:gold_coin
  bag_of_coins:
    description: Мешок монет IA (CMD 11138)
    itemsadder: iageneric:bag_of_coins
  golden_apple:
    description: Золотое яблоко
    material: GOLDEN_APPLE
  enchanted_golden_apple:
    description: Зачарованное золотое яблоко
    material: ENCHANTED_GOLDEN_APPLE
  totem:
    description: Тотем бессмертия
    material: TOTEM_OF_UNDYING
  ender_pearl:
    description: 16 жемчугов эндера
    material: ENDER_PEARL
    amount: 16
  sf_lootbox:
    description: Базовый физический тайник Slimefun — случайный предмет из полного пула sf
    itemsadder: arc:scifichest_7
    display: <#68f7cf>Тайник инженера Slimefun
    lore:
      - ''
      - <#ffe29a>Базовая инженерная шкатулка.
      - '<#fff2df>Даёт один случайный предмет Slimefun:'
      - <#fff2df>материалы, компоненты, припасы или механизм.
      - ''
      - <#ffd166>ПКМ <#fff2df>— вскрыть контейнер
      - ''
    customData:
      slimefun_token: 1
      "arc:treasure_key": sf
  sf_lootbox_advanced:
    description: Продвинутый тайник Slimefun — один предмет из пула sf_advanced
    itemsadder: arc:scifichest_8
    display: <#5fffd2>Усиленный тайник Slimefun
    lore:
      - ''
      - <#ffe29a>Шкатулка для опытного инженера.
      - <#fff2df>Даёт продвинутый механизм, генератор
      - <#fff2df>или 2–4 усиленных сплава.
      - ''
      - <#ffd166>ПКМ <#fff2df>— вскрыть контейнер
      - ''
    customData:
      slimefun_token: 1
      "arc:treasure_key": sf_advanced
  sf_lootbox_master:
    description: Мастерский тайник Slimefun — один редкий предмет из пула sf_jackpot
    itemsadder: arc:scifichest_10
    display: <#b8ff78>Мастерский тайник Slimefun
    lore:
      - ''
      - <#ffe29a>Редкая шкатулка Гильдии механиков.
      - <#fff2df>Даёт реактор, Cargo Manager, крупный
      - <#fff2df>конденсатор или ценные материалы Slimefun.
      - ''
      - <#ffd166>ПКМ <#fff2df>— вскрыть контейнер
      - ''
    customData:
      slimefun_token: 1
      "arc:treasure_key": sf_jackpot
  ae_lootbox:
    description: Базовая шкатулка AdvancedEnchantments — один случайный расходник из пула ae
    itemsadder: arc:scifichest_4
    display: <#df91ff>Таинственная шкатулка чар
    lore:
      - ''
      - <#fff2df>Даёт один случайный предмет AE.
      - <#fff2df>Может попасться пыль, свиток, сфера,
      - <#fff2df>самоцвет или книга элитных чар.
      - ''
      - <#ffd166>ПКМ <#fff2df>— вскрыть шкатулку
      - ''
    customData:
      ae_token: "true"
      "arc:treasure_key": ae
  ae_lootbox_enchanted:
    description: Зачарованная шкатулка AE — гарантирует одну случайную книгу элитных чар
    itemsadder: arc:scifichest_5
    display: <#e9a8ff>Зачарованная шкатулка AE
    lore:
      - ''
      - <#fff2df>Внутри нет пыли и служебных расходников.
      - <#a6ffce>Гарантирует одну случайную книгу
      - <#a6ffce>AdvancedEnchantments случайного уровня.
      - ''
      - <#ffd166>ПКМ <#fff2df>— вскрыть шкатулку
      - ''
    customData:
      ae_token: "true"
      "arc:treasure_key": ae_enchanted
  ae_lootbox_master:
    description: Мастерская шкатулка AE — гарантирует три случайные книги элитных чар
    itemsadder: arc:scifichest_6
    display: <#ff8edb>Мастерская шкатулка AE
    lore:
      - ''
      - <#fff2df>Высший уровень шкатулки без пыли.
      - <#a6ffce>Гарантирует три случайные книги
      - <#a6ffce>AdvancedEnchantments случайного уровня.
      - ''
      - <#ffd166>ПКМ <#fff2df>— вскрыть шкатулку
      - ''
    customData:
      ae_token: "true"
      "arc:treasure_key": ae_master
  enchant_token:
    description: Токен зачарования (vanilla book pool)
    material: IRON_INGOT
    customModelData: 12013
    display: <yellow>Токен зачарования
    lore:
      - ''
      - <#fff2df>Даёт одну случайную ванильную книгу чар.
      - <#ffd166>ПКМ <#fff2df>— использовать токен
      - ''
    customData:
      enchant_token: "true"
      "arc:treasure_key": vanillaenchant
  potion_token:
    description: Токен зелья
    material: IRON_INGOT
    customModelData: 12032
    display: <yellow>Токен зелья
    lore:
      - ''
      - <#fff2df>Даёт одно случайное ванильное зелье.
      - <#ffd166>ПКМ <#fff2df>— использовать токен
      - ''
    customData:
      potion_token: "true"
      "arc:treasure_key": vanillapotion
  money_handful:
    description: Горсть монет (tier 1)
    itemsadder: iageneric:bronze_coin
    display: <#d69b62>Бронзовая горсть
    lore:
      - ''
      - '<#fff2df>Случайная выплата: обычно около 2 000 монет.'
      - <#fff2df>Минимум — 500 монет.
      - <#ffd166>ПКМ <#fff2df>— пересчитать и зачислить
      - ''
    customData:
      "arc:treasure_key": smallmoney
      money_token_mean: 2000
      money_token_sigma: 500
      money_token_minimum: 500
  money_pile:
    description: Кучка монет (tier 2)
    itemsadder: iageneric:silver_coin
    display: <#d7e4ee>Серебряная кучка
    lore:
      - ''
      - '<#fff2df>Случайная выплата: обычно около 6 500 монет.'
      - <#fff2df>Минимум — 3 000 монет.
      - <#ffd166>ПКМ <#fff2df>— пересчитать и зачислить
      - ''
    customData:
      "arc:treasure_key": mediummoney
      money_token_mean: 6500
      money_token_sigma: 2000
      money_token_minimum: 3000
  money_heap:
    description: Куча монет (tier 3)
    itemsadder: iageneric:gold_coin
    display: <#ffd567>Золотая куча
    lore:
      - ''
      - '<#fff2df>Случайная выплата: обычно около 10 000 монет.'
      - <#fff2df>Минимум — 5 000 монет.
      - <#ffd166>ПКМ <#fff2df>— пересчитать и зачислить
      - ''
    customData:
      "arc:treasure_key": bigmoney
      money_token_mean: 10000
      money_token_sigma: 3000
      money_token_minimum: 5000
  money_bag:
    description: Мешок монет (tier 4)
    itemsadder: iageneric:bag_of_coins
    display: <#ff9f63>Купеческий мешок
    lore:
      - ''
      - '<#fff2df>Случайная выплата: обычно около 15 000 монет.'
      - <#fff2df>Минимум — 7 500 монет.
      - <#ffd166>ПКМ <#fff2df>— развязать и зачислить
      - ''
    customData:
      "arc:treasure_key": hugemoney
      money_token_mean: 15000
      money_token_sigma: 5000
      money_token_minimum: 7500

bundles:
  enchant_tokens_3:
    description: Три токена случайных ванильных зачарований
    items:
      - preset: enchant_token
        amount: 3
  potion_tokens_3:
    description: Три токена случайных ванильных зелий
    items:
      - preset: potion_token
        amount: 3
  lootbox_bundle:
    description: SF×2, AE×1, enchant×1, potion×1, money tier 4
    items:
      - preset: sf_lootbox
        amount: 2
      - preset: ae_lootbox
        amount: 1
      - preset: enchant_token
        amount: 1
      - preset: potion_token
        amount: 1
      - preset: money_bag
        amount: 1
  lootbox_bundle_large:
    description: SF×N, AE×2, enchant×2, potion×2, money tier 4
    items:
      - preset: sf_lootbox
        amount: scaled
      - preset: ae_lootbox
        amount: 2
      - preset: enchant_token
        amount: 2
      - preset: potion_token
        amount: 2
      - preset: money_bag
        amount: 1
