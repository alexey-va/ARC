# ARC Builder Tools. Runtime mirrors opt in explicitly; disabled elsewhere by default.
enabled: false
allowed-worlds: []
default-locale: ru

limits:
  max-changes: 4096
  max-clipboard-blocks: 4096
  max-scan-volume: 8192
  absolute-max-axis: 48
  blocks-per-tick: 16
  base-hourly-changes: 20000
  maximum-range: 64

timers:
  plan-ttl: 30s
  clipboard-ttl: 15m
  undo-ttl: 30m
  journal-retention: 2h

preview:
  # Refresh twice per second, matching the persistent feel of the old Denizen outline.
  period-ticks: 10
  radius: 32
  outline-spacing: 0.75
  max-selection-particles: 512
  max-plan-particles: 180

# Read-only estimates and explicit procurement through EconomyShopGUI Premium.
# A normal /builder confirm never spends money.
shop:
  enabled: true
  max-quoted-materials: 64
  max-auto-buy-items: 4096
  max-auto-buy-price: 250000

# Player-authored build books: free drafts, explicit paid activation and paid copies.
# Shop prices are read-only; the stored self-cost never rewrites EconomyShopGUI.
book-contracts:
  enabled: false
  construction-markup-percent: 15.0
  max-issue-price: 50000000
  mysql:
    enabled: false
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: minecraft
    password: ''
    ssl-mode: DISABLED
    fail-fast: false
    pool:
      minimum-idle: 0
      maximum-size: 4
      connection-timeout-ms: 5000
      socket-timeout-ms: 15000
      validation-timeout-ms: 3000
      max-lifetime-ms: 1700000

safety:
  require-lands: true
  require-coreprotect: true
  # Filling and pasting may replace only non-valuable vegetation/air.
  replaceable-materials:
    - AIR
    - CAVE_AIR
    - VOID_AIR
    - SHORT_GRASS
    - TALL_GRASS
    - FERN
    - LARGE_FERN
    - DEAD_BUSH
    - VINE
    - GLOW_LICHEN
    - SNOW

locales:
  ru:
    prefix: "<#92bed8>◇ "
    help:
      - "<prefix><#e6fff3>Инструменты строителя"
      - "<#8c8c8c>  • <#92bed8>/builder wand <#e6fff3>— выделить область"
      - "<#8c8c8c>  • <#92bed8>/builder fill [блок] <#e6fff3>— заполнить пустоты"
      - "<#8c8c8c>  • <#92bed8>/builder copy <#e6fff3>и <#92bed8>/builder paste <#e6fff3>— временный чертёж"
      - "<#8c8c8c>  • <#92bed8>/builder book draft [имя] <#e6fff3>— бесплатный черновик"
      - "<#8c8c8c>  • <#92bed8>/builder book activate <#e6fff3>— рассчитать цену активации"
      - "<#8c8c8c>  • <#92bed8>/builder book copy <#e6fff3>— платная копия активной книги"
      - "<#8c8c8c>  • <#92bed8>/builder book <#e6fff3>— пошаговая инструкция и текущий этап"
      - "<#8c8c8c>  • <#92bed8>/builder clear <#e6fff3>— убрать выделение и его частицы"
      - "<#8c8c8c>  • <#92bed8>/builder deconstruct <#e6fff3>— разобрать область"
      - "<#8c8c8c>  • <#92bed8>/builder crown <#e6fff3>— создать крону"
      - "<#8c8c8c>  • <#92bed8>/builder confirm <#e6fff3>— применить показанный план"
      - "<#8c8c8c>  • <#92bed8>/builder confirm buy <#e6fff3>— докупить недостающее"
      - "<#8c8c8c>  • <#92bed8>/builder undo <#e6fff3>— подготовить отмену"
