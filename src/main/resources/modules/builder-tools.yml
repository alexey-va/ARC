# ARC Builder Tools. Runtime mirrors opt in explicitly; disabled elsewhere by default.
enabled: false
allowed-worlds: []
default-locale: ru

limits:
  max-changes: 4096
  max-clipboard-blocks: 4096
  max-scan-volume: 8192
  absolute-max-axis: 48
  blocks-per-tick: 16
  base-hourly-changes: 20000
  maximum-range: 64

timers:
  plan-ttl: 30s
  clipboard-ttl: 15m
  undo-ttl: 30m
  journal-retention: 2h

preview:
  # Refresh twice per second, matching the persistent feel of the old Denizen outline.
  period-ticks: 10
  radius: 32
  outline-spacing: 0.75
  max-selection-particles: 512
  max-plan-particles: 180

# Read-only estimates and explicit procurement through EconomyShopGUI Premium.
# A normal /builder confirm never spends money.
shop:
  enabled: true
  max-quoted-materials: 64
  max-auto-buy-items: 4096
  max-auto-buy-price: 250000
  price-increase-tolerance: 0.01

safety:
  require-lands: true
  require-coreprotect: true
  # Filling and pasting may replace only non-valuable vegetation/air.
  replaceable-materials:
    - AIR
    - CAVE_AIR
    - VOID_AIR
    - SHORT_GRASS
    - TALL_GRASS
    - FERN
    - LARGE_FERN
    - DEAD_BUSH
    - VINE
    - GLOW_LICHEN
    - SNOW

