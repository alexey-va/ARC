    tooltip: "<#e8dfd2>Открыть RTP, дома и территории.</#e8dfd2>"
  rtp:
    label: "<#92bed8>Случайная телепортация ›</#92bed8>"
    tooltip: "<#e8dfd2>Найти безопасное место в мире Slimefun.</#e8dfd2>"
  homes:
    label: "<#92bed8>Мои дома ›</#92bed8>"
    tooltip: "<#e8dfd2>Посмотреть и выбрать сохранённый дом.</#e8dfd2>"
  lands:
    label: "<#9bd48d>Мои земли ›</#9bd48d>"
    tooltip: "<#e8dfd2>Управлять территориями и участками.</#e8dfd2>"
  team:
    label: "<#ffffff>Команды JustTeams ›</#ffffff>"
    tooltip: "<#e8dfd2>Открыть общее меню команд.</#e8dfd2>"

guide:
  title: "<#85dfc4>Путь технологий</#85dfc4>"
  body: "<#e8dfd2>1. Создайте остров и начните с доступных базовых ресурсов.</#e8dfd2>"
  progression: "<#85dfc4>2. Откройте гайд Slimefun: изучите базовые рецепты и многоблочные механизмы.\n3. Собирайте ресурсы на острове, а нужные материалы приобретайте за слаймы в местном магазине.</#85dfc4>"
  catalog:
    label: "<#85dfc4>Открыть гайд Slimefun ›</#85dfc4>"
    tooltip: "<#e8dfd2>Открыть каталог предметов и рецептов.</#e8dfd2>"

visit:
  title: "<#92bed8>Посещение острова</#92bed8>"
  body: "<#e8dfd2>Укажите имя игрока, чей остров хотите посетить.</#e8dfd2>"
  player-input: "<#e8dfd2>Имя игрока</#e8dfd2>"
  submit:
    label: "<#92bed8>Найти остров ›</#92bed8>"
    tooltip: "<#e8dfd2>Найти остров игрока по имени.</#e8dfd2>"
  invalid-body: "<#e8dfd2>Проверьте имя: 3–16 букв, цифр или символов _. Исправьте значение и попробуйте снова.</#e8dfd2>"

services:
  title: "<#ffffff>Сервисы Slimefun</#ffffff>"
  body: "<#e8dfd2>Полезные команды этого мира.</#e8dfd2>"

spawn:
  unavailable: "<#e8dfd2>Сейчас не удалось отправить вас на сетевой спавн.</#e8dfd2>"
