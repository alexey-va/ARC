title: "<#e6bc76>Остров и Слаймфан</#e6bc76>"
intro: "<#e8dfd2>SkyBlock, развитие острова и мир технологий Slimefun.</#e8dfd2>"
unavailable: "<#e8dfd2>Сервис временно недоступен. Попробуйте позже.</#e8dfd2>"
usage: "<#e8dfd2>Использование: /skyblock [guide|shop|hub|spawn]</#e8dfd2>"

state:
  own-island: "<#92bed8>Ваш остров: управление и команда.</#92bed8>"
  no-island: "<#e8dfd2>Остров ещё не создан — начните с создания.</#e8dfd2>"
  unavailable: "<#e8dfd2>Данные SkyBlock сейчас недоступны.</#e8dfd2>"

hub:
  world: "slimefun_hub"
  x: 172.5
  y: 70.0
  z: 220.5
  yaw: 180.0
  pitch: 0.0

# Canonical network /spawn currently resolves PlayerWarps warp spawn on Origin.
network-spawn:
  server: spawn
  world: rc_origin_spawn
  x: 0.0
  y: 71.0
  z: 0.0
  yaw: 0.0
  pitch: 0.0

starter-islands: [normal, mycel, desert]
starters:
  normal:
    label: "<#9bd48d>Лесной остров ›</#9bd48d>"
    tooltip: "<#e8dfd2>Спокойный старт в зелёном мире.</#e8dfd2>"
  mycel:
    label: "<#9bd48d>Грибной остров ›</#9bd48d>"
    tooltip: "<#e8dfd2>Необычная природа и простор для развития.</#e8dfd2>"
  desert:
    label: "<#9bd48d>Пустынный остров ›</#9bd48d>"
    tooltip: "<#e8dfd2>Открытый сухой биом для нового старта.</#e8dfd2>"

buttons:
  create:
    label: "<#c4a7e7>Создать остров ›</#c4a7e7>"
    tooltip: "<#e8dfd2>Начать путь на своём острове.</#e8dfd2>"
  home:
    label: "<#92bed8>Домой на остров ›</#92bed8>"
    tooltip: "<#e8dfd2>Перейти на свой остров.</#e8dfd2>"
  manage:
    label: "<#c4a7e7>Управление островом ›</#c4a7e7>"
    tooltip: "<#e8dfd2>Открыть настройки и инструменты острова.</#e8dfd2>"
  island-team:
    label: "<#9bd48d>Команда острова ›</#9bd48d>"
    tooltip: "<#e8dfd2>Посмотреть участников и доступные действия.</#e8dfd2>"
  visitors:
    label: "<#9bd48d>Посетители ›</#9bd48d>"
    tooltip: "<#e8dfd2>Настроить доступ посетителей к острову.</#e8dfd2>"
  settings:
    label: "<#c4a7e7>Настройки острова ›</#c4a7e7>"
    tooltip: "<#e8dfd2>Изменить доступные настройки острова.</#e8dfd2>"
  biome:
    label: "<#9bd48d>Биом острова ›</#9bd48d>"
    tooltip: "<#e8dfd2>Открыть выбор биома острова.</#e8dfd2>"
  top:
    label: "<#9bd48d>Рейтинг островов ›</#9bd48d>"
    tooltip: "<#e8dfd2>Посмотреть рейтинг островов.</#e8dfd2>"
  visit:
    label: "<#92bed8>Посетить остров ›</#92bed8>"
    tooltip: "<#e8dfd2>Ввести имя игрока для посещения острова.</#e8dfd2>"
  guide:
    label: "<#85dfc4>Гайд Slimefun ›</#85dfc4>"
    tooltip: "<#e8dfd2>Открыть шаги технологического развития.</#e8dfd2>"
  shop:
    label: "<#f4d87a>Магазин ресурсов ›</#f4d87a>"
    tooltip: "<#e8dfd2>Покупать ресурсы для Slimefun.</#e8dfd2>"
  hub:
    label: "<#92bed8>Хаб SkyBlock ›</#92bed8>"
    tooltip: "<#e8dfd2>Перейти в локальный хаб этого сервера.</#e8dfd2>"
  network-spawn:
