# ARC owns the interactive meals in both Origin restaurants.
# Run /arc reload after editing this file; no server restart is required.

placement:
  # Every dish starts exactly at the center of the block directly in front of
  # the seated player. These values only provide intentional fine tuning.
  forward-blocks: 1.0
  vertical-offset-blocks: 0.0
  tables:
    brewery_south_west:
      seat: "-7.5,70.0,37.5,-90"
      clicked-block: "-8,70,37"
      waiter-stop: "-7.5,70.0,38.5,0"
      waiter-id: 410
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    brewery_south_east:
      seat: "-3.5,70.0,37.5,90"
      clicked-block: "-4,70,37"
      waiter-stop: "-3.5,70.0,38.5,180"
      waiter-id: 410
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    brewery_fire:
      seat: "-8.5,70.0,48.5,180"
      clicked-block: "-9,70,48"
      waiter-stop: "-6.5,70.0,48.5,90"
      waiter-id: 411
      height-above-seat: 0.75
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    brewery_west:
      seat: "-13.5,70.0,53.5,90"
      clicked-block: "-14,70,53"
      waiter-stop: "-13.5,70.0,55.5,180"
      waiter-id: 411
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    restaurant_a:
      seat: "-54.5,72.0,48.5,180"
      clicked-block: "-55,72,48"
      waiter-stop: "-52.5,72.0,46.5,180"
      waiter-id: 431
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    restaurant_b:
      seat: "-47.5,72.0,52.5,180"
      clicked-block: "-48,72,52"
      waiter-stop: "-50.5,72.0,50.5,180"
      waiter-id: 432
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0

display:
  # Culling bounds only affect visibility, not the model's physical size.
  view-range: 2.0
  culling-width: 4.0
  culling-height: 4.0
  # surface-lift values come from the actual ItemsAdder model bounds with the
  # GROUND transform and leave a 0.04 block clearance above the table.
  dishes:
    egg:
      scale: 0.65
      surface-lift: 0.12125
    fish:
      scale: 0.65
      surface-lift: 0.12125
    steak:
      scale: 1.3
      surface-lift: 0.2025
    herbal_tea:
      scale: 0.65
      surface-lift: 0.0205
    berry_kvass:
      scale: 0.65
      surface-lift: 0.0205
    spiced_mead:
      scale: 0.65
      surface-lift: 0.0205

interaction:
  meal-hitbox-size: 1.8
  meal-hitbox-y-offset: -0.15

timing:
  delivery-fallback-ticks: 20
  service-pause-ticks: 12
  next-delivery-ticks: 10
  waiter-poll-ticks: 10
  waiter-max-polls: 20
  delivery-route-max-polls: 30
  ambient-route-max-polls: 36
  waiter-return-release-ticks: 120
  progress-log-every-polls: 4
  theft-cooldown-seconds: 90
  session-ttl-seconds: 300
  dialog-authorization-seconds: 60
  ambient-dialogue-seconds: 42
  ambient-retry-seconds: 5
  guest-reconcile-seconds: 5

navigation:
  waiter-ready-margin: 1.5
  waiter-player-range: 2.8
  session-radius: 8.0

seating:
  guest-marker-lift: 0.6
  guest-entity-lift: 0.4

dynamic-seats:
  # Любая нижняя ступенька внутри территории пивоварни или ресторана становится
  # местом для игрока. Если перед ней нет блока/стола, открывается меню напитков,
  # а купленная бутылка выдаётся в инвентарь.
  table-height-above-seat: 1.1
  dish-offset-x: 0.0
  dish-offset-y: 0.0
  dish-offset-z: 0.0
  waiter-side-offset: 1.5

# Все координаты двух ресторанных сцен находятся здесь и перечитываются через
# /arc reload. Формат точки: x,y,z,yaw. Формат блока: x,y,z.
