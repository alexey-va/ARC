    restaurant_b_north:
      guest-id: 436
      waiter-id: 432
      meal: "-47.5,73.1,49.8,0"
      waiter-stop: "-50.5,72.0,50.5,180"
      transit: "-50.5,72.0,53.5,180"
  dialogue-ids: [brewery_north, brewery_fire, restaurant_a, restaurant_b, restaurant_bar]
  dialogues:
    brewery_north:
      first-npc-id: 416
      second-npc-id: 417
      first-line: "Пена сегодня держится."
      second-line: "Значит, бочка не зря стояла всю ночь."
    brewery_fire:
      first-npc-id: 407
      second-npc-id: 408
      first-line: "А к рыбе что посоветуешь?"
      second-line: "Светлое. И хлеб не забудь."
    restaurant_a:
      first-npc-id: 433
      second-npc-id: 434
      first-line: "Тихо сегодня. Слышно, как кипит кухня."
      second-line: "Значит, повар не спорит с огнём."
    restaurant_b:
      first-npc-id: 435
      second-npc-id: 436
      first-line: "После обеда выйдем к фонтану?"
      second-line: "Если официант не найдёт ещё одну работу."
    restaurant_bar:
      first-npc-id: 439
      second-npc-id: 431
      first-line: "Аня, на второй стол новое блюдо."
      second-line: "Уже несу. Марек пусть проверит напитки."
