# ARC owns the interactive meals in both Origin restaurants.
# Run /arc reload after editing this file; no server restart is required.

placement:
  # Every dish starts exactly at the center of the block directly in front of
  # the seated player. These values only provide intentional fine tuning.
  forward-blocks: 1.0
  vertical-offset-blocks: 0.0
  tables:
    brewery_south_west:
      seat: "-7.5,70.0,37.5,-90"
      clicked-block: "-8,70,37"
      waiter-stop: "-7.5,70.0,38.5,0"
      waiter-id: 410
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    brewery_south_east:
      seat: "-3.5,70.0,37.5,90"
      clicked-block: "-4,70,37"
      waiter-stop: "-3.5,70.0,38.5,180"
      waiter-id: 410
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    brewery_fire:
      seat: "-8.5,70.0,48.5,180"
      clicked-block: "-9,70,48"
      waiter-stop: "-6.5,70.0,48.5,90"
      waiter-id: 411
      height-above-seat: 0.75
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    brewery_west:
      seat: "-13.5,70.0,53.5,90"
      clicked-block: "-14,70,53"
      waiter-stop: "-13.5,70.0,55.5,180"
      waiter-id: 411
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    restaurant_a:
      seat: "-54.5,72.0,48.5,180"
      clicked-block: "-55,72,48"
      waiter-stop: "-52.5,72.0,46.5,180"
      waiter-id: 431
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
    restaurant_b:
      seat: "-47.5,72.0,52.5,180"
      clicked-block: "-48,72,52"
      waiter-stop: "-50.5,72.0,50.5,180"
      waiter-id: 432
      height-above-seat: 1.1
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0

display:
  # Culling bounds only affect visibility, not the model's physical size.
  view-range: 2.0
  culling-width: 4.0
  culling-height: 4.0
  # surface-lift values come from the actual ItemsAdder model bounds with the
  # GROUND transform and leave a 0.04 block clearance above the table.
  dishes:
    egg:
      scale: 0.65
      surface-lift: 0.28375
    fish:
      scale: 0.65
      surface-lift: 0.12125
    steak:
      scale: 0.65
      surface-lift: 0.28375
    herbal_tea:
      scale: 0.65
      surface-lift: 0.24475
    berry_kvass:
      scale: 0.65
      surface-lift: 0.24475
    spiced_mead:
      scale: 0.65
      surface-lift: 0.24475

interaction:
  meal-hitbox-size: 1.8
  meal-hitbox-y-offset: -0.15
  waiter-hitbox-width: 1.4
  waiter-hitbox-height: 2.2

timing:
  delivery-fallback-ticks: 20
  service-pause-ticks: 12
  next-delivery-ticks: 10
  waiter-poll-ticks: 10
  waiter-max-polls: 20
  delivery-route-max-polls: 30
  ambient-route-max-polls: 36
  waiter-return-release-ticks: 120
  progress-log-every-polls: 4
  theft-cooldown-seconds: 90
  session-ttl-seconds: 300
  dialog-authorization-seconds: 60
  ambient-dialogue-seconds: 42
  ambient-retry-seconds: 5
  guest-reconcile-seconds: 5
  # Each waiter pauses after serving before starting another ambient table route.
  ambient-waiter-rest-seconds: 7

navigation:
  waiter-ready-margin: 2.25
  # Must stay within normal survival entity-interaction reach.
  waiter-player-range: 1.8
  distance-margin: 0.35
  path-distance-margin: 0.35
  # ARC builds a bounded four-way path only through safe cells on this floor,
  # then gives Citizens the complete prepared route. Tables and chairs can
  # therefore never become route shortcuts.
  grid-max-visited: 1024
  grid-poll-ticks: 2
  grid-stall-polls: 20
  grid-snap-radius: 3
  grid-off-floor-tolerance: 0.45
  # Profiles bound every route to its venue. Add hard no-go rectangles to
  # forbidden-areas and cheap preferred corridors to preferred-areas. Code may
  # also supply ordered via points when an NPC must pass through exact gates.
  # Rectangle format: min-x,min-z,max-x,max-z.
  route-profile-ids: [brewery, restaurant]
  route-profiles:
    brewery:
      floor-y: 70
      min-block: "-22,70,35"
      max-block: "4,70,64"
      forbidden-areas: []
      preferred-areas: []
      # Extra clearance around ItemsAdder furniture converted to blocked cells.
      entity-obstacle-padding: 0.25
      obstacle-refresh-polls: 10
      heading-look-ahead-cells: 2
      heading-update-ticks: 1
      heading-max-turn-degrees-per-tick: 18.0
      corner-smoothing-distance: 0.75
      corner-smoothing-lead: 0.30
      maximum-step-height: 0.125
      speed-modifier: 0.72
    restaurant:
      floor-y: 72
      min-block: "-61,72,40"
      max-block: "-40,72,62"
      forbidden-areas: []
      preferred-areas: []
      entity-obstacle-padding: 0.25
      obstacle-refresh-polls: 10
      heading-look-ahead-cells: 2
      heading-update-ticks: 1
      heading-max-turn-degrees-per-tick: 18.0
      corner-smoothing-distance: 0.75
      corner-smoothing-lead: 0.30
      maximum-step-height: 0.125
      speed-modifier: 0.72
  session-radius: 8.0

seating:
  guest-marker-lift: 0.6
  guest-entity-lift: 0.4
  # ARC starts service only after the chair plugin has actually mounted the player.
  confirm-delay-ticks: 2
  confirm-max-polls: 3
  confirm-horizontal-radius: 1.0

dynamic-seats:
  # Любая нижняя ступенька внутри территории пивоварни или ресторана становится
  # местом для игрока. Если перед ней нет блока/стола, открывается меню напитков,
  # а купленная бутылка выдаётся в инвентарь.
  table-height-above-seat: 1.1
  dish-offset-x: 0.0
  dish-offset-y: 0.0
  dish-offset-z: 0.0
  waiter-side-offset: 1.0
  # Для ItemsAdder-мебели направление сначала определяется по соседнему столу.
  # yaw-offset используется как резерв, а смещения задаются в локальных осях модели.
  furniture-profile-ids: [wooden_chairs]
  furniture-profiles:
    wooden_chairs:
      ids:
        - "furnituresplus:red_wooden_chair"
        - "furnituresplus:white_wooden_chair"
        - "furnituresplus:cyan_wooden_chair"
        - "furnituresplus:gray_wooden_chair"
        - "furnituresplus:iron_chair"
        - "furnituresplus:amethyst_chair"
      yaw-offset: 180.0
      offset-x: 0.0
      offset-y: 0.0
      offset-z: 0.0
      require-table: true

# Все координаты двух ресторанных сцен находятся здесь и перечитываются через
# /arc reload. Формат точки: x,y,z,yaw. Формат блока: x,y,z.
scene:
  ambient-cycle-seconds: 8
  ambient-routes-per-cycle: 4
  # ARC ищет обычные нижние ступеньки со столом в соседнем блоке, рассаживает
  # этих посетителей ближе к их резервным точкам и сохраняет места для игроков.
  auto-seating:
    zone-ids: [brewery, restaurant]
    zones:
      brewery:
        guest-ids: ["416", "417", "418", "419", "420"]
        min-block: "-19,70,39"
        max-block: "-1,70,54"
        load-chunks: true
        minimum-free-seats: 3
        excluded-blocks: []
      restaurant:
        guest-ids: ["433", "434", "435", "436"]
        min-block: "-58,72,43"
        max-block: "-43,72,53"
        load-chunks: true
        minimum-free-seats: 2
        excluded-blocks: []
  # Одноразово заменяет старую раскладку и barrier-маркеры обычными ступеньками.
  seat-layout-version: 3
  authored-seat-ids: []
  authored-seat-points:
    - "-16.5,70.0,40.5,-90"
    - "-14.5,70.0,40.5,90"
    - "-16.5,70.0,47.5,-90"
    - "-14.5,70.0,47.5,90"
    - "-2.5,70.0,47.5,180"
    - "-2.5,70.0,45.5,0"
    - "-13.5,70.0,53.5,90"
    - "-15.5,70.0,53.5,-90"
  retired-seat-blocks:
    - "-18,70,40"
    - "-14,70,40"
    - "-18,70,47"
    - "-14,70,47"
    - "-3,70,48"
    - "-3,70,44"
  cleanup-points:
    - "-0.5,72.4,53.5,0" # бывшая реплика удалённой Тэссы
  legacy-furniture-cleanup:
    ids:
      - "elitecreatures:restaurant_food_steak"
      - "elitecreatures:medieval_market_decoration_v2_table_2"
    points:
      - "-15.5,71.1,47.5,180"
      - "-15.5,70.001,40.5,0"
      - "-15.5,70.001,47.5,0"
      - "-2.5,70.001,46.5,0"
      - "-4.5,70.001,37.5,0"
  legacy-player-table:
    meal-hitbox: "-5.5,70.95,37.9,0"
    meal-display: "-5.5,71.1,37.9,0"
    order-label: "-5.5,72.35,37.5,0"
  guest-ids: ["407", "408", "416", "417", "418", "419", "420", "433", "434", "435", "436"]
  guests:
    407: {seat: "-10.5,70.0,45.5,-90"}
    408: {seat: "-6.5,70.0,45.5,90"}
    416: {seat: "-16.5,70.0,40.5,-90"}
    417: {seat: "-14.5,70.0,40.5,90"}
    418: {seat: "-16.5,70.0,47.5,-90"}
    419: {seat: "-2.5,70.0,47.5,180"}
    420: {seat: "-2.5,70.0,45.5,0"}
    433: {seat: "-56.5,72.0,46.5,-90"}
    434: {seat: "-54.5,72.0,44.5,0"}
    435: {seat: "-45.5,72.0,50.5,90"}
    436: {seat: "-47.5,72.0,48.5,0"}
  waiters:
    410: {home: "1.5,70.0,57.5,180"}
    411: {home: "-1.5,70.0,60.5,180"}
    431: {home: "-54.5,72.0,56.5,180"}
    432: {home: "-54.5,72.0,58.5,180"}
  ambient-table-ids:
    - brewery_north
    - brewery_south
    - brewery_east
    - restaurant_a_west
    - restaurant_a_north
    - restaurant_b_east
    - restaurant_b_north
  ambient-tables:
    brewery_north:
      guest-id: 416
      waiter-id: 410
      meal: "-15.5,71.1,40.5,0"
      waiter-stop: "-15.5,70.0,42.5,0"
    brewery_south:
      guest-id: 418
      waiter-id: 410
      meal: "-15.5,71.1,47.5,0"
      waiter-stop: "-15.5,70.0,45.5,180"
    brewery_east:
      guest-id: 419
      waiter-id: 411
      meal: "-2.5,71.1,46.5,0"
      waiter-stop: "-4.5,70.0,48.5,90"
    restaurant_a_west:
      guest-id: 433
      waiter-id: 431
      meal: "-55.2,73.1,46.5,0"
      waiter-stop: "-52.5,72.0,46.5,180"
      transit: "-50.5,72.0,49.5,180"
    restaurant_a_north:
      guest-id: 434
      waiter-id: 431
      meal: "-54.5,73.1,45.8,0"
      waiter-stop: "-52.5,72.0,46.5,180"
      transit: "-50.5,72.0,49.5,180"
    restaurant_b_east:
