    meal-display: "-5.5,71.1,37.9,0"
    order-label: "-5.5,72.35,37.5,0"
  guest-ids: ["407", "408", "416", "417", "418", "419", "420", "433", "434", "435", "436"]
  guests:
    407: {seat: "-10.5,70.0,45.5,-90"}
    408: {seat: "-6.5,70.0,45.5,90"}
    416: {seat: "-16.5,70.0,40.5,-90"}
    417: {seat: "-14.5,70.0,40.5,90"}
    418: {seat: "-16.5,70.0,47.5,-90"}
    419: {seat: "-2.5,70.0,47.5,180"}
    420: {seat: "-2.5,70.0,45.5,0"}
    433: {seat: "-56.5,72.0,46.5,-90"}
    434: {seat: "-54.5,72.0,44.5,0"}
    435: {seat: "-45.5,72.0,50.5,90"}
    436: {seat: "-47.5,72.0,48.5,0"}
  waiters:
    410: {home: "1.5,70.0,57.5,180"}
    411: {home: "-1.5,70.0,60.5,180"}
    431: {home: "-51.5,72.0,56.5,63.434948"}
    432: {home: "-51.5,72.0,58.5,116.56505"}
  ambient-table-ids:
    - brewery_north
    - brewery_south
    - brewery_east
    - restaurant_a_west
    - restaurant_a_north
    - restaurant_b_east
    - restaurant_b_north
  ambient-tables:
    brewery_north:
      guest-id: 416
      waiter-id: 410
      meal: "-15.5,71.0,40.5,0"
      waiter-stop: "-15.5,70.0,42.5,0"
    brewery_south:
      guest-id: 418
      waiter-id: 410
      meal: "-15.5,71.0,47.5,0"
      waiter-stop: "-15.5,70.0,45.5,180"
    brewery_east:
      guest-id: 419
      waiter-id: 411
      meal: "-2.5,71.0,46.5,0"
      waiter-stop: "-4.5,70.0,48.5,90"
    restaurant_a_west:
      guest-id: 433
      waiter-id: 431
      meal: "-55.2,73.0,46.5,0"
      waiter-stop: "-52.5,72.0,46.5,180"
      transit: "-50.5,72.0,49.5,180"
    restaurant_a_north:
      guest-id: 434
      waiter-id: 431
      meal: "-54.5,73.0,45.8,0"
      waiter-stop: "-52.5,72.0,46.5,180"
      transit: "-50.5,72.0,49.5,180"
    restaurant_b_east:
      guest-id: 435
      waiter-id: 432
      meal: "-46.8,73.0,50.5,0"
      waiter-stop: "-50.5,72.0,50.5,180"
      transit: "-50.5,72.0,53.5,180"
    restaurant_b_north:
      guest-id: 436
      waiter-id: 432
      meal: "-47.5,73.0,49.8,0"
      waiter-stop: "-50.5,72.0,50.5,180"
      transit: "-50.5,72.0,53.5,180"
  dialogue-ids:
    - brewery_north_creeper
    - brewery_north_redstone
    - brewery_north_nether
    - brewery_north_villager
    - brewery_north_warden
    - brewery_north_first_night
    - brewery_fire_minecart
    - brewery_fire_ender
    - brewery_fire_archaeology
    - brewery_fire_potions
    - brewery_fire_netherite
    - brewery_fire_raid
    - brewery_east_creeper
    - brewery_east_redstone
    - brewery_east_nether
    - brewery_east_villager
    - brewery_east_warden
    - brewery_east_first_night
    - restaurant_a_minecart
    - restaurant_a_ender
    - restaurant_a_archaeology
    - restaurant_a_potions
    - restaurant_a_netherite
    - restaurant_a_raid
    - restaurant_b_creeper
    - restaurant_b_redstone
    - restaurant_b_nether
    - restaurant_b_villager
    - restaurant_b_warden
    - restaurant_b_first_night
  dialogues:
    brewery_north_creeper:
      first-npc-id: 416
      second-npc-id: 417
      lines:
        - "Вчера крипер подошёл к двери совсем тихо."
        - "Тихо? Он шипел так, будто просил добавки."
        - "Я успел закрыть ставни и убрать бочки."
        - "А я успел спрятать только свой суп."
        - "Зато после взрыва у нас появилось окно."
        - "И вид на яму. Очень просторный зал."
        - "Сегодня поставим фонари и кошку у входа."
        - "Кошка? Она встретит гостей лучше сторожа."
    brewery_north_redstone:
      first-npc-id: 416
      second-npc-id: 417
      lines:
        - "Я понял, зачем компаратору три огонька."
        - "Чтобы отличать умный механизм от громкого."
        - "Хоппер подаёт зерно ровно к обеду."
        - "Если один предмет не встанет поперёк."
        - "Я собрал фильтр из воронок и сундуков."
        - "Теперь кухня работает как редстоуновые часы."
        - "Только не дёргай рычаг у печи."
        - "Не дёрну. Запишу его как острый соус."
    brewery_north_nether:
      first-npc-id: 416
      second-npc-id: 417
      lines:
        - "В Нижний мир за солью ходил?"
        - "Ходил. Вернулся с солью, лавой и страхом."
        - "Гасты снова пели над мостом?"
        - "Пели. Один даже попал в такт порталу."
        - "Зато бородавка выросла, зелья будут бодрее."
        - "Главное, не перепутать её с гарниром."
        - "Я подписал сундуки большими буквами."
        - "В Нижнем мире большие буквы тоже горят."
    brewery_north_villager:
      first-npc-id: 416
      second-npc-id: 417
      lines:
        - "Житель сегодня поднял цену на хлеб."
        - "Он увидел, как ты торгуешься с крестьянами."
        - "Я предложил изумруд и добрый взгляд."
        - "Добрый взгляд у тебя похож на разбойничий."
        - "Зато библиотекарь дал книгу про починку."
        - "Теперь нужен ещё один изумруд на ремонт."
        - "Мир спасает не меч, а удачная скидка."
        - "Тише. Услышит — снова поднимет цену."
    brewery_north_warden:
      first-npc-id: 416
      second-npc-id: 417
      lines:
        - "В шахте нашёл скалк у старого тоннеля."
        - "Тогда говори тише, даже суп звенит."
        - "Я снял ботинки и прошёл по шерсти."
        - "Шерсть спасает от звука, не от любопытства."
        - "Смотритель не появился, только сердце стукнуло."
        - "Это твоё сердце. Оно тоже любит приключения."
        - "Вернулся целым и принёс светящиеся ягоды."
        - "Вот теперь у нас повод не шуметь."
    brewery_north_first_night:
      first-npc-id: 416
      second-npc-id: 417
      lines:
        - "Помнишь первую ночь без кровати?"
        - "Мы строили дом из земли и звали его крепостью."
        - "Крипер проверил архитектуру раньше рассвета."
        - "И поставил оценку взрывом."
        - "Зато утром нашли уголь и сделали факелы."
        - "А потом поняли, что факелы остались дома."
        - "С тех пор я ношу кровать даже на кухню."
        - "Не удивляйся, если завтрак будет в спальне."
    brewery_fire_minecart:
      first-npc-id: 407
      second-npc-id: 408
      lines:
        - "Рельсы к шахте опять скрипят."
        - "Это не скрип, вагонетка жалуется на подъём."
        - "Я добавил ускоряющие рельсы у поворота."
        - "Теперь руда приезжает быстрее моргания."
        - "Поставим сундук прямо у печи."
        - "Подпиши его: «не трогать, это ужин»."
        - "Если вагонетка потеряется, ищем по звуку."
        - "И по следу угля. Кухня всё выдаёт."
    brewery_fire_ender:
      first-npc-id: 407
      second-npc-id: 408
      lines:
        - "Кто оставил жемчуг Края возле компота?"
        - "Я. Проверял телепорт после обеда."
        - "И как?"
        - "Телепортировал себя на крышу, компот остался внизу."
        - "Зато увидел элитры на солнце."
        - "Элитры не сушатся, ты путаешь их с крыльями."
        - "В городе Края найдём шалкеры."
        - "Только не складывай их в кладовку."
    brewery_fire_archaeology:
      first-npc-id: 407
      second-npc-id: 408
      lines:
        - "У раскопок нашёл подозрительный песок."
        - "Трогал кистью или киркой?"
        - "Кистью. Выпала керамика с узором крипера."
        - "Значит, древние тоже не доверяли дверям."
        - "Ещё попалось яйцо нюхача."
        - "Нюхач нашёл семена быстрее, чем мы ложки."
        - "Предложим ему место во дворе."
        - "Только пусть не ищет древности в тарелках."
    brewery_fire_potions:
      first-npc-id: 407
      second-npc-id: 408
      lines:
        - "Зелье огнестойкости сегодня особенно кстати."
        - "Ты опять собираешься спорить с лавой?"
        - "Нет, просто поставил котёл близко к печи."
        - "Это эксперимент только после успешного ужина."
        - "Добавил редстоун — эффект стал дольше."
        - "А глоустоун сделает его ярче."
        - "Не перепутай ингредиенты с пряностями."
        - "После прошлого зелья суп светился три дня."
    brewery_fire_netherite:
      first-npc-id: 407
      second-npc-id: 408
      lines:
        - "Нашёл древние обломки под лавовым озером."
        - "И вернулся без единой царапины?"
        - "Сначала вернулся за ведром воды."
        - "Вот это настоящая предусмотрительность."
        - "Переплавлю их в незеритовый слиток."
        - "Не забудь алмазы. Незерит любит компанию."
        - "Сделаем из него новый топор для кухни."
        - "Пусть хотя бы доска будет легендарной."
    brewery_fire_raid:
      first-npc-id: 407
      second-npc-id: 408
      lines:
        - "У ворот заметили разбойников с флагом."
        - "Надеюсь, они пришли не на дегустацию."
        - "Я спрятал колокол и поставил щит у лестницы."
        - "А я спрятал печенье. Приоритеты разные."
        - "Если начнётся рейд, жители уйдут в дома."
        - "А мы?"
        - "Будем держать вход и не паниковать."
        - "Печенье оставь рядом. Для поддержки."
    brewery_east_creeper:
      first-npc-id: 419
      second-npc-id: 420
      lines:
        - "На восточной тропе крипер стоял под фонарём."
        - "Романтика закончилась, когда он зашипел?"
        - "Я отвёл его к пруду и поставил блок."
        - "Он оценил заботу и подарил кратер."
        - "Теперь тропа стала короче."
        - "Зато пещера открывается у самой лавки."
        - "Поставим знак: «бесплатный подземный вход»."
        - "И второй: «выход не гарантирован, суп да»."
    brewery_east_redstone:
      first-npc-id: 419
      second-npc-id: 420
      lines:
        - "Слышишь щелчки? Это дверь на поршнях."
        - "Она открывается от одного взгляда?"
        - "От плиты и правильного тайминга."
        - "Значит, взгляд всё-таки нужен, только ногами."
        - "Лампа показывает свободные столы."
        - "Красный свет — занято, зелёный — садись."
        - "А жёлтый что означает?"
        - "Что ты опять забыл убрать редстоун."
    brewery_east_nether:
      first-npc-id: 419
      second-npc-id: 420
      lines:
        - "Путь к порталу отмечен грибными фонарями."
        - "Красными или синими?"
        - "Красными туда, синими обратно."
        - "А если я выйду в лавовое море?"
        - "Тогда любой цвет станет убедительным."
        - "Возьму огнестойкость и блоки."
        - "И не забудь еду."
        - "Еду не забуду. Забуду только, зачем пошёл."
    brewery_east_villager:
      first-npc-id: 419
      second-npc-id: 420
      lines:
        - "У фермера появился новый обмен на морковь."
        - "Наконец-то кто-то ценит честный урожай."
        - "Я отдал ему полный ящик."
        - "Он посмотрел и попросил ещё."
        - "Жители считают изумруды без калькулятора."
        - "Зато не объясняют, куда делась скидка."
        - "Не будем злить деревенского голема."
        - "Согласен. Он уже смотрит на наши сундуки."
    brewery_east_warden:
      first-npc-id: 419
      second-npc-id: 420
      lines:
        - "В глубокой тьме даже вода звучит подозрительно."
        - "Там всё подозрительно, особенно твои шаги."
        - "Я положил шерстяную дорожку до сундука."
        - "Тогда сундук услышит тебя последним."
        - "Скалк поглотил стрелу и не поднял тревогу."
        - "Вот бы он поглощал кухонный шум."
        - "Оставим пещеры исследователям."
        - "И принесём им суп в шерстяной миске."
    brewery_east_first_night:
      first-npc-id: 419
      second-npc-id: 420
      lines:
        - "В первую ночь я поставил кровать на дереве."
        - "И долго искал её утром?"
        - "Пока не понял, что кровать упала со мной."
        - "Зато зомби не достал."
        - "Потом сделал крышу, дверь и окно."
        - "В таком порядке? Окно важнее двери?"
        - "В мире блоков сначала нужен свет, потом надежда."
        - "Хорошая вывеска для нашего ресторана."
    restaurant_a_minecart:
      first-npc-id: 433
      second-npc-id: 434
      lines:
        - "У нашей вагонетки маршрут длиннее списка блюд."
        - "Зато картошку доставляет без пробок."
        - "Я поставил датчик у кухонного тоннеля."
        - "Теперь вагонетка тормозит перед печью."
        - "Кто будет чистить рельсы от паутины?"
        - "Тот, кто назвал это автоматизацией."
        - "Всё равно приятно: руда едет сама."
        - "Главное — не сесть в неё вместо стула."
    restaurant_a_ender:
      first-npc-id: 433
      second-npc-id: 434
      lines:
        - "На небе мелькнула стрела с эффектом Края."
        - "Это была моя попытка попасть в мишень."
        - "Мишень была на другом острове."
        - "Значит, попытка была амбициозной."
        - "Когда-нибудь построим мост до города Края."
        - "Сначала лестницу на крышу без падений."
        - "Я уже научился тормозить элитрами."
        - "А я не стою под местом твоей посадки."
    restaurant_a_archaeology:
      first-npc-id: 433
      second-npc-id: 434
      lines:
        - "В раскопе нашли осколок кувшина."
        - "На нём кто-то нарисовал свинью."
        - "Древний автор понимал высокую кухню."
        - "Или часто ходил в Нижний мир."
        - "Нюхач выкопал семена факельного цветка."
        - "Поставим клумбу у входа."
        - "Только не называй её археологическим гарниром."
        - "Хорошо. Назову десертом для пчёл."
    restaurant_a_potions:
      first-npc-id: 433
      second-npc-id: 434
      lines:
        - "На стойке три зелья: скорость, сила и невидимость."
        - "Невидимость уже выпили?"
        - "Нет, но стул почему-то сам отодвинулся."
        - "Это я сел. Зелье тут ни при чём."
        - "Сила пригодится, если понесём новый сундук."
        - "Скорость — если повар услышит про тарелки."
        - "А что делает мёд в котле?"
        - "Добавляет смелости тому, кто не умеет варить."
    restaurant_a_netherite:
      first-npc-id: 433
      second-npc-id: 434
      lines:
        - "Незеритовая броня блестит даже в дыму."
        - "Жаль, от горячей тарелки не защищает."
        - "Я зачаровал нагрудник на огнестойкость."
        - "А перчатки на осторожность забыл."
        - "Древние обломки лежали под базальтом."
        - "В Нижнем мире ценное прячется под опасным."
        - "Как и лучшие запасы нашей кухни."
        - "Значит, секретный сундук охраняет повар?"
    restaurant_a_raid:
      first-npc-id: 433
      second-npc-id: 434
      lines:
        - "Капитан разбойников снова кружит у деревни."
        - "Поставь чайник. Может, это визит вежливости."
        - "Я проверил щиты и запас стрел."
        - "А я проверил, где праздничное печенье."
        - "Если спасём жителей, хлеб станет дешевле."
        - "Сначала переживём набег, потом торгуемся."
        - "Колокол ударит — все соберутся у площади."
        - "Ударь после ужина. Суп ещё остывает."
    restaurant_b_creeper:
      first-npc-id: 435
      second-npc-id: 436
      lines:
        - "Крипер выбрал самый тихий переулок."
        - "Конечно. Он уважает атмосферу ресторана."
        - "Я заметил его по зелёному отражению в стекле."
        - "А я по тому, что дверь стала короче."
        - "Поставим фонари и кошку возле склада."
        - "Кошка охраняет лучше любого сторожа."
        - "Крипер ушёл, а заряд остался?"
        - "Нет, только повод держать порох под замком."
    restaurant_b_redstone:
      first-npc-id: 435
      second-npc-id: 436
      lines:
        - "Я собрал автоматическую ферму тростника."
        - "Она растёт быстрее, чем мои планы."
        - "Поршень толкает стебли прямо в воду."
        - "А вода несёт их прямо в хоппер."
        - "Компаратор показывает, когда сундук полон."
        - "Тогда пора печь пирог и освобождать место."
        - "Механизм работает без единого жителя."
        - "Зато спорит с нами громче любого жителя."
    restaurant_b_nether:
      first-npc-id: 435
      second-npc-id: 436
      lines:
        - "Вчера портал зажёгся с первого огнива."
        - "Подозрительно удачный день."
        - "В Нижнем мире нашёл крепость без гастов."
        - "Ты точно был в Нижнем мире, не в кладовой?"
        - "Принёс кварц для новой стойки."
        - "Теперь каждый увидит, что мы богаты."
        - "Только не строй стойку рядом с лавой."
        - "Лаву оставим для праздничного освещения."
    restaurant_b_villager:
      first-npc-id: 435
      second-npc-id: 436
      lines:
        - "Библиотекарь снова просит сорок изумрудов."
        - "Он знает, что ты не проходишь мимо чар."
        - "Я предложил ему морковь."
        - "И как?"
        - "Он посмотрел, будто я предложил булыжник."
        - "Значит, переговоры ещё не начались."
        - "Фермер зато обменял урожай честно."
        - "Вот почему я доверяю тем, кто любит картошку."
    restaurant_b_warden:
      first-npc-id: 435
      second-npc-id: 436
      lines:
        - "Слышал про город в глубокой тьме?"
        - "Слышал. Там даже скалк просит не шуметь."
        - "Хочу исследовать его с шерстью и снегом."
        - "Снег шаги не заглушает, зато мешает."
        - "Возьму зелье ночного зрения."
        - "И карту, чтобы не искать выход на ощупь."
        - "Если встретим смотрителя, не геройствуем."
        - "Оставим суп и уйдём очень тихо."
    restaurant_b_first_night:
      first-npc-id: 435
      second-npc-id: 436
      lines:
        - "В первый вечер я выкопал дом прямо в горе."
        - "Практично. Окно сделал?"
        - "Нет, зато сделал три двери."
        - "Зомби выбрал ту, что без ручки."
        - "Ночью слушали скелетов за стеной."
        - "Утром поняли, что забыли крышу."
        - "С тех пор проверяю дом снизу вверх."
        - "И кровать ставлю подальше от края."
      first-npc-id: 419
      second-npc-id: 420
      first-line: "Здесь сегодня спокойнее, чем у площади."
      second-line: "И еду приносят вовремя."
    brewery_east_second:
      first-npc-id: 419
      second-npc-id: 420
      first-line: "Слышал, на кухне пробуют новый соус."
      second-line: "Тогда задержимся ещё на одно блюдо."
    brewery_waiters_tables:
      first-npc-id: 410
      second-npc-id: 411
      first-line: "Я возьму дальние столы."
      second-line: "Хорошо, я останусь у входа."
    brewery_waiters_kitchen:
      first-npc-id: 411
      second-npc-id: 410
      first-line: "На кухне готова следующая подача."
      second-line: "Вижу. Заберу через минуту."
    restaurant_a:
      first-npc-id: 433
      second-npc-id: 434
      first-line: "Тихо сегодня. Слышно, как кипит кухня."
      second-line: "Значит, повар не спорит с огнём."
    restaurant_a_second:
      first-npc-id: 433
      second-npc-id: 434
      first-line: "Этот стол всё-таки самый уютный."
      second-line: "Особенно когда у окна никого нет."
    restaurant_b:
      first-npc-id: 435
      second-npc-id: 436
      first-line: "После обеда выйдем к фонтану?"
      second-line: "Если официант не найдёт ещё одну работу."
    restaurant_b_second:
      first-npc-id: 435
      second-npc-id: 436
      first-line: "Рыба сегодня получилась особенно хорошо."
      second-line: "Тогда следующую тарелку не меняем."
    restaurant_waiters_tables:
      first-npc-id: 431
      second-npc-id: 432
      first-line: "Ты проверишь столы у окна?"
      second-line: "Да. Потом поменяемся."
    restaurant_waiters_kitchen:
      first-npc-id: 432
      second-npc-id: 431
      first-line: "Бар просил не задерживать напитки."
      second-line: "После этой подачи зайду."
    restaurant_bar:
      first-npc-id: 439
      second-npc-id: 431
      first-line: "Аня, на второй стол новое блюдо."
      second-line: "Уже несу. Марек пусть проверит напитки."
    restaurant_bar_second:
      first-npc-id: 439
      second-npc-id: 432
      first-line: "Для дальнего стола всё готово."
      second-line: "Заберу, как только освобожусь."
  service-dialogue-ids: [hot_plate, kitchen_ready, fresh_serving, new_course, bread_offer, chef_hurry]
  service-dialogues:
    hot_plate:
      waiter-line: "Ваше блюдо. Осторожно, тарелка горячая."
      guest-line: "Спасибо, поставьте здесь."
    kitchen_ready:
      waiter-line: "Кухня закончила ваш заказ."
      guest-line: "Отлично, как раз вовремя."
    fresh_serving:
      waiter-line: "Принёс свежее блюдо."
      guest-line: "Выглядит хорошо, спасибо."
    new_course:
      waiter-line: "Для вас новая подача."
      guest-line: "Можно оставить передо мной."
    bread_offer:
      waiter-line: "Нужен ещё хлеб к блюду?"
      guest-line: "Пока хватит, благодарю."
    chef_hurry:
      waiter-line: "Повар просил подать сразу."
      guest-line: "Тогда не будем его расстраивать."
