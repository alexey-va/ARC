  alchemist-tooltip: "<#e8dfd2>Объединить совместимые книги и пыль."
  special-title: "<#f4bd6a>Особые предметы"
  special-body: "<#e8dfd2>Выберите предмет, чтобы узнать, для чего он нужен и где его можно получить."
  special-white-label: "<#ffffff>Белый свиток"
  special-white-body: "<#f4bd6a>Что делает<newline><#e8dfd2>Предотвращает разрушение предмета, если наложение зачарованной книги не удалось.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Перетащите свиток на предмет в инвентаре.<newline><newline><#f4bd6a>Где получить<newline><#9bd48d>В наградах ежедневного тайника и недельной реликвии. У ящика нажмите ЛКМ, чтобы увидеть пул и шансы; ПКМ с ключом открывает его."
  special-black-label: "<#f4f4f4>Чёрный свиток"
  special-black-body: "<#f4bd6a>Что делает<newline><#e8dfd2>Снимает случайное доступное для снятия зачарование и возвращает его в книгу. Указанный на свитке шанс станет шансом успешного применения этой книги.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Перетащите свиток на предмет, с которого хотите снять зачарование.<newline><newline><#f4bd6a>Где получить<newline><#9bd48d>В наградах ежедневного тайника и недельной реликвии. У ящика нажмите ЛКМ, чтобы увидеть пул и шансы; ПКМ с ключом открывает его."
  special-magic-dust-label: "<#d6a5ff>Магическая пыль"
  special-magic-dust-body: "<#f4bd6a>Что делает<newline><#e8dfd2>Повышает шанс успеха на указанный процент, максимум до 100%. Подходит книге AE той же редкости или любой книге EliteMobs.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Перетащите пыль на одну книгу. При усилении тратится одна пыль; риск разрушения предмета становится нулевым.<newline><newline><#f4bd6a>Где получить<newline><#9bd48d>Из секретной пыли за обмен книг у /tinkerer, а также в наградах ежедневного тайника и недельной реликвии. У ящика нажмите ЛКМ, чтобы увидеть пул и шансы; ПКМ с ключом открывает его."
  special-holy-white-label: "<#f4bd6a>Святой белый свиток"
  special-holy-white-body: "<#f4bd6a>Что делает<newline><#e8dfd2>Защищает применённый предмет от потери при смерти.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Примените свиток к предмету, который хотите сохранить.<newline><newline><#f4bd6a>Где получить<newline><#9bd48d>В наградах недельной реликвии. У ящика нажмите ЛКМ, чтобы увидеть пул и шансы; ПКМ с ключом открывает его."
  special-dust-packets-label: "<#d6a5ff>Секретная и мистическая пыль"
  special-dust-packets-body: "<#f4bd6a>Что делают<newline><#e8dfd2>Секретная пыль — закрытый набор, который может содержать магическую или мистическую пыль. Мистическая пыль — бесполезный остаток неудачной магии, а не усилитель.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Нажмите ПКМ по секретной пыли, чтобы открыть её. Мистическую пыль нельзя применить к книге или предмету.<newline><newline><#f4bd6a>Где получить<newline><#9bd48d>Тинкер выдаёт секретную пыль за зачарованные книги: откройте /tinkerer. В ежедневном тайнике и недельной реликвии она не выпадает."
  special-randomizer-label: "<#d6a5ff>Свиток рандомизации"
  special-randomizer-body: "<#f4bd6a>Что делает<newline><#e8dfd2>Задаёт новые шансы успеха книги особых зачарований.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Перетащите свиток на зачарованную книгу подходящей группы.<newline><newline><#f4bd6a>Где получить<newline><#9bd48d>В наградах недельной реликвии. У ящика нажмите ЛКМ, чтобы увидеть пул и шансы; ПКМ с ключом открывает его."
  special-transmog-label: "<#f4bd6a>Свиток трансмогрификации"
  special-transmog-body: "<#f4bd6a>Что делает<newline><#e8dfd2>Сортирует зачарования на предмете по редкости и добавляет счётчик к его названию.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Примените свиток к нужному предмету.<newline><newline><#f4bd6a>Где получить<newline><#e8dfd2>В ежедневном тайнике и недельной реликвии не выпадает."
  special-soul-gem-label: "<#86dcf1>Камень душ"
  special-soul-gem-body: "<#f4bd6a>Что делает<newline><#e8dfd2>Переносит души из камня на совместимый предмет.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Перетащите камень на предмет. Чтобы извлечь накопленные души в камень, держите предмет в руке и выполните /withdrawsouls число.<newline><newline><#f4bd6a>Где получить<newline><#e8dfd2>Получите камень командой /withdrawsouls из душ, уже накопленных на предмете."
  special-orbs-label: "<#f4bd6a>Сфера и увеличитель слотов"
  special-orbs-body: "<#f4bd6a>Что делают<newline><#e8dfd2>Сферы для оружия, брони и инструментов увеличивают число слотов зачарований. Увеличитель слотов добавляет указанное на нём количество.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Перетащите подходящую сферу или увеличитель на предмет.<newline><newline><#f4bd6a>Где получить<newline><#e8dfd2>В ежедневном тайнике и недельной реликвии не выпадают."
  special-trackers-label: "<#86dcf1>Счётчики предмета"
  special-trackers-body: "<#f4bd6a>Что делают<newline><#e8dfd2>Счётчики отмечают сломанные блоки, убийства и пойманную рыбу.<newline><newline><#f4bd6a>Как использовать<newline><#e8dfd2>Перетащите нужный счётчик на инструмент, оружие или удочку, указанные в его подсказке.<newline><newline><#f4bd6a>Где получить<newline><#e8dfd2>В ежедневном тайнике и недельной реликвии не выпадают."
  acquisition-title: "<#9bd48d>Где получить"
  acquisition-body: "<#f4bd6a>Применение книг<newline><#e8dfd2>Перетащите книгу на подходящий предмет в инвентаре. Попытка происходит сразу, без меню и отдельной платы. В лоре указаны совместимость, шанс успеха и риск разрушения при неудаче. Книга расходуется при попытке; разрушение — не более 1% от неудачных попыток.<newline>Книги EliteMobs работают только с элитным снаряжением. Книги чар AE используют собственные зачарования, пыль и свитки.<newline><newline><#e8dfd2><#f4bd6a>Книги<newline><#e8dfd2>/enchanter открывает книги шести групп: простая, уникальная, сильная, мощная, легендарная и лучшая. Книги читерской группы в этом меню не указаны.<newline><newline><#f4bd6a>Тинкер и алхимик<newline><#e8dfd2>/tinkerer принимает ненужные книги в обмен на награду. /alchemist объединяет поддерживаемые книги и пыль; проверьте предметы и итог в его интерфейсе.<newline><newline><#f4bd6a>Тайники<newline><#e8dfd2>Свитки и пыль указаны среди наград ежедневного тайника или недельной реликвии. У нужного ящика нажмите ЛКМ, чтобы увидеть пул и шансы; ПКМ с ключом открывает его."
