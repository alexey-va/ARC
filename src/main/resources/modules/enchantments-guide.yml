  details-source-unavailable: "<#e8dfd2>Не входит в ассортимент зачарователя"
  details-application: "<#e8dfd2>Перетащите одну книгу на совместимый предмет: попытка начнётся сразу, книга расходуется. Проверьте шансы на книге. Магическая пыль повышает успех и снижает риск разрушения; белый свиток защищает предмет при неудаче."
  details-purchase-spawn-only: "<#f4bd6a>Купить книгу можно у зачарователя на спавне."
