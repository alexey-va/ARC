  details-application: "<#f4bd6a>Как применить<newline><#e8dfd2>Перетащите книгу на совместимый предмет: попытка начнётся сразу, книга расходуется. Новая книга имеет шанс успеха 40–80%; риск разрушения при неудаче — до 1%. Магическая пыль увеличивает шанс на указанное значение до 100% и снимает риск разрушения. Белый свиток защищает предмет при неудаче."
  details-purchase-spawn-only: "<#f4bd6a>Купить книгу можно у зачарователя на спавне."
  purchase-label: "<#9bd48d>Купить книгу"
