# Player-facing enchantment catalogue and item guide.
ui:
  title: "<#d6a5ff>Зачарования"
  overview: "<#e8dfd2>Дополнительные чары AdvancedEnchantments (AE) усиливают совместимое снаряжение. Откройте каталог, чтобы увидеть эффект, максимальный уровень и точные предметы.<newline><#f4bd6a>Как применить<newline><#e8dfd2>Перетащите книгу на подходящий предмет: попытка начнётся сразу, книга расходуется. У новой книги шанс успеха 40–80%; при неудаче риск разрушения предмета — до 1%. Магическая пыль прибавляет указанное на ней значение до 100% и снимает риск разрушения. Белый свиток защищает предмет при неудаче."
  unavailable-title: "<#f4bd6a>Каталог временно недоступен"
  unavailable-body: "<#e8dfd2>Каталог зачарований сейчас недоступен. Памятка по особым предметам и способам получения остаётся открыта."
  empty-catalog: "<#e8dfd2>Пока нет доступных зачарований."
  catalog-label: "<#d6a5ff>По снаряжению"
  catalog-tooltip: "<#e8dfd2>Шлемы, броня, оружие, инструменты и прочее."
