  special-tooltip: "<#e8dfd2>Свитки, пыль, сферы, увеличители слотов, души и счётчики."
  acquisition-label: "<#9bd48d>Где получить"
  acquisition-tooltip: "<#e8dfd2>Где взять книгу, пыль и свитки."
  enchanter-label: "<#f4bd6a>Открыть зачарователь"
  enchanter-tooltip: "<#e8dfd2>На спавне купить случайную книгу выбранной группы."
  tinkerer-label: "<#f4bd6a>Открыть тинкера"
  tinkerer-tooltip: "<#e8dfd2>Обменять ненужные книги на награду."
  alchemist-label: "<#f4bd6a>Открыть алхимика"
  alchemist-tooltip: "<#e8dfd2>Объединить совместимые книги и пыль."
  recycle-label: "<#f4bd6a>Переработать книги"
  recycle-tooltip: "<#e8dfd2>Открыть тинкера и обменять ненужные книги."
  alchemy-label: "<#d6a5ff>Объединить книги"
  alchemy-tooltip: "<#e8dfd2>Открыть алхимика, проверить сочетание и итог."
  special-title: "<#f4bd6a>Особые предметы"
  special-body: "<#e8dfd2>Назначение, применение и действующие источники каждого предмета. Страница <page>/<pages>."
  special-white-label: "<#f4bd6a>Белый свиток"
  special-white-summary: "<#e8dfd2>Защищает снаряжение от разрушения при неудачном наложении книги."
  special-white-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Защищает предмет от разрушения, если применение книги AE не удалось. Шанс успеха самой книги не повышает.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Возьмите свиток на курсор в инвентаре и нажмите ЛКМ по подходящему предмету. Свиток расходуется при установке; проверьте отметку защиты перед применением книги."
  special-black-label: "<#f4bd6a>Чёрный свиток"
  special-black-summary: "<#e8dfd2>Снимает одно случайное зачарование AE и возвращает его книгой."
  special-black-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Снимает одно случайное доступное зачарование AE. Указанный на свитке процент станет шансом успешного применения этой книги. Обычные чары Minecraft не снимает.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Оставьте свободную ячейку. Возьмите свиток на курсор и нажмите ЛКМ по одиночному предмету с чарами AE. Расходуется один свиток."
  special-magic-dust-label: "<#d6a5ff>Магическая пыль"
  special-magic-dust-summary: "<#e8dfd2>Повышает успех книги и снижает риск разрушения."
  special-magic-dust-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Добавляет к успеху книги указанное число процентных пунктов, до 100%, и на столько же уменьшает риск разрушения, до 0%. Для AE нужна та же редкость; для EliteMobs подходит любая редкость пыли.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Отделите одну книгу от стопки. Возьмите пыль на курсор и нажмите ЛКМ по книге: расходуется одна порция. Обычные книги Minecraft не подходят."
  special-holy-white-label: "<#f4bd6a>Легендарный камень возврата"
  special-holy-white-summary: "<#e8dfd2>Святой белый свиток: сохраняет предмет при смерти."
  special-holy-white-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Заранее защищает снаряжение от потери при смерти. Защита исчезает после одного срабатывания; это другой предмет, чем белый свиток от неудачного зачарования.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Оставьте свободную ячейку. Возьмите камень на курсор и нажмите ЛКМ по подходящему предмету. Чары AE заранее не требуются; расходуется один камень."
  special-secret-dust-label: "<#d6a5ff>Секретная пыль"
  special-secret-dust-summary: "<#e8dfd2>Закрытая порция: магическая пыль или бесполезный остаток."
  special-secret-dust-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>При открытии превращается в магическую либо мистическую пыль. Результат и сила магической пыли зависят от редкости; текущие вероятности — в разделе «Источники и шансы».<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Возьмите секретную пыль в основную руку и нажмите ПКМ. Расходуется одна порция. Магическую пыль затем можно применить к книге; мистическая её не усиливает."
  special-mystery-dust-label: "<#d6a5ff>Мистическая пыль"
  special-mystery-dust-summary: "<#e8dfd2>Неудачный результат открытия секретной пыли."
  special-mystery-dust-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Бесполезный остаток открытия секретной пыли. Не повышает шанс книги, не добавляет слоты и не заменяет магическую пыль.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>К книгам и снаряжению не применяется. Не тратьте её на попытки усиления; полезная пыль называется «Магическая пыль»."
  special-randomizer-label: "<#d6a5ff>Книга рандома"
  special-randomizer-summary: "<#e8dfd2>Заново выбирает шансы книги AE; чары и уровень сохраняются."
  special-randomizer-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Меняет шансы успеха и разрушения книги AE. Результат может стать лучше или хуже. Само зачарование и его уровень сохраняются.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Отделите одну книгу подходящей редкости. Возьмите свиток рандомизации на курсор и нажмите ЛКМ по книге. Расходуется один свиток."
  special-transmog-label: "<#f4bd6a>Свиток трансмогрификации"
  special-transmog-summary: "<#e8dfd2>Упорядочивает чары AE и добавляет их количество к названию."
  special-transmog-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Сортирует особые зачарования по редкости и добавляет их количество к названию предмета. Новые чары и слоты не добавляет.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>На предмете уже должны быть чары AE; обычных чар Minecraft недостаточно. Возьмите свиток на курсор и нажмите ЛКМ по предмету. Расходуется один свиток."
  special-soul-gem-label: "<#86dcf1>Камень душ"
  special-soul-gem-summary: "<#e8dfd2>Пополняет запас душ на предмете со счётчиком душ."
  special-soul-gem-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Переносит души из камня на предмет. Это заряд конкретного предмета для чар с расходом душ. При нехватке заряда такие чары не срабатывают.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Сначала установите счётчик душ. Затем возьмите камень на курсор и нажмите ЛКМ по одному совместимому предмету: расходуется один камень. Чтобы извлечь заряд, держите предмет в руке и выполните /withdrawsouls число."
  special-soul-tracker-label: "<#86dcf1>Счётчик душ"
  special-soul-tracker-summary: "<#e8dfd2>Открывает накопление душ на предмете для особых чар."
  special-soul-tracker-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Добавляет предмету запас душ. Камень душ можно применить только после установки этого счётчика. Запас принадлежит предмету; это не счётчик убийств игроков или мобов.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Отделите один совместимый предмет от стопки. Возьмите счётчик на курсор и нажмите ЛКМ по предмету без счётчика душ. Расходуется один счётчик; затем можно пополнять заряд камнями душ."
  special-orb-weapon-label: "<#f4bd6a>Сфера зачарования оружия"
  special-orb-weapon-summary: "<#e8dfd2>Задаёт новый общий лимит чар AE на оружии."
  special-orb-weapon-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>При успехе устанавливает общий лимит, написанный на сфере; это не прибавка указанного числа слотов. Шанс применения написан на самой сфере.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Подходит мечу, топору, луку, арбалету, трезубцу и булаве. На предмете уже нужна строка AE «Осталось зачарований». Возьмите сферу на курсор и нажмите ЛКМ по предмету. При неудаче сфера тоже расходуется."
  special-orb-armor-label: "<#f4bd6a>Сфера зачарования брони"
  special-orb-armor-summary: "<#e8dfd2>Задаёт новый общий лимит чар AE на броне."
  special-orb-armor-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>При успехе устанавливает общий лимит, написанный на сфере; это не прибавка указанного числа слотов. Шанс применения написан на самой сфере.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Подходит шлему, нагруднику, поножам и ботинкам со строкой AE «Осталось зачарований». Возьмите сферу на курсор и нажмите ЛКМ по предмету. При неудаче сфера тоже расходуется."
  special-orb-tool-label: "<#f4bd6a>Сфера зачарования инструмента"
  special-orb-tool-summary: "<#e8dfd2>Задаёт новый общий лимит чар AE на инструменте."
  special-orb-tool-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>При успехе устанавливает общий лимит, написанный на сфере; это не прибавка указанного числа слотов. Шанс применения написан на самой сфере.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Подходит кирке, лопате, мотыге и удочке со строкой AE «Осталось зачарований». Для топора нужна сфера оружия. Возьмите сферу на курсор и нажмите ЛКМ по предмету. При неудаче сфера тоже расходуется."
  special-slot-increaser-label: "<#f4bd6a>Увеличитель слотов"
  special-slot-increaser-summary: "<#e8dfd2>Добавляет свободные слоты AE до разрешённого предела."
  special-slot-increaser-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Добавляет указанное на нём количество свободных слотов до текущего предела улучшения. В отличие от сферы, это прибавка к слотам.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>На предмете нужна строка AE «Осталось зачарований». Возьмите увеличитель на курсор и нажмите ЛКМ по предмету. Расходуется один увеличитель. Если достигнут предел, увеличить слоты этим предметом нельзя."
  special-block-tracker-label: "<#86dcf1>Счётчик блоков"
  special-block-tracker-summary: "<#e8dfd2>Считает блоки, сломанные этим инструментом."
  special-block-tracker-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Записывает число блоков, сломанных инструментом. Не добавляет чары или души.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Подходит кирке, топору, лопате и мотыге. Возьмите счётчик на курсор и нажмите ЛКМ по инструменту. Чары AE заранее не требуются. Можно установить один счётчик этого типа; расходуется один предмет."
  special-player-tracker-label: "<#86dcf1>Счётчик убийств игроков"
  special-player-tracker-summary: "<#e8dfd2>Записывает убийства игроков этим оружием."
  special-player-tracker-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Считает убийства игроков этим предметом. Убийства мобов учитывает отдельный счётчик; души этот счётчик не хранит.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Возьмите счётчик на курсор и нажмите ЛКМ по оружию, которым будете сражаться. Чары AE заранее не требуются. Можно установить один счётчик этого типа; расходуется один предмет."
  special-mob-tracker-label: "<#86dcf1>Счётчик мобов"
  special-mob-tracker-summary: "<#e8dfd2>Записывает убийства мобов этим оружием."
  special-mob-tracker-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Считает убийства мобов этим предметом. Убийства игроков учитывает отдельный счётчик; души этот счётчик не хранит.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Подходит мечу, топору, булаве, мотыге, луку, арбалету и трезубцу. Возьмите счётчик на курсор и нажмите ЛКМ по оружию. Чары AE заранее не требуются. Устанавливается один счётчик этого типа; он расходуется."
  special-fish-tracker-label: "<#86dcf1>Счётчик рыбы"
  special-fish-tracker-summary: "<#e8dfd2>Считает улов этой удочкой."
  special-fish-tracker-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Добавляет удочке счётчик пойманной рыбы. В предмете может называться FishTrak Creator.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Возьмите счётчик на курсор и нажмите ЛКМ по удочке. Счётчик расходуется при установке. Действующие способы получения — в разделе «Источники и шансы»."
  special-item-name-tag-label: "<#f4bd6a>Название предмета"
  special-item-name-tag-summary: "<#e8dfd2>Бирка для переименования предмета через чат."
  special-item-name-tag-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Позволяет переименовать предмет с чарами AE или Minecraft. Одно переименование расходует одну бирку.<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Нажмите ПКМ с биркой в основной руке. Затем возьмите нужный предмет в основную руку и напишите новое имя в чат. Для отмены напишите cancel."
  special-box-base-label: "<#d6a5ff>Таинственная шкатулка чар"
  special-box-base-summary: "<#e8dfd2>Смешанные награды: пыль, книги и особые предметы."
  special-box-base-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Содержит случайные награды для зачарования. Каждый результат выбирается отдельно, поэтому награды могут повторяться. Состав и шансы — в разделе «Источники и шансы».<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Возьмите шкатулку в основную руку и нажмите ПКМ. Расходуется одна шкатулка. У ранее выданной шкатулки число наград может отличаться — проверьте её описание."
  special-box-enchanted-label: "<#d6a5ff>Зачарованная шкатулка AE"
  special-box-enchanted-summary: "<#e8dfd2>Несколько случайных книг зачарований."
  special-box-enchanted-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Содержит несколько независимо выбранных наград из своего набора. Состав, число наград и источники — в разделе «Источники и шансы».<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Возьмите шкатулку в основную руку и нажмите ПКМ. Расходуется одна шкатулка. У ранее выданного предмета число наград может отличаться — проверьте его описание."
  special-box-master-label: "<#d6a5ff>Мастерская шкатулка AE"
  special-box-master-summary: "<#e8dfd2>Усиленный запас случайных книг зачарований."
  special-box-master-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Содержит несколько независимо выбранных наград из своего набора. Состав, число наград и источники — в разделе «Источники и шансы».<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Возьмите шкатулку в основную руку и нажмите ПКМ. Расходуется одна шкатулка. У ранее выданного предмета число наград может отличаться — проверьте его описание."
  special-box-supply-label: "<#d6a5ff>Припасы чародея"
  special-box-supply-summary: "<#e8dfd2>Награда для усиления книг и снаряжения."
  special-box-supply-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Набор с наградами для зачарования. Источники, состав и шансы — в разделе «Источники и шансы».<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Возьмите припасы в основную руку и нажмите ПКМ. Открытие расходует один набор; освободите место для награды."
  special-box-boss-supply-label: "<#d6a5ff>Трофей чародея"
  special-box-boss-supply-summary: "<#e8dfd2>Награда с добычей для зачарования."
  special-box-boss-supply-body: "<#f4bd6a><bold>Назначение</bold><newline><newline><#e8dfd2>Набор с наградами для зачарования. Источники, состав и шансы — в разделе «Источники и шансы».<newline><newline><#f4bd6a><bold>Как использовать</bold><newline><newline><#e8dfd2>Возьмите трофей в основную руку и нажмите ПКМ. Открытие расходует один набор; освободите место для награды."
  sources-heading: "<#f4bd6a><bold>Получение и параметры</bold>"
  sources-page: "<#e8dfd2>Источники и содержимое · страница <page>/<pages>"
  source-pool-item: "<#d6a5ff><box><newline><#e8dfd2>Шанс за одну награду: <per_roll>%. Количество при выпадении: <amount>."
  source-per-box: "<#e8dfd2>Хотя бы один раз за новую шкатулку: <per_box>%."
  source-pool-item-value: "<#d6a5ff>Параметры награды · <box>"
  source-box-rolls: "<#e8dfd2>Сейчас новые шкатулки дают <range> независимых наград. Результаты могут повторяться; шанс ниже указан за одну награду. Ранее выданные шкатулки могут иметь другое число наград."
  source-box-content: "<#d6a5ff><item><newline><#e8dfd2>Шанс за одну награду: <per_roll>%. Количество: <amount>."
  source-pool-source: "<#d6a5ff>В составе набора «<pool>»<newline><#e8dfd2>Шанс за один выбор награды: <per_roll>%. Количество: <amount>. Этот состав используется только там, где выдаётся такой набор."
  source-boss-source: "<#d6a5ff>Элитные боссы<newline><#e8dfd2>За подходящее убийство босса: <chance>%. Количество: <amount>."
  source-natural-dust: "<#d6a5ff>Охота и рыбалка<newline><#e8dfd2>Естественный враждебный моб, убитый игроком: <kill>%; рыбалка в открытой воде: <fishing>%. Пыль усиливает книгу на <min>–<max> п. п. Миры: <worlds>. Не более одного результата за событие."
  source-natural-books: "<#d6a5ff>Книги за охоту и рыбалку<newline><#e8dfd2>Шанс розыгрыша книги: естественный враждебный моб, убитый игроком — <kill>%; рыбалка в открытой воде — <fishing>%. Миры: <worlds>. Если подходящих чар или уровней нет, книга не выдаётся. Не более одного результата за событие."
  source-no-drop: "<#e8dfd2>В действующих наборах наград этого сервера такой предмет не найден."
