id: enchant_supply
# Exactly one reward per sealed supply. Dust amount is one item; int controls success boost.
treasures:
  - type: ae
    id: enchant_supply_dust
    kind: item
    name: magic
    amount: 1
    weight: 80
    args:
      - tier: random
      - int: 1-3
  - type: ae
    id: enchant_supply_simple_book
    kind: random_book
    group: SIMPLE
    max-level: 1
    amount: 1
    weight: 15
  - type: ae
    id: enchant_supply_unique_book
    kind: random_book
    group: UNIQUE
    max-level: 1
    amount: 1
    weight: 5
